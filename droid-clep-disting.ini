# Clep Disting — Multi-Mode CV Generator
# Port of disting NT clep_disting.lua by Thorinside
#
# Three switchable modes of clocked CV generation:
#   Step:   Algorithmic sequence (rerollable, remembered)
#   Random: New random value each clock step
#   LFO:   Stepped 8-point sine wave
#
# INPUTS:
#  I1: Clock (normaled to internal LFO)
#  I2: Reset
#
# OUTPUTS:
#  O1: CV Output (selected mode, optionally quantized)
#  O2: Gate Output (step mode = pattern, random/LFO = every step)
#  O3: BOC Trigger (beginning of cycle, once per N steps)
#  O4-O8: [unused]
#
# CONTROLLER 1 (p2b8):
#  P1.1: Clock Rate
#  P1.2: Steps (1-8, notched)
#  B1.1: Run/Stop
#  B1.2: Reset
#  B1.3: Mode — Step (default)
#  B1.4: Mode — Random
#  B1.5: Mode — LFO
#  B1.6: Reroll (randomize step sequence)
#  B1.7: Quantize On/Off (LED on = quantized to scale)
#  B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[copy]
    input = I1 * _RUNNING
    output = _CLOCK

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# -------------------------------------------------
# Mode Select & Controls
# -------------------------------------------------

[buttongroup]
    button1 = B1.3
    button2 = B1.4
    button3 = B1.5
    led1 = L1.3
    led2 = L1.4
    led3 = L1.5
    buttonoutput1 = _MODE_STEP
    buttonoutput2 = _MODE_RANDOM
    buttonoutput3 = _MODE_LFO

[copy]
    input = _MODE_RANDOM * 0.5 + _MODE_LFO
    output = _MODE_SELECT

[button]
    button = B1.6
    led = L1.6
    states = 1
    output = _REROLL

[button]
    button = B1.7
    led = L1.7
    startvalue = 1
    output = _QUANTIZE

[pot]
    pot = P1.2
    notch = 0.143
    output = _STEPS_RAW

# -------------------------------------------------
# Step Mode (Algoquencer)
# -------------------------------------------------
#
# Generates a remembered random pitch sequence. Reroll
# (B1.6) creates a new pattern. Dejavu = 1 keeps the
# sequence stable until rerolled.

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    reroll = _REROLL
    activity = 0.7
    variation = 0.5
    dejavu = 1
    steps = _STEPS_RAW * 7 + 1
    pitch = _STEP_CV
    gate = _STEP_GATE

# -------------------------------------------------
# Random Mode
# -------------------------------------------------

[random]
    trigger = _CLOCK
    min = 0
    max = 1
    output = _RAND_CV

# -------------------------------------------------
# LFO Mode (stepped sine)
# -------------------------------------------------
#
# 8-point sine lookup. Step count (P1.2) sets how many
# points play: 8 = full cycle, 4 = positive half,
# fewer = partial wave.

[sequencer]
    clock = _CLOCK
    reset = _RESET
    steps = _STEPS_RAW * 7 + 1
    cv1 = 0.5
    cv2 = 0.854
    cv3 = 1.0
    cv4 = 0.854
    cv5 = 0.5
    cv6 = 0.146
    cv7 = 0.0
    cv8 = 0.146
    output = _LFO_CV

# -------------------------------------------------
# Mode Routing
# -------------------------------------------------

[switch]
    input1 = _STEP_CV
    input2 = _RAND_CV
    input3 = _LFO_CV
    offset = _MODE_SELECT
    output = _CV_RAW

[switch]
    input1 = _STEP_GATE
    input2 = _CLOCK
    input3 = _CLOCK
    offset = _MODE_SELECT
    output = _GATE_OUT

# -------------------------------------------------
# Scale Quantization (toggle with B1.7)
# -------------------------------------------------

[minifonion]
    input = _CV_RAW
    root = 0
    degree = 7
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _CV_Q

[switch]
    input1 = _CV_RAW
    input2 = _CV_Q
    offset = _QUANTIZE
    output = O1

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[copy]
    input = _GATE_OUT
    output = O2

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _STEPS_RAW * 7 + 1
    output = O3
