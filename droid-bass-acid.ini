# Acid Bass (303-Style) Modulation Engine
# CV co-processor for TB-303-style acid bass. Fast-decaying filter envelope
# with high resonance, accent system that boosts filter cutoff on marked
# steps, and exponential slide (portamento) between notes. Pure modulation
# engine — receives external triggers/pitch and outputs 303-style CVs.
#
# Part of the bass modulation engine series. Receives gate/pitch from a
# sequencer and outputs genre-specific CVs for filter, VCA, and modulation.
#
# INPUTS:
#   I1: Gate/Trigger (note on/off)
#   I2: Clock (unused in this patch, normaled)
#   I3: Pitch CV (1V/oct from sequencer)
#   I4: Accent CV (>0.5 = accented note)
#
# OUTPUTS:
#   O1: Pitch CV (with slide/portamento applied)
#   O2: Filter CV (MEG envelope + accent envelope combined)
#   O3: VCA CV (amplitude envelope with accent peak)
#   O4: Accent envelope (separate, for routing to other destinations)
#   O5: Resonance CV (high static level)
#   O6: Accent raw CV pass-through (for driving other modules)
#   O7: Inverted filter env (for sub ducking during bright sweeps)
#   O8: Gate out
#
# CONTROLLER 1 (p2b8):
#   P1.1: Filter decay (the primary 303 "shape" knob, 200ms-2s)
#   P1.2: Accent amount (how much accent boosts filter cutoff)
#   B1.1: Active (LED)
#   B1.2: Env mod depth (3 states: subtle/classic/screaming)
#   B1.3: Slide time (2 states: short 40ms / long 80ms)
#   B1.4: Accent accumulation toggle (consecutive accent stacking)
#   B1.5: Resonance level (2 states: medium 50% / high 85%)
#   B1.6: Filter base shift (2 states: deep/bright)
#
# SUGGESTED ROUTING:
#   O1 -> C4RBN pitch (saturation + wavefolding is perfect for acid)
#   O2 -> C4RBN cutoff CV
#   O3 -> Aikido VCA CV
#   O5 -> C4RBN resonance CV

[p2b8]

# ================================================================
# Controls
# ================================================================

# -------------------------------------------------
# Pots — Sweet Spot Tuned
# -------------------------------------------------

# P1.1: Filter decay — quadratic scaling for 303 "shape" knob
# Maps pot 0-1 to contour param 0.04-1.84 (roughly 200ms to 9s)
# First 50% of pot = 200-650ms (the sweet spot), last 50% = extreme
[copy]
    input = P1.1 * P1.1 * 1.8 + 0.04
    output = _FILTER_DECAY

# P1.2: Accent amount — quadratic scaling for subtle accent range
# Sweet spot is 20-50% boost. Most resolution in subtle accent range.
[copy]
    input = P1.2 * P1.2 * 0.8 + 0.05
    output = _ACCENT_AMOUNT

# -------------------------------------------------
# Buttons
# -------------------------------------------------

# B1.1: Active toggle (LED shows patch is active)
[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _ACTIVE

# B1.2: Env mod depth — 3 states: subtle (40%) / classic (65%) / screaming (95%)
# Controls how much the filter envelope opens the filter
[button]
    button = B1.2
    led = L1.2
    states = 3
    output = _ENV_DEPTH_STATE

[switch]
    input1 = 0.40
    input2 = 0.65
    input3 = 0.95
    offset = _ENV_DEPTH_STATE
    output1 = _ENV_DEPTH

# B1.3: Slide time — 2 states: short 40ms / long 80ms
[button]
    button = B1.3
    led = L1.3
    states = 2
    output = _SLIDE_STATE

[switch]
    input1 = 0.008    # short: 40ms
    input2 = 0.016    # long: 80ms
    offset = _SLIDE_STATE
    output1 = _SLIDE_TIME

# B1.4: Accent accumulation toggle
# When on, consecutive accents build up via slow slew decay
[button]
    button = B1.4
    led = L1.4
    output = _ACCUM_ON

# B1.5: Resonance level — 2 states: medium 50% / high 85%
[button]
    button = B1.5
    led = L1.5
    states = 2
    output = _RESO_STATE

[switch]
    input1 = 0.50     # medium
    input2 = 0.85     # high (screaming)
    offset = _RESO_STATE
    output1 = _RESONANCE_LEVEL

# B1.6: Filter base shift — 2 states: deep / bright
# Shifts the filter cutoff base offset
[button]
    button = B1.6
    led = L1.6
    states = 2
    output = _BASE_STATE

[switch]
    input1 = 0.08     # deep: low base cutoff
    input2 = 0.22     # bright: higher base cutoff
    offset = _BASE_STATE
    output1 = _FILTER_BASE

# ================================================================
# Accent Detection
# ================================================================

# -------------------------------------------------
# Threshold accent input — accent active when I4 > 0.5
# -------------------------------------------------

[compare]
    input = I4
    compare = 0.5
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _ACCENT_FLAG

# ================================================================
# Pitch Processing — Slide / Portamento
# ================================================================

# -------------------------------------------------
# Exponential slew on pitch CV — always active
# -------------------------------------------------
# The external sequencer controls legato (tied gates). The slew is
# always applied; short notes will reach target pitch before the
# next note, while legato notes will glide audibly.

[slew]
    input = I3
    slewup = _SLIDE_TIME
    slewdown = _SLIDE_TIME
    output = _PITCH_SLEWED

# ================================================================
# Envelope Section
# ================================================================

# -------------------------------------------------
# Main filter envelope (MEG) — the core 303 shape
# -------------------------------------------------
# Attack ~3ms, Decay from P1.1 (200ms-2s), Sustain 0%, Release = Decay.
# This is the fast-decaying filter sweep that defines the acid sound.

[contour]
    gate = I1 * _ACTIVE
    attack = 0.001    # 3ms
    decay = _FILTER_DECAY
    sustain = 0
    release = _FILTER_DECAY
    output = _MEG_RAW

# -------------------------------------------------
# Accent envelope — separate contour for accent boost
# -------------------------------------------------
# Only fires on accented notes (I4 > 0.5). Attack 15ms, Decay 300ms.
# Adds on top of MEG to boost filter CV on accented steps.

[contour]
    gate = I1 * _ACCENT_FLAG * _ACTIVE
    attack = 0.003    # 15ms
    decay = 0.06      # 300ms
    sustain = 0
    release = 0.06    # 300ms
    output = _ACCENT_ENV_RAW

# -------------------------------------------------
# Accent accumulation — slow slew on accent envelope
# -------------------------------------------------
# When accumulation is ON, consecutive accents build up because the
# slew's slow decay prevents the accent envelope from fully discharging
# between notes. When OFF, accent envelope passes through clean.

[slew]
    input = _ACCENT_ENV_RAW
    slewup = 0        # instant attack (let the contour shape it)
    slewdown = 0.08 * _ACCUM_ON   # slow decay only when accumulation on (~400ms)
    output = _ACCENT_ENV

# -------------------------------------------------
# VCA envelope — gate-held with accent peak
# -------------------------------------------------
# Instant attack, held during gate, instant release. The accent
# envelope adds a percussive ~30% peak on top.

[contour]
    gate = I1 * _ACTIVE
    attack = 0        # instant
    decay = 0
    sustain = 1.0
    release = 0       # instant
    output = _VCA_ENV_BASE

# VCA = base envelope + accent peak (30% of accent env)
[copy]
    input = _VCA_ENV_BASE + _ACCENT_ENV * 0.3
    output = _VCA_CV

# ================================================================
# CV Mixing — Filter Cutoff
# ================================================================

# -------------------------------------------------
# Combine all filter modulation sources
# -------------------------------------------------
# Filter CV = filter base offset
#           + (MEG * env depth)
#           + (accent env * accent amount)
#
# The MEG decay stays at whatever P1.1 sets regardless of accent.
# Accent adds extra brightness on top via the separate accent envelope.

# Scale MEG by envelope depth setting (subtle/classic/screaming)
[copy]
    input = _MEG_RAW * _ENV_DEPTH
    output = _MEG_SCALED

# Scale accent envelope by accent amount knob
[copy]
    input = _ACCENT_ENV * _ACCENT_AMOUNT
    output = _ACCENT_SCALED

# Sum all filter CV sources
[copy]
    input = _FILTER_BASE + _MEG_SCALED + _ACCENT_SCALED
    output = _FILTER_CV

# -------------------------------------------------
# Inverted filter env — for sub ducking during bright sweeps
# -------------------------------------------------
# When filter envelope is high (bright sweep), this goes low —
# useful for ducking a sub oscillator during the bright attack.

[copy]
    input = (1 - _MEG_RAW) * _ENV_DEPTH
    output = _INVERTED_FILTER_ENV

# ================================================================
# Outputs
# ================================================================

# O1: Pitch CV — with slide/portamento applied
[copy]
    input = _PITCH_SLEWED
    output = O1

# O2: Filter CV — MEG envelope + accent envelope combined
[copy]
    input = _FILTER_CV
    output = O2

# O3: VCA CV — amplitude envelope with accent peak
[copy]
    input = _VCA_CV
    output = O3

# O4: Accent envelope — separate, for routing to other destinations
[copy]
    input = _ACCENT_ENV
    output = O4

# O5: Resonance CV — high static level from switch
[copy]
    input = _RESONANCE_LEVEL
    output = O5

# O6: Accent raw CV pass-through — for driving other modules
[copy]
    input = I4
    output = O6

# O7: Inverted filter env — for sub ducking during bright sweeps
[copy]
    input = _INVERTED_FILTER_ENV
    output = O7

# O8: Gate out — pass-through of input gate
[copy]
    input = I1 * _ACTIVE
    output = O8
