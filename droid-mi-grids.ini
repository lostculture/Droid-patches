# MI Grids Clone for DROID
# Topographic drum sequencer — 3-channel gate/accent generator
# with XY map morphing, density control, and chaos.
#
# Pattern data from Mutable Instruments Grids by Emilie Gillet (GPL v3+)
# https://github.com/pichenettes/eurorack/tree/master/grids
#
# 4-node (2x2 corner) bilinear interpolation:
#   Node 0  (TL): Four-on-the-floor / clean backbeat / steady 8ths
#   Node 4  (TR): Busy, rolling / backbeat + fills / active HH
#   Node 20 (BL): Syncopated, Afro-Cuban / polyrhythmic / sparse HH
#   Node 24 (BR): Dense, fine-resolution / sparse w/ rolls / rapid-fire HH
#
# Hardware: [p2b8] [p2b8]
#
# I1: Clock in   I2: Reset in
# O1: BD gate    O2: SD gate    O3: HH gate
# O4: BD accent  O5: SD accent  O6: HH accent
# O7: Clock thru O8: (spare)
#
# P1.1: Clock rate   P1.2: Map X (left-right)
# P2.1: Map Y (top-bottom)  P2.2: Density
# B1.1: Run/Stop     B1.2: Reset
# B1.3: Chaos on/off
# B2.1: BD mute  B2.2: SD mute  B2.3: HH mute

[p2b8]
[p2b8]

# ============================================================
# SECTION 1: TRANSPORT
# ============================================================

# Internal clock (normaled to I1)
[lfo]
    hz = 4 * P1.1 + 0.5
    square = N1

# Run/Stop toggle
[button]
    button = B1.1
    led = L1.1
    onvalue = 1
    offvalue = 0
    output = _RUNNING

# Reset button
[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

# Merge reset sources (button + I2)
[copy]
    input = _RESET_BTN + I2
    output = _RESET

# Gate clock with run state
[copy]
    input = N1 * _RUNNING
    output = _CLOCK

# Clock thru to O7
[copy]
    input = _CLOCK
    output = O7

# ============================================================
# SECTION 2: PAGE-FLIP (16-step via 2x8)
# ============================================================

# Divide clock by 8 for page boundary
[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = 8
    output = _PAGE_TICK

# Page toggle (0 = page A, 1 = page B)
[flipflop]
    toggle = _PAGE_TICK
    reset = _RESET
    output = _PAGE

# Route clock to page A or B
[copy]
    input = _CLOCK * -1 * _PAGE + _CLOCK
    output = _CLOCK_A

[copy]
    input = _CLOCK * _PAGE
    output = _CLOCK_B

