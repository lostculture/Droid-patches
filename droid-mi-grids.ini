# ============================================================
# SECTION 5: BILINEAR INTERPOLATION — 9 CROSSFADERS
# ============================================================

# BD: Top row (Node 0 ↔ Node 4) by X
[crossfader]
    input1 = _N0_BD
    input2 = _N4_BD
    fade = _MAP_X
    output1 = _TOP_BD

# BD: Bottom row (Node 20 ↔ Node 24) by X
[crossfader]
    input1 = _N20_BD
    input2 = _N24_BD
    fade = _MAP_X
    output1 = _BOT_BD

# BD: Vertical (Top ↔ Bottom) by Y
[crossfader]
    input1 = _TOP_BD
    input2 = _BOT_BD
    fade = _MAP_Y
    output1 = _LEVEL_BD

# SD: Top row (Node 0 ↔ Node 4) by X
[crossfader]
    input1 = _N0_SD
    input2 = _N4_SD
    fade = _MAP_X
    output1 = _TOP_SD

# SD: Bottom row (Node 20 ↔ Node 24) by X
[crossfader]
    input1 = _N20_SD
    input2 = _N24_SD
    fade = _MAP_X
    output1 = _BOT_SD

# SD: Vertical (Top ↔ Bottom) by Y
[crossfader]
    input1 = _TOP_SD
    input2 = _BOT_SD
    fade = _MAP_Y
    output1 = _LEVEL_SD

# HH: Top row (Node 0 ↔ Node 4) by X
[crossfader]
    input1 = _N0_HH
    input2 = _N4_HH
    fade = _MAP_X
    output1 = _TOP_HH

# HH: Bottom row (Node 20 ↔ Node 24) by X
[crossfader]
    input1 = _N20_HH
    input2 = _N24_HH
    fade = _MAP_X
    output1 = _BOT_HH

# HH: Vertical (Top ↔ Bottom) by Y
[crossfader]
    input1 = _TOP_HH
    input2 = _BOT_HH
    fade = _MAP_Y
    output1 = _LEVEL_HH


# ============================================================
# SECTION 6: CHAOS
# ============================================================

# Chaos toggle (B1.3)
[button]
    button = B1.3
    led = L1.3
    onvalue = 1
    offvalue = 0
    output = _CHAOS_ON

# Per-step random offset
[random]
    trigger = _CLOCK
    minimum = -0.15
    maximum = 0.15
    output = _CHAOS_RAW

# BD: add chaos when enabled
[copy]
    input = _LEVEL_BD + _CHAOS_RAW * _CHAOS_ON
    output = _LEVEL_BD_C

# SD: add chaos when enabled
[copy]
    input = _LEVEL_SD + _CHAOS_RAW * _CHAOS_ON
    output = _LEVEL_SD_C

# HH: add chaos when enabled
[copy]
    input = _LEVEL_HH + _CHAOS_RAW * _CHAOS_ON
    output = _LEVEL_HH_C


# ============================================================
# SECTION 7: DENSITY THRESHOLD
# ============================================================

# BD: gate fires when level > (1 - density)
[compare]
    input = _LEVEL_BD_C
    compare = -1 * _DENSITY + 1
    ifgreater = 1
    else = 0
    output = _GATE_BD_RAW

# SD: gate fires when level > (1 - density)
[compare]
    input = _LEVEL_SD_C
    compare = -1 * _DENSITY + 1
    ifgreater = 1
    else = 0
    output = _GATE_SD_RAW

# HH: gate fires when level > (1 - density)
[compare]
    input = _LEVEL_HH_C
    compare = -1 * _DENSITY + 1
    ifgreater = 1
    else = 0
    output = _GATE_HH_RAW


# ============================================================
# SECTION 8: ACCENT THRESHOLD
# ============================================================

# BD: accent when level > 0.753 (192/255)
[compare]
    input = _LEVEL_BD_C
    compare = 0.753
    ifgreater = 1
    else = 0
    output = _ACCENT_BD_RAW

# SD: accent when level > 0.753 (192/255)
[compare]
    input = _LEVEL_SD_C
    compare = 0.753
    ifgreater = 1
    else = 0
    output = _ACCENT_SD_RAW

# HH: accent when level > 0.753 (192/255)
[compare]
    input = _LEVEL_HH_C
    compare = 0.753
    ifgreater = 1
    else = 0
    output = _ACCENT_HH_RAW


# ============================================================
# SECTION 9: MUTES & OUTPUTS
# ============================================================

# BD mute toggle (inverted: LED on = unmuted)
[button]
    button = B2.1
    led = L2.1
    onvalue = 1
    offvalue = 0
    startvalue = 1
    output = _UNMUTE_BD

# SD mute toggle (inverted: LED on = unmuted)
[button]
    button = B2.2
    led = L2.2
    onvalue = 1
    offvalue = 0
    startvalue = 1
    output = _UNMUTE_SD

# HH mute toggle (inverted: LED on = unmuted)
[button]
    button = B2.3
    led = L2.3
    onvalue = 1
    offvalue = 0
    startvalue = 1
    output = _UNMUTE_HH

# BD gate → O1
[copy]
    input = _GATE_BD_RAW * _UNMUTE_BD
    output = O1

# BD accent → O4
[copy]
    input = _ACCENT_BD_RAW * _UNMUTE_BD
    output = O4

# SD gate → O2
[copy]
    input = _GATE_SD_RAW * _UNMUTE_SD
    output = O2

# SD accent → O5
[copy]
    input = _ACCENT_SD_RAW * _UNMUTE_SD
    output = O5

# HH gate → O3
[copy]
    input = _GATE_HH_RAW * _UNMUTE_HH
    output = O3

# HH accent → O6
[copy]
    input = _ACCENT_HH_RAW * _UNMUTE_HH
    output = O6


# ============================================================
# SECTION 10: CONTROLS
# ============================================================

# Map X (P1.2)
[pot]
    pot = P1.2
    output = _MAP_X

# Map Y (P2.1)
[pot]
    pot = P2.1
    output = _MAP_Y

# Density (P2.2)
[pot]
    pot = P2.2
    output = _DENSITY

# Beginning-of-cycle indicator (÷16)
[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = 16
    output = _BOC
