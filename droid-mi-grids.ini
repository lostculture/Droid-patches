# ============================================================

# Node 0, BD: merge pages
[switch]
    input1 = _N0_BD_A
    input2 = _N0_BD_B
    offset = _PAGE
    output1 = _N0_BD

# Node 0, SD: merge pages
[switch]
    input1 = _N0_SD_A
    input2 = _N0_SD_B
