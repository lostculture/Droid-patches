# Liquid DnB Bass Modulation Engine
# CV co-processor for liquid drum & bass basslines. Slow, flowing filter
# sweeps that evolve over 2-4 bars. Long sustain, gentle modulation,
# minimal distortion. The bass "breathes" — filter opens slowly, closes
# slowly, with very slow LFOs adding organic drift.
#
# Part of the bass modulation engine series. Receives gate/pitch from a
# sequencer and outputs genre-specific CVs for filter, VCA, and modulation.
#
# INPUTS:
#   I1: Gate/Trigger (note on/off)
#   I2: Clock (for tempo-synced features, normaled to internal LFO)
#   I3: Pitch CV (1V/oct from sequencer — passed through)
#   I4: Accent/Velocity CV (optional, 0-1)
#
# OUTPUTS:
#   O1: Pitch CV (clean pass-through of I3)
#   O2: Filter CV (envelope + LFO modulation for filter cutoff)
#   O3: VCA CV (amplitude envelope)
#   O4: Mod CV (copy of slow filter LFO for second destination)
#   O5: Resonance CV (static low level)
#   O6: Extra mod (slow triangle for wavefolder/phaser)
#   O7: Sub level (inverted VCA for sub emphasis during sustain)
#   O8: Gate out (from I1)
#
# CONTROLLER 1 (p2b8):
#   P1.1: Filter sweep depth (how far the filter opens on each note)
#   P1.2: LFO rate (liquid movement speed, 0.05-0.5 Hz)
#   B1.1: Active (LED)
#   B1.2: Mod depth (3 states: subtle/medium/lush)
#   B1.3: Sweep shape (2 states: smooth/punchy)
#   B1.4: Drift toggle (enables/disables very slow macro LFO)
#   B1.5: Brightness base (2 states: dark/warm)
#   B1.6: Long release toggle (doubles all release times)
#
# SUGGESTED ROUTING:
#   O1 → Furthrrrr Generator pitch
#   O2 → C4RBN cutoff CV
#   O3 → Aikido VCA CV
#   O4 → Ikarie filter CV
#   O6 → Pittsburgh Toad phaser depth
#   O7 → Autodub sub VCA CV

[p2b8]

# ================================================================
# Controls
# ================================================================

# -------------------------------------------------
# Pots — Sweet Spot Tuned
# -------------------------------------------------

# P1.1: Filter sweep depth — quadratic scaling
# First 50% of pot = 10-32% depth (subtle), last 50% = 32-100% (dramatic)
[copy]
    input = P1.1 * P1.1 * 0.9 + 0.1
    output = _SWEEP_DEPTH

# P1.2: LFO rate — quadratic scaling for slow liquid range
# Most pot travel in 0.05-0.2 Hz, only last bit goes above 0.3 Hz
[copy]
    input = P1.2 * P1.2 * 0.45 + 0.05
    output = _LFO_RATE

# -------------------------------------------------
# Buttons
# -------------------------------------------------

# B1.1: Active toggle (LED shows patch is active)
[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _ACTIVE

# B1.2: Mod depth — 3 states: subtle (8%) / medium (18%) / lush (30%)
[button]
    button = B1.2
    led = L1.2
    states = 3
    output = _MOD_DEPTH_STATE

[switch]
    input1 = 0.08
    input2 = 0.18
    input3 = 0.30
    offset = _MOD_DEPTH_STATE
    output1 = _MOD_DEPTH

# B1.3: Sweep shape — 2 states: smooth / punchy
# Smooth = longer filter decay (600ms), Punchy = shorter (150ms)
[button]
    button = B1.3
    led = L1.3
    states = 2
    output = _SWEEP_SHAPE_STATE

[switch]
    input1 = 0.12     # smooth: 600ms decay
    input2 = 0.03     # punchy: 150ms decay
    offset = _SWEEP_SHAPE_STATE
    output1 = _FILTER_DECAY

# B1.4: Drift toggle — enables very slow macro LFO (~0.01 Hz)
[button]
    button = B1.4
    led = L1.4
    output = _DRIFT_ON

# B1.5: Brightness base — 2 states: dark / warm
# Shifts the filter cutoff base offset
[button]
    button = B1.5
    led = L1.5
    states = 2
    output = _BRIGHTNESS_STATE

[switch]
    input1 = 0.10     # dark: low base cutoff
    input2 = 0.25     # warm: higher base cutoff
    offset = _BRIGHTNESS_STATE
    output1 = _BRIGHTNESS_BASE

# B1.6: Long release toggle — doubles all release times
[button]
    button = B1.6
    led = L1.6
    output = _LONG_RELEASE

# ================================================================
# LFO Section — Liquid Movement
# ================================================================

# -------------------------------------------------
# Primary liquid LFO (0.05-0.5 Hz sine)
# -------------------------------------------------
# This is the core "liquid" movement — slow sine wave modulating the
# filter cutoff. Rate controlled by P1.2 with quadratic scaling.

[lfo]
    hz = _LFO_RATE
    sine = _LFO_RAW

# Scale LFO by mod depth setting (subtle/medium/lush)
[copy]
    input = _LFO_RAW * _MOD_DEPTH
    output = _LFO_SCALED

# -------------------------------------------------
# Very slow drift LFO (~0.01 Hz)
# -------------------------------------------------
# Modulates filter envelope depth over bars, creating evolving brightness.
# Only active when drift toggle is on.

[lfo]
    hz = 0.01
    triangle = _DRIFT_RAW

# Drift modulates sweep depth by +/- 15% when enabled
[copy]
    input = _DRIFT_RAW * 0.15 * _DRIFT_ON
    output = _DRIFT_MOD

# -------------------------------------------------
# Extra mod LFO — slow triangle for wavefolder/phaser
# -------------------------------------------------
# Slightly different rate from main LFO for organic phase relationships

[lfo]
    hz = _LFO_RATE * 0.7
    triangle = _EXTRA_MOD_RAW

# ================================================================
# Envelope Section
# ================================================================

# -------------------------------------------------
# Filter envelope (ADSR)
# -------------------------------------------------
# Attack 20ms, Decay 200-600ms (shape dependent), Sustain 30%,
# Release 400-800ms. Long release toggle doubles release time.

# Compute filter release: 400ms base, or 800ms with long release
[switch]
    input1 = 0.08     # normal: 400ms
    input2 = 0.16     # long: 800ms
    offset = _LONG_RELEASE
    output1 = _FILTER_RELEASE

[contour]
    gate = I1 * _ACTIVE
    attack = 0.004    # 20ms
    decay = _FILTER_DECAY
    sustain = 0.3
    release = _FILTER_RELEASE
    output = _FILTER_ENV_RAW

# -------------------------------------------------
# VCA envelope (ADSR)
# -------------------------------------------------
# Attack 5ms, Decay 0, Sustain 100%, Release 80-150ms.
# Long release toggle doubles release to 160-300ms.

# Compute VCA release: 120ms base, or 240ms with long release
[switch]
    input1 = 0.024    # normal: ~120ms
    input2 = 0.048    # long: ~240ms
    offset = _LONG_RELEASE
    output1 = _VCA_RELEASE

[contour]
    gate = I1 * _ACTIVE
    attack = 0.001    # 5ms
    decay = 0
    sustain = 1.0
    release = _VCA_RELEASE
    output = _VCA_ENV

# ================================================================
# CV Mixing — Filter Cutoff
# ================================================================

# -------------------------------------------------
# Combine all filter modulation sources
# -------------------------------------------------
# Filter CV = brightness base
#           + (filter env * sweep depth * (1 + drift mod))
#           + scaled LFO
#           + accent boost

# Apply sweep depth (with drift modulation) to filter envelope
[copy]
    input = _FILTER_ENV_RAW * _SWEEP_DEPTH * (1 + _DRIFT_MOD)
    output = _FILTER_ENV_SCALED

# Accent adds extra filter brightness (velocity * 20% of sweep depth)
[copy]
    input = I4 * _SWEEP_DEPTH * 0.2
    output = _ACCENT_BOOST

# Sum all filter CV sources
[copy]
    input = _BRIGHTNESS_BASE + _FILTER_ENV_SCALED + _LFO_SCALED + _ACCENT_BOOST
    output = _FILTER_CV

# -------------------------------------------------
# Resonance — static low level (10-25%)
# -------------------------------------------------
# Fixed resonance, slightly modulated by accent for subtle emphasis

[copy]
    input = 0.15 + I4 * 0.10
    output = _RESONANCE_CV

# -------------------------------------------------
# Sub level — inverted VCA for sub emphasis during sustain
# -------------------------------------------------
# When VCA is high (note held), sub is lower. During release/silence,
# sub comes up — emphasizes the sub oscillator in the gaps.

[copy]
    input = (1 - _VCA_ENV) * 0.7
    output = _SUB_LEVEL

# ================================================================
# Outputs
# ================================================================

# O1: Pitch CV — clean pass-through
[copy]
    input = I3
    output = O1

# O2: Filter CV — envelope + LFO + drift + accent
[copy]
    input = _FILTER_CV
    output = O2

# O3: VCA CV — amplitude envelope
[copy]
    input = _VCA_ENV
    output = O3

# O4: Mod CV — copy of slow filter LFO (for second destination, e.g. Ikarie)
[copy]
    input = _LFO_SCALED
    output = O4

# O5: Resonance CV — low static level with accent boost
[copy]
    input = _RESONANCE_CV
    output = O5

# O6: Extra mod — slow triangle for wavefolder/phaser
[copy]
    input = _EXTRA_MOD_RAW * _MOD_DEPTH
    output = O6

# O7: Sub level — inverted VCA for sub emphasis during sustain
[copy]
    input = _SUB_LEVEL
    output = O7

# O8: Gate out — pass-through of input gate
[copy]
    input = I1 * _ACTIVE
    output = O8
