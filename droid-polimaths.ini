# PoliMATHS — 8-Channel CV Event Generator
#
# Emulation of Make Noise PoliMATHS for DROID.
# 8 channels of Rise-Fall envelopes with superimposed
# oscillators (LFO to audio rate). Four activation modes,
# Spread modulation across channels, and dual output modes.
#
# INPUTS:
#   I1: Activate (clock/gate — triggers channel activations)
#   I2: Reset
#   I3: Span CV (external channel selection modulation)
#   I4: Spread CV (external spread amount modulation)
#
# OUTPUTS (Internal Osc mode — default):
#   O1-O8: Channel 1-8 envelope+oscillation CV
#   G1-G8: Channel 1-8 activity gates (via X7)
#
# OUTPUTS (External Osc mode — B1.7):
#   O1-O8: Channel 1-8 pitch CV (1V/oct for external VCOs)
#   G1-G8: Channel 1-8 activation gates
#
# CONTROLLER 1 (p2b8) — Transport & Mode:
#   P1.1: Span (channel select / round step / parallel divisions)
#   P1.2: Spread (center=none, CW=right channels, CCW=left)
#   B1.1: Run/Stop (LED = running)
#   B1.2: Reset (momentary)
#   B1.3: Mode (4 states: Ch.Index / Round / Parallel / Binary)
#   B1.4: Cycle on/off
#   B1.5: Cycle mode (All / Follow the Leader)
#   B1.6: Osc Bias (Unipolar / Bipolar)
#   B1.7: Output mode (Internal Osc / External Osc)
#   B1.8: [unused]
#
# CONTROLLER 2 (p2b8) — Curve & Manual Triggers:
#   P2.1: Curve (envelope shape: log → linear → exponential)
#   P2.2: Osc depth (oscillation mix amount)
#   B2.1-B2.8: Manual channel triggers (momentary)
#   L2.1-L2.8: Channel activity LEDs
#
# CONTROLLER 3 (p10) — Parameters & Spread Depths:
#   P3.1: Rise    P3.6: Rise spread depth
#   P3.2: Fall    P3.7: Fall spread depth
#   P3.3: Strength P3.8: Strength spread depth
#   P3.4: Rate    P3.9: Rate spread depth
#   P3.5: Shape   P3.10: Osc spread depth
#
# CONTROLLER 4 (p8s8) — Per-Channel:
#   P4.1-P4.8: Channel 1-8 level trim
#   S4.1-S4.8: Channel 1-8 mute switches
#
# CONTROLLER 5 (x7) — Gate Expander:
#   G1-G8: Channel 1-8 gate outputs

[p2b8]
[p2b8]
[p10]
[p8s8]
[x7]

# ============================================================
# TRANSPORT
# ============================================================

# Internal clock (normaled to I1 when unpatched)
[lfo]
    hz = 4 * P1.1 + 0.5
    square = N1

# Run/Stop toggle
[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

# Reset (momentary)
[button]
    button = B1.2
    states = 1
    led = L1.2
    output = _RESET_BTN

# Gate activate with running state
[copy]
    input = I1 * _RUNNING
    output = _ACTIVATE

# Merge reset sources
[copy]
    input = _RESET_BTN + I2
    output = _RESET

# ============================================================
# MODE & CYCLE CONTROLS
# ============================================================

# Mode select: 4 states (Ch.Index=0 / Round=0.333 / Parallel=0.667 / Binary=1.0)
[button]
    button = B1.3
    states = 4
    output = _MODE

# Mode LED brightness (0.25 / 0.5 / 0.75 / 1.0)
[copy]
    input = _MODE * 0.75 + 0.25
    output = L1.3

# Cycle on/off
[button]
    button = B1.4
    led = L1.4
    output = _CYCLE_ON

# Cycle mode: 0 = All, 1 = Follow the Leader
[button]
    button = B1.5
    led = L1.5
    output = _CYCLE_MODE

# Osc Bias: 0 = Unipolar, 1 = Bipolar
[button]
    button = B1.6
    led = L1.6
    output = _OSC_BIPOLAR

# Output mode: 0 = Internal Osc, 1 = External Osc
[button]
    button = B1.7
    led = L1.7
    output = _OUTPUT_MODE

# Cycle All: active when cycle ON and mode = All
[copy]
    input = _CYCLE_ON * (1 - _CYCLE_MODE)
    output = _CYCLE_ALL

# Cycle FtL: active when cycle ON and mode = FtL
[copy]
    input = _CYCLE_ON * _CYCLE_MODE
    output = _CYCLE_FTL

# ============================================================
# SPREAD
# ============================================================

# Spread direction: P1.2 center (0.5) = no spread
# Adding I4 for external CV modulation
# Result: -1 (full left) to +1 (full right)
[copy]
    input = (P1.2 + I4 - 0.5) * 2
    output = _SPREAD_DIR

# ============================================================
# ACTIVATION MODE: CHANNEL INDEX
# ============================================================

# Combined span value
[copy]
    input = P1.1 + I3
    output = _SPAN

# Scale to 0-8 range for threshold tests
[copy]
    input = _SPAN * 8
    output = _SPAN8

# Cumulative "span >= N" thresholds
[compare]
    input = _SPAN8
    compare = 1
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _SP_GE1

[compare]
    input = _SPAN8
    compare = 2
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _SP_GE2

[compare]
    input = _SPAN8
    compare = 3
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _SP_GE3

[compare]
    input = _SPAN8
    compare = 4
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _SP_GE4

[compare]
    input = _SPAN8
    compare = 5
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _SP_GE5

[compare]
    input = _SPAN8
    compare = 6
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _SP_GE6

[compare]
    input = _SPAN8
    compare = 7
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _SP_GE7

# Per-channel selection (difference of adjacent thresholds)
# Ch1 selected when span < 1 (not GE1)
[copy]
    input = (1 - _SP_GE1) * _ACTIVATE
    output = _CIDX_CH1

# Ch2 selected when GE1 but not GE2
[copy]
    input = (_SP_GE1 - _SP_GE2) * _ACTIVATE
    output = _CIDX_CH2

# Ch3 selected when GE2 but not GE3
[copy]
    input = (_SP_GE2 - _SP_GE3) * _ACTIVATE
    output = _CIDX_CH3

[copy]
    input = (_SP_GE3 - _SP_GE4) * _ACTIVATE
    output = _CIDX_CH4

[copy]
    input = (_SP_GE4 - _SP_GE5) * _ACTIVATE
    output = _CIDX_CH5

[copy]
    input = (_SP_GE5 - _SP_GE6) * _ACTIVATE
    output = _CIDX_CH6

[copy]
    input = (_SP_GE6 - _SP_GE7) * _ACTIVATE
    output = _CIDX_CH7

# Ch8 selected when GE7
[copy]
    input = _SP_GE7 * _ACTIVATE
    output = _CIDX_CH8

# ============================================================
# ACTIVATION MODE: ROUND
# ============================================================

# Step size from span: 1-4 steps per activation
[switch]
    input1 = 1
    input2 = 2
    input3 = 3
    input4 = 4
    offset = _SPAN
    output1 = _ROUND_STEP

# Clock multiply for step size
[clocktool]
    clock = _ACTIVATE
    multiply = _ROUND_STEP
    output = _ROUND_CLK

# Position counter: cycles through 8 steps
# CV values 0.000-1.000 in 8 steps (0, 0.143, 0.286, ...)
[sequencer]
    clock = _ROUND_CLK
    reset = _RESET
    cv1 = 0.000
    cv2 = 0.143
    cv3 = 0.286
    cv4 = 0.429
    cv5 = 0.571
    cv6 = 0.714
    cv7 = 0.857
    cv8 = 1.000
    cvoutput = _ROUND_POS

# Route activation to the current channel position
# Reuse the same threshold logic as Channel Index
# but with _ROUND_POS instead of _SPAN

# Scale to 0-8
[copy]
    input = _ROUND_POS * 8
    output = _RPOS8

# Thresholds (reuse pattern from Ch.Index section)
[compare]
    input = _RPOS8
    compare = 1
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _RP_GE1

[compare]
    input = _RPOS8
    compare = 2
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _RP_GE2

[compare]
    input = _RPOS8
    compare = 3
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _RP_GE3

[compare]
    input = _RPOS8
    compare = 4
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _RP_GE4

[compare]
    input = _RPOS8
    compare = 5
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _RP_GE5

[compare]
    input = _RPOS8
    compare = 6
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _RP_GE6

[compare]
    input = _RPOS8
    compare = 7
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _RP_GE7

# Per-channel round triggers
[copy]
    input = (1 - _RP_GE1) * _ACTIVATE
    output = _ROUND_CH1

[copy]
    input = (_RP_GE1 - _RP_GE2) * _ACTIVATE
    output = _ROUND_CH2

[copy]
    input = (_RP_GE2 - _RP_GE3) * _ACTIVATE
    output = _ROUND_CH3

[copy]
    input = (_RP_GE3 - _RP_GE4) * _ACTIVATE
    output = _ROUND_CH4

[copy]
    input = (_RP_GE4 - _RP_GE5) * _ACTIVATE
    output = _ROUND_CH5

[copy]
    input = (_RP_GE5 - _RP_GE6) * _ACTIVATE
    output = _ROUND_CH6

[copy]
    input = (_RP_GE6 - _RP_GE7) * _ACTIVATE
    output = _ROUND_CH7

[copy]
    input = _RP_GE7 * _ACTIVATE
    output = _ROUND_CH8

# ============================================================
# ACTIVATION MODE: PARALLEL
# ============================================================

# Division ratios per channel, controlled by Span
# Span center (0.5) = all /1; Span CW = ascending divs
# Use switch to select division sets

# Division set selection from span (4 presets)
# Set 0: all /1
# Set 1: /1 /1 /2 /2 /4 /4 /8 /8
# Set 2: /1 /2 /3 /4 /5 /6 /7 /8
# Set 3: /1 /2 /4 /8 /16 /32 /64 /128

# Ch1 always /1
[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = 1
    output = _PAR_CH1

# Ch2: /1 or /2 depending on span
[switch]
    input1 = 1
    input2 = 1
    input3 = 2
    input4 = 2
    offset = _SPAN
    output1 = _PAR_DIV2

[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = _PAR_DIV2
    output = _PAR_CH2

# Ch3
[switch]
    input1 = 1
    input2 = 2
    input3 = 3
    input4 = 4
    offset = _SPAN
    output1 = _PAR_DIV3

[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = _PAR_DIV3
    output = _PAR_CH3

# Ch4
[switch]
    input1 = 1
    input2 = 2
    input3 = 4
    input4 = 8
    offset = _SPAN
    output1 = _PAR_DIV4

[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = _PAR_DIV4
    output = _PAR_CH4

# Ch5
[switch]
    input1 = 1
    input2 = 4
    input3 = 5
    input4 = 16
    offset = _SPAN
    output1 = _PAR_DIV5

[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = _PAR_DIV5
    output = _PAR_CH5

# Ch6
[switch]
    input1 = 1
    input2 = 4
    input3 = 6
    input4 = 32
    offset = _SPAN
    output1 = _PAR_DIV6

[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = _PAR_DIV6
    output = _PAR_CH6

# Ch7
[switch]
    input1 = 1
    input2 = 8
    input3 = 7
    input4 = 64
    offset = _SPAN
    output1 = _PAR_DIV7

[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = _PAR_DIV7
    output = _PAR_CH7

# Ch8
[switch]
    input1 = 1
    input2 = 8
    input3 = 8
    input4 = 128
    offset = _SPAN
    output1 = _PAR_DIV8

[clocktool]
    clock = _ACTIVATE
    reset = _RESET
    divide = _PAR_DIV8
    output = _PAR_CH8

# ============================================================
# ACTIVATION MODE: BINARY COUNTER
# ============================================================

# Bit 0 (Ch1) — toggles on every activation
[flipflop]
    toggle = _ACTIVATE
    reset = _RESET
    output = _BIN_BIT0

# Bit 1 (Ch2) — toggles when bit 0 goes low (carry)
# Use inverted bit0: toggle on rising edge of NOT bit0
[copy]
    input = 1 - _BIN_BIT0
    output = _BIN_BIT0_INV

[flipflop]
    toggle = _BIN_BIT0_INV
    reset = _RESET
    output = _BIN_BIT1

# Bit 2 (Ch3)
[copy]
    input = 1 - _BIN_BIT1
    output = _BIN_BIT1_INV

[flipflop]
    toggle = _BIN_BIT1_INV
    reset = _RESET
    output = _BIN_BIT2

# Bit 3 (Ch4)
[copy]
    input = 1 - _BIN_BIT2
    output = _BIN_BIT2_INV

[flipflop]
    toggle = _BIN_BIT2_INV
    reset = _RESET
    output = _BIN_BIT3

# Bit 4 (Ch5)
[copy]
    input = 1 - _BIN_BIT3
    output = _BIN_BIT3_INV

[flipflop]
    toggle = _BIN_BIT3_INV
    reset = _RESET
    output = _BIN_BIT4

# Bit 5 (Ch6)
[copy]
    input = 1 - _BIN_BIT4
    output = _BIN_BIT4_INV

[flipflop]
    toggle = _BIN_BIT4_INV
    reset = _RESET
    output = _BIN_BIT5

# Bit 6 (Ch7)
[copy]
    input = 1 - _BIN_BIT5
    output = _BIN_BIT5_INV

[flipflop]
    toggle = _BIN_BIT5_INV
    reset = _RESET
    output = _BIN_BIT6

# Bit 7 (Ch8)
[copy]
    input = 1 - _BIN_BIT6
    output = _BIN_BIT6_INV

[flipflop]
    toggle = _BIN_BIT6_INV
    reset = _RESET
    output = _BIN_BIT7

# Binary counter uses bits as gates directly
# Channel is "active" while its bit is high
# Per PoliMATHS: channel activates while bit=1, silent while bit=0
[copy]
    input = _BIN_BIT0
    output = _BIN_CH1

[copy]
    input = _BIN_BIT1
    output = _BIN_CH2

[copy]
    input = _BIN_BIT2
    output = _BIN_CH3

[copy]
    input = _BIN_BIT3
    output = _BIN_CH4

[copy]
    input = _BIN_BIT4
    output = _BIN_CH5

[copy]
    input = _BIN_BIT5
    output = _BIN_CH6

[copy]
    input = _BIN_BIT6
    output = _BIN_CH7

[copy]
    input = _BIN_BIT7
    output = _BIN_CH8

# ============================================================
# MODE MUX + MANUAL TRIGGERS
# ============================================================

# Per-channel mode selection: pick trigger from active mode
# _MODE: 0=Ch.Index, 0.333=Round, 0.667=Parallel, 1.0=Binary

# Channel 1
[switch]
    input1 = _CIDX_CH1
    input2 = _ROUND_CH1
    input3 = _PAR_CH1
    input4 = _BIN_CH1
    offset = _MODE
    output1 = _MODE_TRIG_CH1

# Channel 2
[switch]
    input1 = _CIDX_CH2
    input2 = _ROUND_CH2
    input3 = _PAR_CH2
    input4 = _BIN_CH2
    offset = _MODE
    output1 = _MODE_TRIG_CH2

# Channel 3
[switch]
    input1 = _CIDX_CH3
    input2 = _ROUND_CH3
    input3 = _PAR_CH3
    input4 = _BIN_CH3
    offset = _MODE
    output1 = _MODE_TRIG_CH3

# Channel 4
[switch]
    input1 = _CIDX_CH4
    input2 = _ROUND_CH4
    input3 = _PAR_CH4
    input4 = _BIN_CH4
    offset = _MODE
    output1 = _MODE_TRIG_CH4

# Channel 5
[switch]
    input1 = _CIDX_CH5
    input2 = _ROUND_CH5
    input3 = _PAR_CH5
    input4 = _BIN_CH5
    offset = _MODE
    output1 = _MODE_TRIG_CH5

# Channel 6
[switch]
    input1 = _CIDX_CH6
    input2 = _ROUND_CH6
    input3 = _PAR_CH6
    input4 = _BIN_CH6
    offset = _MODE
    output1 = _MODE_TRIG_CH6

# Channel 7
[switch]
    input1 = _CIDX_CH7
    input2 = _ROUND_CH7
    input3 = _PAR_CH7
    input4 = _BIN_CH7
    offset = _MODE
    output1 = _MODE_TRIG_CH7

# Channel 8
[switch]
    input1 = _CIDX_CH8
    input2 = _ROUND_CH8
    input3 = _PAR_CH8
    input4 = _BIN_CH8
    offset = _MODE
    output1 = _MODE_TRIG_CH8

# OR manual triggers (B2.1-B2.8) and FtL triggers with mode triggers
# _FTL_TRIG_CHx cables are defined in Task 14; DROID treats undefined cables as 0
[copy]
    input = _MODE_TRIG_CH1 + B2.1 + _FTL_TRIG_CH1
    output = _TRIG_CH1

[copy]
    input = _MODE_TRIG_CH2 + B2.2 + _FTL_TRIG_CH2
    output = _TRIG_CH2

[copy]
    input = _MODE_TRIG_CH3 + B2.3 + _FTL_TRIG_CH3
    output = _TRIG_CH3

[copy]
    input = _MODE_TRIG_CH4 + B2.4 + _FTL_TRIG_CH4
    output = _TRIG_CH4

[copy]
    input = _MODE_TRIG_CH5 + B2.5 + _FTL_TRIG_CH5
    output = _TRIG_CH5

[copy]
    input = _MODE_TRIG_CH6 + B2.6 + _FTL_TRIG_CH6
    output = _TRIG_CH6

[copy]
    input = _MODE_TRIG_CH7 + B2.7 + _FTL_TRIG_CH7
    output = _TRIG_CH7

[copy]
    input = _MODE_TRIG_CH8 + B2.8 + _FTL_TRIG_CH8
    output = _TRIG_CH8

# ============================================================
# ENVELOPES (8x Rise-Fall)
# ============================================================

# Channel 1 (spread weight = 0.000 — no spread effect)
[contour]
    gate = _TRIG_CH1
    attack = P3.1
    decay = P3.2
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH1

# Channel 2 (spread weight = 0.143)
[contour]
    gate = _TRIG_CH2
    attack = P3.1 + 0.143 * (P3.6 - 0.5) * _SPREAD_DIR
    decay = P3.2 + 0.143 * (P3.7 - 0.5) * _SPREAD_DIR
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH2

# Channel 3 (spread weight = 0.286)
[contour]
    gate = _TRIG_CH3
    attack = P3.1 + 0.286 * (P3.6 - 0.5) * _SPREAD_DIR
    decay = P3.2 + 0.286 * (P3.7 - 0.5) * _SPREAD_DIR
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH3

# Channel 4 (spread weight = 0.429)
[contour]
    gate = _TRIG_CH4
    attack = P3.1 + 0.429 * (P3.6 - 0.5) * _SPREAD_DIR
    decay = P3.2 + 0.429 * (P3.7 - 0.5) * _SPREAD_DIR
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH4

# Channel 5 (spread weight = 0.571)
[contour]
    gate = _TRIG_CH5
    attack = P3.1 + 0.571 * (P3.6 - 0.5) * _SPREAD_DIR
    decay = P3.2 + 0.571 * (P3.7 - 0.5) * _SPREAD_DIR
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH5

# Channel 6 (spread weight = 0.714)
[contour]
    gate = _TRIG_CH6
    attack = P3.1 + 0.714 * (P3.6 - 0.5) * _SPREAD_DIR
    decay = P3.2 + 0.714 * (P3.7 - 0.5) * _SPREAD_DIR
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH6

# Channel 7 (spread weight = 0.857)
[contour]
    gate = _TRIG_CH7
    attack = P3.1 + 0.857 * (P3.6 - 0.5) * _SPREAD_DIR
    decay = P3.2 + 0.857 * (P3.7 - 0.5) * _SPREAD_DIR
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH7

# Channel 8 (spread weight = 1.000)
[contour]
    gate = _TRIG_CH8
    attack = P3.1 + 1.000 * (P3.6 - 0.5) * _SPREAD_DIR
    decay = P3.2 + 1.000 * (P3.7 - 0.5) * _SPREAD_DIR
    sustain = 0
    release = 0.001
    shape = (P2.1 - 0.5) * 2
    loop = _CYCLE_ALL
    retrigger = 1
    output = _ENV_CH8

# ============================================================
# OSCILLATORS (8x LFO) + SHAPE SWITCH
# ============================================================

# Channel 1 (spread weight = 0.000)
[lfo]
    hz = 0.1 + P3.4 * P3.4 * 2000
    bipolar = _OSC_BIPOLAR
    sawtooth = _OSC_SAW_CH1
    triangle = _OSC_TRI_CH1
    ramp = _OSC_RAMP_CH1

[switch]
    input1 = _OSC_SAW_CH1
    input2 = _OSC_TRI_CH1
    input3 = _OSC_RAMP_CH1
    offset = P3.5
    output1 = _OSC_CH1

# Channel 2 (spread weight = 0.143)
[lfo]
    hz = 0.1 + (P3.4 + 0.143 * (P3.9 - 0.5) * _SPREAD_DIR) * (P3.4 + 0.143 * (P3.9 - 0.5) * _SPREAD_DIR) * 2000
    bipolar = _OSC_BIPOLAR
    sawtooth = _OSC_SAW_CH2
    triangle = _OSC_TRI_CH2
    ramp = _OSC_RAMP_CH2

[switch]
    input1 = _OSC_SAW_CH2
    input2 = _OSC_TRI_CH2
    input3 = _OSC_RAMP_CH2
    offset = P3.5
    output1 = _OSC_CH2

# Channel 3 (spread weight = 0.286)
[lfo]
    hz = 0.1 + (P3.4 + 0.286 * (P3.9 - 0.5) * _SPREAD_DIR) * (P3.4 + 0.286 * (P3.9 - 0.5) * _SPREAD_DIR) * 2000
    bipolar = _OSC_BIPOLAR
    sawtooth = _OSC_SAW_CH3
    triangle = _OSC_TRI_CH3
    ramp = _OSC_RAMP_CH3

[switch]
    input1 = _OSC_SAW_CH3
    input2 = _OSC_TRI_CH3
    input3 = _OSC_RAMP_CH3
    offset = P3.5
    output1 = _OSC_CH3

# Channel 4 (spread weight = 0.429)
[lfo]
