# ============================================================
# FOLLOW THE LEADER CYCLE
# ============================================================

# Track "was active" state per channel and detect end-of-cycle.
# EOC triggers next channel, gated by _CYCLE_FTL.

# Ch1 → triggers Ch2
[flipflop]
    set = _TRIG_CH1
    reset = _FTL_EOC1
    output = _FTL_ACTIVE1

[compare]
    input = _ENV_CH1
    compare = 0.01
    ifless = _FTL_ACTIVE1
    ifgreater = 0
    output = _FTL_EOC1

[copy]
    input = _FTL_EOC1 * _CYCLE_FTL
    output = _FTL_TRIG_CH2

# Ch2 → triggers Ch3
[flipflop]
    set = _TRIG_CH2
    reset = _FTL_EOC2
    output = _FTL_ACTIVE2

[compare]
    input = _ENV_CH2
    compare = 0.01
    ifless = _FTL_ACTIVE2
    ifgreater = 0
    output = _FTL_EOC2

[copy]
    input = _FTL_EOC2 * _CYCLE_FTL
    output = _FTL_TRIG_CH3

# Ch3 → triggers Ch4
[flipflop]
    set = _TRIG_CH3
    reset = _FTL_EOC3
    output = _FTL_ACTIVE3

[compare]
    input = _ENV_CH3
    compare = 0.01
    ifless = _FTL_ACTIVE3
    ifgreater = 0
    output = _FTL_EOC3

[copy]
    input = _FTL_EOC3 * _CYCLE_FTL
    output = _FTL_TRIG_CH4

# Ch4 → triggers Ch5
[flipflop]
    set = _TRIG_CH4
    reset = _FTL_EOC4
    output = _FTL_ACTIVE4

[compare]
    input = _ENV_CH4
    compare = 0.01
    ifless = _FTL_ACTIVE4
    ifgreater = 0
    output = _FTL_EOC4

[copy]
    input = _FTL_EOC4 * _CYCLE_FTL
    output = _FTL_TRIG_CH5

# Ch5 → triggers Ch6
[flipflop]
    set = _TRIG_CH5
    reset = _FTL_EOC5
    output = _FTL_ACTIVE5

[compare]
    input = _ENV_CH5
    compare = 0.01
    ifless = _FTL_ACTIVE5
    ifgreater = 0
    output = _FTL_EOC5

[copy]
    input = _FTL_EOC5 * _CYCLE_FTL
    output = _FTL_TRIG_CH6

# Ch6 → triggers Ch7
[flipflop]
    set = _TRIG_CH6
    reset = _FTL_EOC6
    output = _FTL_ACTIVE6

[compare]
    input = _ENV_CH6
    compare = 0.01
    ifless = _FTL_ACTIVE6
    ifgreater = 0
    output = _FTL_EOC6

[copy]
    input = _FTL_EOC6 * _CYCLE_FTL
    output = _FTL_TRIG_CH7

# Ch7 → triggers Ch8
[flipflop]
    set = _TRIG_CH7
    reset = _FTL_EOC7
    output = _FTL_ACTIVE7

[compare]
    input = _ENV_CH7
    compare = 0.01
    ifless = _FTL_ACTIVE7
    ifgreater = 0
    output = _FTL_EOC7

[copy]
    input = _FTL_EOC7 * _CYCLE_FTL
    output = _FTL_TRIG_CH8

# Ch8 → wraps to Ch1
[flipflop]
    set = _TRIG_CH8
    reset = _FTL_EOC8
    output = _FTL_ACTIVE8

[compare]
    input = _ENV_CH8
    compare = 0.01
    ifless = _FTL_ACTIVE8
    ifgreater = 0
    output = _FTL_EOC8

[copy]
    input = _FTL_EOC8 * _CYCLE_FTL
    output = _FTL_TRIG_CH1

