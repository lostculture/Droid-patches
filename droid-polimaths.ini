    output = _INT_CH1

# External: pitch CV
[copy]
    input = P3.4 * 5 * S4.1
    output = _EXT_CH1

# Output mode switch
[switch]
    input1 = _INT_CH1
    input2 = _EXT_CH1
    offset = _OUTPUT_MODE
    output1 = O1

