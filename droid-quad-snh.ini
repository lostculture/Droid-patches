# Quad Sample & Hold
# Inspired by disting NT sextuplet.lua by Thorinside
#
# Four channels sample the same CV input at staggered
# clock divisions: /1, /2, /3, /4. Creates tempo-related
# CV snapshots from a single source. With internal random
# normalization, produces 4 correlated-but-different
# melodic lines.
#
# INPUTS:
#  I1: CV Source (normaled to random)
#  I2: Clock (normaled to internal LFO)
#
# OUTPUTS:
#  O1: S&H Channel 1 (every clock)
#  O2: S&H Channel 2 (every 2 clocks)
#  O3: S&H Channel 3 (every 3 clocks)
#  O4: S&H Channel 4 (every 4 clocks)
#  O5: Clock /1 trigger
#  O6: Clock /2 trigger
#  O7: Clock /3 trigger
#  O8: Clock /4 trigger
#
# CONTROLLER 1 (p2b8):
#  P1.1: Clock Rate
#  P1.2: Scale (attenuate all outputs, 0-100%)
#  B1.1: Run/Stop
#  B1.2: Reset
#  B1.3: Freeze (LED on = hold all channels)
#  B1.4: Quantize (LED on = scale-quantized output)
#  B1.5-B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N2

[random]
    trigger = I2
    max = 1
    output = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[copy]
    input = I2 * _RUNNING
    output = _CLOCK_RAW

[copy]
    input = _RESET_BTN
    output = _RESET

# -------------------------------------------------
# Freeze
# -------------------------------------------------

[button]
    button = B1.3
    led = L1.3
    output = _FREEZE

[copy]
    input = -1 * _FREEZE + 1
    output = _NOT_FREEZE

[copy]
    input = _CLOCK_RAW * _NOT_FREEZE
    output = _CLOCK

# -------------------------------------------------
# Quantize Toggle
# -------------------------------------------------

[button]
    button = B1.4
    led = L1.4
    startvalue = 1
    output = _QUANTIZE

# -------------------------------------------------
# Clock Divisions
# -------------------------------------------------

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = 2
    output = _CLK2

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = 3
    output = _CLK3

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = 4
    output = _CLK4

# -------------------------------------------------
# Input Quantization (optional)
# -------------------------------------------------
#
# Quantize the CV source before sampling. This way all
# channels receive scale-correct notes.

[minifonion]
    input = I1
    root = 0
    degree = 7
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _CV_Q

[switch]
    input1 = I1
    input2 = _CV_Q
    offset = _QUANTIZE
    output = _CV_IN

# -------------------------------------------------
# Sample & Hold (4 channels at staggered rates)
# -------------------------------------------------

[sample]
    input = _CV_IN
    trigger = _CLOCK
    output = _SH1

[sample]
    input = _CV_IN
    trigger = _CLK2
    output = _SH2

[sample]
    input = _CV_IN
    trigger = _CLK3
    output = _SH3

[sample]
    input = _CV_IN
    trigger = _CLK4
    output = _SH4

# -------------------------------------------------
# Outputs (scaled by P1.2)
# -------------------------------------------------

[copy]
    input = _SH1 * P1.2
    output = O1

[copy]
    input = _SH2 * P1.2
    output = O2

[copy]
    input = _SH3 * P1.2
    output = O3

[copy]
    input = _SH4 * P1.2
    output = O4

# -------------------------------------------------
# Clock Division Outputs
# -------------------------------------------------

[copy]
    input = _CLOCK
    output = O5

[copy]
    input = _CLK2
    output = O6

[copy]
    input = _CLK3
    output = O7

[copy]
    input = _CLK4
    output = O8
