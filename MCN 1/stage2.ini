# Stage 2 — four algoquencers, one variable changed each
#
# Stage 1 proved every factor in the drum path is good: voice on, density
# up, not muted, clock running. Yet the trigger never arrives. drum-test's
# algoquencer worked, stage1's did not, and they differ in exactly four
# ways. This runs all four differences at once, so one pass tells us which.
#
#   G1  BASELINE  free LFO clock, fixed activity, trigger straight to G1
#                 identical to drum-test.ini, which worked. MUST flash.
#
#   G3  CLOCK     same, but clocked from the clocktool + timing chain
#                 dark -> the transport chain is the problem
#
#   G4  INDIRECT  same as baseline, but the trigger goes via an internal
#                 cable and a [copy], the way droid.ini does it
#                 dark -> the indirection is the problem
#
#   G5  POT       same as baseline, but activity comes from P3.1
#                 dark -> the pot is reading zero. Sweep P3.1 fully down
#                 then fully up before deciding.
#
# LEDs
#   L4.9   raw LFO clock       L4.11  P3.1 value as brightness
#   L4.10  transport clock     L4.12  the indirect trigger cable
#
# Turn P3.1 up before judging G5. Everything else is fixed and needs no
# controls at all.

[p2b8]
[p2b8]
[p10]
[b32]
[p8s8]

# --- two clocks, so they can be compared -------------------------------

[lfo]
    hz = 6
    square = _LFO_CLOCK

[copy]
    input = _LFO_CLOCK
    output = L4.9

[clocktool]
    clock = _LFO_CLOCK
    divide = 1
    output = _CLOCK_DIV

[timing]
    clock = _CLOCK_DIV
    timing1 = 0
    timing2 = 0
    output = _CHAIN_CLOCK

[copy]
    input = _CHAIN_CLOCK
    output = L4.10

[pot]
    pot = P3.1
    output = _DENSITY

[copy]
    input = _DENSITY
    output = L4.11

# --- G1  BASELINE — exactly what worked in drum-test.ini ---------------

[algoquencer]
    clock = _LFO_CLOCK
    length = 16
    activity = 0.5
    dejavu = 1
    gatelength = 0.3
    trigger = G1

# --- G3  CLOCK — only the clock source differs -------------------------

[algoquencer]
    clock = _CHAIN_CLOCK
    length = 16
    activity = 0.5
    dejavu = 1
    gatelength = 0.3
    trigger = G3

# --- G4  INDIRECT — only the routing differs ---------------------------

[algoquencer]
    clock = _LFO_CLOCK
    length = 16
    activity = 0.5
    dejavu = 1
    gatelength = 0.3
    trigger = _INDIRECT_TRIG

[copy]
    input = _INDIRECT_TRIG
    output = G4

[copy]
    input = _INDIRECT_TRIG
    output = L4.12

# --- G5  POT — only the activity source differs ------------------------

[algoquencer]
    clock = _LFO_CLOCK
    length = 16
    activity = _DENSITY
    dejavu = 1
    gatelength = 0.3
    trigger = G5
