# Controller test — which controllers is the master actually addressing?
#
# The drum test proved the clock, the sequencers and the gate outputs all
# work. Everything still silent in droid.ini depends on a P8S8 jack, and
# everything that works does not:
#
#   drums      activity uses P5.1 / P5.3 / P5.4 / P5.5   dead
#   mangle 1-3 beats uses P5.6 / P5.7 / P5.8             dead
#   mangle 4   no P5 jack   -> Multigrain                works
#   bass       no P5 jack   -> Domino                    works
#   lead       no P5 jack   -> MIDI                      works
#
# So this file tests each controller separately. Nothing is sequenced and
# nothing needs a clock: every response is immediate.
#
# CONTROLLER 1  p2b8   press B1.1        -> its own LED lights
#                      turn P1.1 up      -> G9 goes high
# CONTROLLER 2  p2b8   press B2.1        -> its own LED lights
#                      turn P2.1 up      -> G10 goes high
# CONTROLLER 3  p10    turn P3.1 up      -> G11 goes high
# CONTROLLER 4  b32    press B4.1        -> its own LED lights
# CONTROLLER 5  p8s8   push fader 1-8 up -> G1-G8 go high, one per fader
#                      flip switch 1-4   -> B32 LEDs 9-12 light
#                      any fader         -> that fader's own LED tracks it
#
# WHAT THE RESULT MEANS
#
#   Faders move G1-G8, switches light the B32   The P8S8 works. The fault is
#                                               elsewhere and I need to know.
#
#   Everything responds EXCEPT the P8S8         The master is not addressing
#                                               the P8S8 as controller 5.
#                                               Most likely: it is not fifth
#                                               in the physical daisy-chain
#                                               (rack position does not
#                                               matter, the ribbon order
#                                               does), or the firmware
#                                               predates the P8S8 - it is a
#                                               late-2024 module and needs a
#                                               recent blue firmware.
#
#   The wrong control responds                  The chain order differs from
#   (e.g. B32 buttons move G1-G8)               the declaration order. Tell me
#                                               what responds to what and I
#                                               will reorder the declarations.
#
# Controller declarations, in chain order. If a controller does not respond,
# this order is the first thing to suspect.

[p2b8]
[p2b8]
[p10]
[b32]
[p8s8]

# ---------------------------------------------------------
# Controller 1 (p2b8)
# ---------------------------------------------------------

[copy]
    input = B1.1
    output = L1.1

[compare]
    input = P1.1
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G9

# ---------------------------------------------------------
# Controller 2 (p2b8)
# ---------------------------------------------------------

[copy]
    input = B2.1
    output = L2.1

[compare]
    input = P2.1
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G10

# ---------------------------------------------------------
# Controller 3 (p10)
# ---------------------------------------------------------

[compare]
    input = P3.1
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G11

# ---------------------------------------------------------
# Controller 4 (b32)
# ---------------------------------------------------------

[copy]
    input = B4.1
    output = L4.1

# ---------------------------------------------------------
# Controller 5 (p8s8) — faders drive the eight Squid gates
# ---------------------------------------------------------

[compare]
    input = P5.1
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G1

[compare]
    input = P5.2
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G2

[compare]
    input = P5.3
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G3

[compare]
    input = P5.4
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G4

[compare]
    input = P5.5
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G5

[compare]
    input = P5.6
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G6

[compare]
    input = P5.7
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G7

[compare]
    input = P5.8
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = G8

# Switches 1-4 light B32 LEDs 9-12. The switches are 3-way, so these light
# only when the switch is fully up.
[compare]
    input = S5.1
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = L4.9

[compare]
    input = S5.2
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = L4.10

[compare]
    input = S5.3
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = L4.11

[compare]
    input = S5.4
    compare = 0.5
    ifgreater = 1
    ifless = 0
    output = L4.12

# ---------------------------------------------------------
# P8S8 fader LEDs follow their own fader.
#
# If the DROID refuses to load this patch, delete this block and try
# again — that on its own tells us the firmware does not know the P8S8.
# ---------------------------------------------------------

[copy]
    input = P5.1
    output = L5.1

[copy]
    input = P5.2
    output = L5.2

[copy]
    input = P5.3
    output = L5.3

[copy]
    input = P5.4
    output = L5.4

[copy]
    input = P5.5
    output = L5.5

[copy]
    input = P5.6
    output = L5.6

[copy]
    input = P5.7
    output = L5.7

[copy]
    input = P5.8
    output = L5.8
