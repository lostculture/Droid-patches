# Drum test — is the drum engine producing gates?
#
# Deliberately stripped down. No controllers are declared, no pots are read,
# no buttons are needed, no presets are used, nothing is muted. It starts
# playing the moment it loads.
#
#   G1  kick   — sparse, on downbeats
#   G3  snare  — sparse, offbeat-leaning
#   G4  hat    — busy
#   G5  perc   — medium
#   G11 CONTROL — a plain divided clock, not from a sequencer
#
# G11 is the control: it does not pass through an algoquencer at all, so
# it proves the clock and the gate outputs independently of the drum engine.
#
# WHAT YOU SHOULD SEE
#
#   G1 G3 G4 G5 and G11 all blinking
#       The drum engine works. The fault is in droid.ini's parameters, not
#       the engine — check, in this order: B1.5 (drum mute) is unlit, P3.1
#       (drum density) is up, and long-press B4.32 to clear the scene, since
#       a muted state is stored per scene and persists across reboots.
#
#   G11 blinking, G1/G3/G4/G5 dark
#       The clock and outputs are fine but algoquencer is producing
#       nothing. Tell me — that points at the circuit itself or the firmware
#       version, and the drum engine needs replacing with euklid.
#
#   Nothing blinking at all
#       The patch is not running. Check the master's LED and that this file
#       is on the SD card as droid.ini.
#
# Run gate-test.ini first if you have not — that proves the wiring. This file
# assumes the wiring is already known good.

# Free-running clock, roughly 8th notes at 90 BPM
[lfo]
    hz = 6
    square = _CLOCK

# CONTROL — no sequencer involved, must blink if the patch runs at all
[clocktool]
    clock = _CLOCK
    divide = 4
    output = G11

# Kick — sparse, prefers downbeats
[algoquencer]
    clock = _CLOCK
    length = 16
    activity = 0.35
    dejavu = 1
    offbeats = 0.1
    gatelength = 0.3
    trigger = G1

# Snare — sparse, prefers offbeats
[algoquencer]
    clock = _CLOCK
    length = 16
    activity = 0.3
    dejavu = 1
    offbeats = 0.9
    gatelength = 0.3
    trigger = G3

# Hat — busy
[algoquencer]
    clock = _CLOCK
    length = 16
    activity = 0.7
    dejavu = 1
    gatelength = 0.2
    trigger = G4

# Perc — medium
[algoquencer]
    clock = _CLOCK
    length = 16
    activity = 0.5
    dejavu = 1
    offbeats = 0.6
    gatelength = 0.3
    trigger = G5
