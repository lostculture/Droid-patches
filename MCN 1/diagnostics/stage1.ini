# Stage 1 — the main patch's drum path, and nothing else
#
# The controller test lit B32 LEDs 9-12 from the P8S8 switches, so those
# LEDs are definitely addressable. In droid.ini the same four stay dark,
# including L4.9, which is wired to a button that starts ON and cannot be
# stored off. That means droid.ini is very likely not running at all —
# most likely out of RAM, since it holds six algoquencer circuits.
#
# This file is the same drum path, structurally identical, at about a
# tenth of the size: same transport chain, same pot, same button, same
# algoquencer wiring, same status LEDs.
#
#   G1     kick
#   G9     clock out
#   L1.1   transport running
#   L4.9   drums voice on      — should be lit the moment it loads
#   L4.10  drum density        — brightness follows P3.1
#   L4.11  channel 1 open        — S5.1 centre or up = lit
#   L4.12  clock               — blinks
#
# WHAT THE RESULT MEANS
#
#   LEDs light and G1 fires
#       The structure is sound and droid.ini is failing on size. Tell me
#       and I will cut it down — the six algoquencers are the cost, and
#       four of them can become euklid with very little musical loss.
#
#   LEDs light but G1 never fires
#       Turn P3.1 up. If it still does not fire, the difference is the
#       pot: this file reads P3.1 with no preset, droid.ini reads it with
#       preset = _SCENE, which makes it a pickup control that outputs a
#       STORED value until you sweep the knob past it. Sweep P3.1 fully
#       down then fully up in droid.ini and see if the drums arrive.
#
#   Nothing lights at all
#       Then it is not size, and something more basic is wrong with how
#       this patch loads. Tell me and check the master for an error.

[p2b8]
[p2b8]
[p10]
[b32]
[p8s8]

# --- transport, identical to droid.ini ---------------------------------

[pot]
    pot = P1.1
    output = _TEMPO

[lfo]
    hz = _TEMPO * 16 + 2
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    dontsave = 1
    output = _RUNNING

[clocktool]
    clock = I1 * _RUNNING
    divide = 1
    output = _CLOCK_DIV

[timing]
    clock = _CLOCK_DIV
    timing1 = 0
    timing2 = 0
    output = _CLOCK

[copy]
    input = _CLOCK
    output = G9

# --- density pot, deliberately WITHOUT preset --------------------------

[pot]
    pot = P3.1
    output = _DRUM_DENSITY

# --- voice button ------------------------------------------------------

[button]
    button = B1.5
    led = L1.5
    startvalue = 1
    dontsave = 1
    output = _DRUMS_ON

# --- switch mute for channel 1, same comparison as droid.ini -----------

[compare]
    input = S5.1
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = 0
    ifequal = 1
    output = _CH1_OPEN

# --- one drum channel --------------------------------------------------

[algoquencer]
    clock = _CLOCK
    length = 16
    activity = _DRUM_DENSITY
    dejavu = 1
    offbeats = 0.2
    gatelength = 0.3
    trigger = _D1_TRIG

[logic]
    input1 = _D1_TRIG
    input2 = _DRUMS_ON
    input3 = _CH1_OPEN
    and = _D1_GATED

[logic]
    input1 = _D1_GATED
    input2 = B4.17
    or = G1

# --- status row --------------------------------------------------------

[copy]
    input = _DRUMS_ON
    output = L4.9

[copy]
    input = _DRUM_DENSITY
    output = L4.10

[copy]
    input = _CH1_OPEN
    output = L4.11

[copy]
    input = _CLOCK
    output = L4.12
