# Gate test — proves G8 and X7 wiring and addressing
#
# Load this instead of droid.ini when gates are not firing. It needs no
# controllers, no clock input and no button presses: every gate jack blinks
# on its own, at its own rate, as soon as the patch loads.
#
# G1-G8   = the G8 expander     — blink fast to slow, left to right
# G9-G12  = the X7 expander     — blink slowest
#
# What you should see:
#   All 12 blinking   → wiring and addressing are correct.
#   G1-G8 dark, G9-G12 blinking
#                     → the master sees the X7 but not the G8. Check the
#                       ribbon from the X7 to the G8 and its orientation.
#   Nothing at all    → the patch is not running. Check the master's own LED
#                       and that droid.ini loaded from the SD card.
#   All 12 blinking but your modules do nothing
#                     → the gates are fine; the problem is downstream.
#
# Note: the G8 and X7 are never declared in a patch — only controllers are.
# A single G8's jacks are G1-G8. A second G8 would be G2.1-G2.8.

[lfo]
    hz = 8
    square = _CLOCK

[clocktool]
    clock = _CLOCK
    divide = 1
    output = G1

[clocktool]
    clock = _CLOCK
    divide = 2
    output = G2

[clocktool]
    clock = _CLOCK
    divide = 3
    output = G3

[clocktool]
    clock = _CLOCK
    divide = 4
    output = G4

[clocktool]
    clock = _CLOCK
    divide = 5
    output = G5

[clocktool]
    clock = _CLOCK
    divide = 6
    output = G6

[clocktool]
    clock = _CLOCK
    divide = 7
    output = G7

[clocktool]
    clock = _CLOCK
    divide = 8
    output = G8

[clocktool]
    clock = _CLOCK
    divide = 12
    output = G9

[clocktool]
    clock = _CLOCK
    divide = 16
    output = G10

[clocktool]
    clock = _CLOCK
    divide = 20
    output = G11

[clocktool]
    clock = _CLOCK
    divide = 24
    output = G12
