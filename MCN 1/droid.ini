# MCN 1 — Performance Groove Machine
#
# Requires DROID firmware blue-7. The P8S8 is a late-2024 controller and
# older firmware lights it on boot but never addresses it, which silently
# kills every channel whose density reads a P5 jack.
#
# Three voices from one DROID: drums + sample mangling on the Squid Salmple,
# bass on the Domino, melodic lead over MIDI to the Ziqal Dimension MK3.
# Eight scenes recall pattern state and macro pot values.
#
# GATES (G8 expander first, then X7):
#   G1:     Squid kick
#   G2:     Squid — left blank on purpose
#   G3-G5:  Squid snare / hat / perc
#   G6-G8:  Squid mangle slots (euclidean stutter / slice gates)
#   G9:     Clock out to the rack          (X7 gate 1)
#   G10:    Domino gate                    (X7 gate 2)
#   G11:    Start-of-bar trigger, spare    (X7 gate 3)
#   G12:    Multigrain — mangle engine 4    (X7 gate 4)
#
# OUTPUTS:
#   O1: Domino pitch (quantized, with slide)
#   O2: Domino accent
#   O3: Domino filter envelope
#   O4: spare
#   O5: spare
#   O6: Filter macro (C4RBN / Dimension)
#   O7: Space macro (Aurora / FX AID)
#   O8: Accent bus (snare accent)
#
# INPUTS:
#   I1: External clock  (internal LFO normalled here when unpatched)
#   I2: External reset
#   I3: Joystick X — macro input only, joystick also goes straight to Multigrain
#   I4: Joystick Y — macro input only
#
# MIDI: TRS out, channel 1 — Dimension MK3 (pitch, gate, velocity, CC1 + CC74)
#
# CONTROLLER 1 (p2b8) — Transport & mutes
#   P1.1 Tempo            P1.2 Swing
#   B1.1 Run/Stop         B1.2 Reset          B1.3 Clock divide   B1.4 Root note
#   B1.5 Drums on         B1.6 Bass on        B1.7 Lead on        B1.8 Mangle on
#        (LED lit = voice playing; all four start on)
#
# CONTROLLER 2 (p2b8) — Morph & reroll
#   P2.1 Macro depth      P2.2 Chaos
#   B2.1 Reroll drums     B2.2 Reroll bass    B2.3 Reroll lead    B2.4 Reroll mangle
#   B2.5 Fill drums       B2.6 Fill mangle    B2.7 Lead octave    B2.8 Bass octave
#
# CONTROLLER 3 (p10) — Live parameters (scene-stored)
#   P3.1 Drum density     P3.2 Map X          P3.3 Map Y          P3.4 Gate length
#   P3.5 Bass density     P3.6 Bass accent    P3.7 Lead density   P3.8 Lead register
#   P3.9 Mangle amount    P3.10 Timbre macro
#
# CONTROLLER 4 (b32) — Scenes, fills, triggers
#   B4.1 -B4.8  Scenes 1-8
#   B4.9 -B4.12 Fill kick / snare / hat / perc (momentary)
#   B4.13-B4.16 Roll mangle 1-4 (G6 / G7 / G8 / Multigrain)
#   B4.17-B4.24 Manual triggers G1-G8 (B4.18 = the blank channel 2)
#   B4.25-B4.28 Drum pattern banks A-D
#   B4.29-B4.31 Bass / lead / mangle pattern advance
#   B4.32       Clear scene (long press)
#
# CONTROLLER 5 (p8s8) — Per-channel Squid
#   P5.1-P5.8 per-channel density scale, by Squid channel (down = 40%,
#             up = 100%). P5.2 is free — channel 2 is blank.
#   S5.1-S5.8 per-channel mute for G1-G8 — DOWN mutes, centre and up play

[p2b8]
[p2b8]
[p10]
[b32]
[p8s8]

# =========================================================
# SCENES
#
# Eight presets. Every stateful circuit below takes
# preset = _SCENE, so switching scene recalls patterns,
# toggles and macro pot values. Pots pick up where the
# stored value was, so nothing jumps when you move them.
# The P8S8 mute switches are deliberately excluded — a
# physical switch position must always be the truth.
# =========================================================

[buttongroup]
    minactive = 1
    maxactive = 1
    button1 = B4.1
    button2 = B4.2
    button3 = B4.3
    button4 = B4.4
    button5 = B4.5
    button6 = B4.6
    button7 = B4.7
    button8 = B4.8
    led1 = L4.1
    led2 = L4.2
    led3 = L4.3
    led4 = L4.4
    led5 = L4.5
    led6 = L4.6
    led7 = L4.7
    led8 = L4.8
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    value5 = 4
    value6 = 5
    value7 = 6
    value8 = 7
    output = _SCENE

# Long press clears the current scene back to defaults
[button]
    button = B4.32
    states = 1
    led = L4.32
    longpress = _CLEAR_SCENE

# =========================================================
# TRANSPORT
# =========================================================

[pot]
    pot = P1.1
    output = _TEMPO

[pot]
    pot = P1.2
    output = _SWING

# Internal clock — normalled to I1, so patching I1 takes over
[lfo]
    hz = _TEMPO * 16 + 2
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _RUNNING

[button]
    button = B1.2
    states = 1
    led = L1.2
    output = _RESET_BTN

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# Clock divide: 4 states cycling /1 /2 /4 /8
[button]
    button = B1.3
    led = L1.3
    states = 4
    value1 = 1
    value2 = 2
    value3 = 4
    value4 = 8
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DIVIDE

[clocktool]
    clock = I1 * _RUNNING
    reset = _RESET
    divide = _DIVIDE
    output = _CLOCK_DIV

# Swing: every second step is pushed late by up to 40% of a clock
[timing]
    clock = _CLOCK_DIV
    reset = _RESET
    timing1 = 0
    timing2 = _SWING * 0.4
    output = _CLOCK

# Clock out to the rack
[copy]
    input = _CLOCK
    output = G9

# =========================================================
# MACROS
#
# The joystick is read here only. It goes to Multigrain on
# its own stacked cable — the DROID does not pass it on.
# =========================================================

[pot]
    pot = P2.1
    output = _MACRO_DEPTH

[pot]
    pot = P2.2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _CHAOS

[copy]
    input = I3 * _MACRO_DEPTH
    output = _MACRO_X

[copy]
    input = I4 * _MACRO_DEPTH
    output = _MACRO_Y

[pot]
    pot = P3.1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUM_DENSITY

[pot]
    pot = P3.2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MAP_X_POT

[pot]
    pot = P3.3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MAP_Y_POT

[pot]
    pot = P3.4
    output = _GATELENGTH

[pot]
    pot = P3.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_DENSITY

[pot]
    pot = P3.6
    output = _BASS_ACCENT

[pot]
    pot = P3.7
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_DENSITY

[pot]
    pot = P3.8
    output = _LEAD_REGISTER

[pot]
    pot = P3.9
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_AMOUNT

[pot]
    pot = P3.10
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _TIMBRE

# Joystick rides on top of the map pots
[copy]
    input = _MAP_X_POT + _MACRO_X
    output = _MAP_X

[copy]
    input = _MAP_Y_POT + _MACRO_Y
    output = _MAP_Y

# Chaos drives the randomness controls of every sequencer:
# more chaos = less deja-vu, more morphing, more variation.
[copy]
    input = -1 * _CHAOS * 0.7 + 1
    output = _DEJAVU

[copy]
    input = _CHAOS * 0.3
    output = _MORPHS

# =========================================================
# P8S8 PER-CHANNEL FADERS — configuration
#
# _USE_P8S8   0 = ignore the faders, every channel plays at
#                 full density (default)
#             1 = the faders scale their channel, 40% down
#                 to 100% up
#
# Left at 0 the drums and mangle channels do not depend on
# the P8S8 at all, so the patch plays whether or not the
# master is addressing that controller. Run controller-test.ini
# to find out, then set this to 1.
# =========================================================

[copy]
    input = 1
    output = _USE_P8S8

[copy]
    input = P5.1 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH1_SCALE

[copy]
    input = P5.2 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH2_SCALE

[copy]
    input = P5.3 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH3_SCALE

[copy]
    input = P5.4 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH4_SCALE

[copy]
    input = P5.5 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH5_SCALE

[copy]
    input = P5.6 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH6_SCALE

[copy]
    input = P5.7 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH7_SCALE

[copy]
    input = P5.8 * 0.6 * _USE_P8S8 - 0.6 * _USE_P8S8 + 1
    output = _CH8_SCALE

# =========================================================
# P8S8 SWITCH MUTES — configuration
#
# DROID panel switches are 3-position and read 0.0 / 0.5 / 1.0,
# not simply off/on. These two constants decide how they behave.
# Change the "input =" value, nothing else.
#
#   _SWITCH_MUTES     1 = the switches mute their channel (default)
#                     0 = ignore the switches entirely
#   _SWITCH_UP_MUTES  0 = switch DOWN mutes (default)
#                     1 = switch UP mutes
#
# precision = 0.25 gives centre a wide band (0.25 to 0.75). Without
# it "equal to 0.5" is an exact comparison, so a centred switch
# reading 0.4999 counts as DOWN and mutes the channel.
#
# The centre position never mutes, whichever way this is set, so
# with the default a switch only silences its channel when pulled
# fully down. If it feels backwards, set _SWITCH_UP_MUTES to 1.
# =========================================================

[copy]
    input = 1
    output = _SWITCH_MUTES

[copy]
    input = 0
    output = _SWITCH_UP_MUTES

[compare]
    input = S5.1
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE1

# S5.2 / _MUTE2 belong to the blank Squid channel 2. Kept wired so the
# channel can be brought back by adding one [copy] to G2.
[compare]
    input = S5.2
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE2

[compare]
    input = S5.3
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE3

[compare]
    input = S5.4
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE4

[compare]
    input = S5.5
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE5

[compare]
    input = S5.6
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE6

[compare]
    input = S5.7
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE7

[compare]
    input = S5.8
    compare = 0.5
    precision = 0.25
    ifgreater = _SWITCH_UP_MUTES
    ifless = -1 * _SWITCH_UP_MUTES + 1
    ifequal = 0
    output = _MUTE8

# =========================================================
# VOICE ON / OFF
#
# "Voice on" buttons, not mutes: the LED is lit when the voice is
# PLAYING. dontsave = 1 keeps the state off the SD card, so every
# power-up starts with all four voices on and a voice can never
# boot silently off. They still follow the scene while running.
# =========================================================

[button]
    button = B1.5
    led = L1.5
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUMS_ON

[button]
    button = B1.6
    led = L1.6
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_ON

[button]
    button = B1.7
    led = L1.7
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_ON

[button]
    button = B1.8
    led = L1.8
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_ON

# Drum pattern bank A-D
[buttongroup]
    minactive = 1
    maxactive = 1
    button1 = B4.25
    button2 = B4.26
    button3 = B4.27
    button4 = B4.28
    led1 = L4.25
    led2 = L4.26
    led3 = L4.27
    led4 = L4.28
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUM_BANK

# =========================================================
# DRUMS — Squid G1-G4
#
# Map X biases random beats towards offbeats, Map Y towards
# the second half of the bar. The per-channel P8S8 slider
# is a bias around the global density (centre = neutral).
# =========================================================

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH1_SCALE
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.2
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.9 * 0.8 + B2.5 * 0.6
    fillorder = 2
    rolls = 0
    gatelength = _GATELENGTH * 0.8 + 0.1
    reroll = B2.1
    trigger = _D1_TRIG

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH3_SCALE
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.2
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.10 * 0.8 + B2.5 * 0.6
    fillorder = 2
    rolls = B4.10 * 0.5
    rollcount = 3
    gatelength = _GATELENGTH * 0.8 + 0.1
    reroll = B2.1
    accentlow = 0
    accenthigh = 1
    trigger = _D2_TRIG
    accent = _D2_ACCENT

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH4_SCALE
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.8 + 0.3
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.11 * 0.8 + B2.5 * 0.6
    fillorder = 1
    rolls = B4.11 * 0.6
    rollcount = 3
    gatelength = _GATELENGTH * 0.5 + 0.05
    reroll = B2.1
    trigger = _D3_TRIG

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH5_SCALE
    variation = _CHAOS * 0.8 + 0.2
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.8 + 0.3
    distribution = _MAP_Y * 0.8 + 0.1
    fills = B4.12 * 0.8 + B2.5 * 0.6
    fillorder = 3
    rolls = B4.12 * 0.6
    rollcount = 4
    gatelength = _GATELENGTH * 0.5 + 0.05
    reroll = B2.1
    trigger = _D4_TRIG
    startofbar = _START_OF_BAR

# Drum gates — voice mute, per-channel switch mute, manual trigger.
# Squid channel 2 (G2) is deliberately left blank, so snare, hat and
# perc each sit one channel higher than their sequencer number.
[copy]
    input = _D1_TRIG * _DRUMS_ON * (-1 * _MUTE1 * _SWITCH_MUTES + 1) + B4.17
    output = G1

[copy]
    input = _D2_TRIG * _DRUMS_ON * (-1 * _MUTE3 * _SWITCH_MUTES + 1) + B4.19
    output = G3

[copy]
    input = _D3_TRIG * _DRUMS_ON * (-1 * _MUTE4 * _SWITCH_MUTES + 1) + B4.20
    output = G4

[copy]
    input = _D4_TRIG * _DRUMS_ON * (-1 * _MUTE5 * _SWITCH_MUTES + 1) + B4.21
    output = G5

# Start of bar trigger — spare X7 gate
[copy]
    input = _START_OF_BAR
    output = G11

# Snare accent doubles as the rack accent bus
[copy]
    input = _D2_ACCENT
    output = O8

# =========================================================
# MANGLE — Squid G5-G8
#
# Euclidean slice gates. Mangle amount sets how many beats
# land in each 16-step cycle; the four channels sit at
# different rotations so they interlock rather than stack.
# =========================================================

[button]
    button = B4.31
    led = L4.31
    states = 4
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_ROTATE

[random]
    clock = B2.4
    minimum = 0
    maximum = 3
    steps = 4
    output = _MANGLE_REROLL

[copy]
    input = _MANGLE_ROTATE + _MANGLE_REROLL
    output = _MANGLE_OFFSET

[copy]
    input = _MANGLE_AMOUNT * 11 + B2.6 * 4 + 1
    output = _MANGLE_BEATS

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS * _CH6_SCALE
    offset = _MANGLE_OFFSET
    output = _MG1_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS * _CH7_SCALE
    offset = _MANGLE_OFFSET + 4
    output = _MG2_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 12
    beats = _MANGLE_BEATS * _CH8_SCALE
    offset = _MANGLE_OFFSET + 2
    output = _MG3_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS
    offset = _MANGLE_OFFSET + 7
    output = _MG4_GATE

# Chance gate — chaos thins the mangle channels out unevenly
[bernoulli]
    input = _MG3_GATE
    distribution = _CHAOS * 0.5 + 0.5
    output1 = _MG3_CHANCE

# Rolls — a burst of four triggers at 4x clock while held
[burst]
    trigger = B4.13
    taptempo = _CLOCK
    rate = 0.2
    count = 4
    output = _MG1_ROLL

[burst]
    trigger = B4.14
    taptempo = _CLOCK
    rate = 0.2
    count = 4
    output = _MG2_ROLL

[burst]
    trigger = B4.15
    taptempo = _CLOCK
    rate = 0.3
    count = 6
    output = _MG3_ROLL

[burst]
    trigger = B4.16
    taptempo = _CLOCK
    rate = 0.3
    count = 8
    output = _MG4_ROLL

[copy]
    input = _MG1_GATE * _MANGLE_ON * (-1 * _MUTE6 * _SWITCH_MUTES + 1) + B4.22 + _MG1_ROLL
    output = G6

[copy]
    input = _MG2_GATE * _MANGLE_ON * (-1 * _MUTE7 * _SWITCH_MUTES + 1) + B4.23 + _MG2_ROLL
    output = G7

[copy]
    input = _MG3_CHANCE * _MANGLE_ON * (-1 * _MUTE8 * _SWITCH_MUTES + 1) + B4.24 + _MG3_ROLL
    output = G8

# Mangle 4 has no Squid channel left, so it drives the Multigrain on its
# own rhythm rather than a mix of the others.
[copy]
    input = _MG4_GATE * _MANGLE_ON + _MG4_ROLL
    output = G12

# =========================================================
# BASS — Domino, G10 + O1-O3
# =========================================================

# Root note, 4 states: C / F / G / A
[button]
    button = B1.4
    led = L1.4
    states = 4
    value1 = 0
    value2 = 5
    value3 = 7
    value4 = 9
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _ROOT

[button]
    button = B2.8
    led = L2.8
    states = 3
    value1 = 0
    value2 = -1
    value3 = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_OCTAVE

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    length = 16
    activity = _BASS_DENSITY
    variation = _CHAOS * 0.7
    dejavu = _DEJAVU
    morphs = _MORPHS * 0.5
    offbeats = _MAP_X * 0.4 + 0.3
    gatelength = _GATELENGTH * 0.9 + 0.1
    pitchlow = 0
    pitchhigh = 1
    pitchresolution = 8
    reroll = B2.2
    nextpattern = B4.29
    accentlow = 0
    accenthigh = 1
    gate = _BASS_GATE
    pitch = _BASS_PITCH_RAW
    accent = _BASS_ACC

[minifonion]
    input = _BASS_PITCH_RAW + _BASS_OCTAVE
    root = _ROOT
    degree = 6
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    output = _BASS_PITCH

# Slide — accented notes glide, plain notes step
[slew]
    input = _BASS_PITCH
    slew = _BASS_ACC * _BASS_ACCENT * 0.15
    linear = O1

[copy]
    input = _BASS_GATE * _BASS_ON
    output = G10

[copy]
    input = _BASS_ACC * _BASS_ACCENT
    output = O2

# Filter envelope — snappier and deeper on accents
[contour]
    gate = _BASS_GATE * _BASS_ON
    attack = 0
    decay = _BASS_ACCENT * 0.4 + 0.05
    sustain = 0
    release = 0.05
    level = _BASS_ACC * 0.4 + 0.6
    output = O3

# =========================================================
# LEAD — Dimension MK3 over MIDI
# =========================================================

[button]
    button = B2.7
    led = L2.7
    states = 3
    value1 = 0
    value2 = 1
    value3 = 2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_OCTAVE

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    length = 16
    activity = _LEAD_DENSITY
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.3
    distribution = _MAP_Y * 0.5 + 0.3
    gatelength = _GATELENGTH * 0.9 + 0.1
    pitchlow = 0
    pitchhigh = 2
    pitchresolution = 12
    reroll = B2.3
    nextpattern = B4.30
    accentlow = 0
    accenthigh = 1
    gate = _LEAD_GATE
    pitch = _LEAD_PITCH_RAW
    accent = _LEAD_ACC

[minifonion]
    input = _LEAD_PITCH_RAW + _LEAD_OCTAVE + _LEAD_REGISTER
    root = _ROOT
    degree = 6
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    output = _LEAD_PITCH

[midiout]
    channel = 1
    trs = 1
    pitch1 = _LEAD_PITCH
    gate1 = _LEAD_GATE * _LEAD_ON
    velocity1 = _LEAD_ACC * 0.4 + 0.6
    ccnumber1 = 1
    cc1 = _TIMBRE
    ccnumber2 = 74
    cc2 = _MAP_Y

# =========================================================
# MACRO CV OUT
# =========================================================

[copy]
    input = _TIMBRE + _MACRO_Y
    output = O6

[copy]
    input = _MANGLE_AMOUNT * 0.5 + _MACRO_X
    output = O7

# =========================================================
# STATUS ROW — B32 LEDs 9 to 12
#
# The fill buttons have no LEDs of their own, so they show the
# state of the drum path. If the drums are silent, this says
# which factor is zero:
#
#   L4.9   drums voice on        dark  -> press B1.5
#   L4.10  drum density          dark  -> turn P3.1 up
#   L4.11  channel 1 not muted   dark  -> S5.1 is muting
#   L4.12  clock                 dark  -> transport stopped, B1.1
# =========================================================

[copy]
    input = _DRUMS_ON
    output = L4.9

[copy]
    input = _DRUM_DENSITY
    output = L4.10

[copy]
    input = -1 * _MUTE1 * _SWITCH_MUTES + 1
    output = L4.11

[copy]
    input = _CLOCK
    output = L4.12

# =========================================================
# ACTIVITY LEDS — the trigger row mirrors the gates
# =========================================================

[copy]
    input = G1
    output = L4.17

[copy]
    input = G3
    output = L4.19

[copy]
    input = G4
    output = L4.20

[copy]
    input = G5
    output = L4.21

[copy]
    input = G6
    output = L4.22

[copy]
    input = G7
    output = L4.23

[copy]
    input = G8
    output = L4.24
