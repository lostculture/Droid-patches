# MCN 1 — Performance Groove Machine
#
# Requires DROID firmware blue-7. The P8S8 is a late-2024 controller and
# older firmware lights it on boot but never addresses it, which silently
# kills every channel whose density reads a P5 jack.
#
# Four voices from one DROID: drums + sample mangling on the Squid Salmple,
# acid bass on the Domino, melodic lead over MIDI to the Ziqal Dimension MK3,
# and a Bastl PIZZA voice that switches between sub bass and lead.
# Eight scenes recall pattern state and macro pot values.
#
# GATES (G8 expander first, then X7):
#   G1:     Squid kick
#   G2:     Squid — left blank on purpose
#   G3-G5:  Squid snare / hat / perc
#   G6-G8:  Squid mangle slots (euclidean stutter / slice gates)
#   G9:     Clock out to the rack          (X7 gate 1)
#   G10:    Domino gate                    (X7 gate 2)
#   G11:    PIZZA trigger / gate           (X7 gate 3)
#   G12:    Multigrain — mangle engine 4    (X7 gate 4)
#
# OUTPUTS:
#   O1: Domino pitch (quantized, with slide)
#   O2: Domino accent
#   O3: Domino filter envelope
#   O4: General purpose LFO — rate, level and waveform on page 2
#   O5: PIZZA pitch (1V/oct)
#   O6: PIZZA timbre / FM index (envelope + LFO)
#   O7: PIZZA fold / second modulation (LFO + timbre macro + joystick)
#   O8: PIZZA ADSR envelope — shaped on page 2
#
# INPUTS:
#   I1: External clock  (internal LFO normalled here when unpatched)
#   I2: External reset
#   I3: Joystick X — macro input only, joystick also goes straight to Multigrain
#   I4: Joystick Y — macro input only
#
# MIDI: TRS out, channel 1 — Dimension MK3 (pitch, gate, velocity, CC1 + CC74)
#
# CONTROLLER 1 (p2b8) — Transport & mutes
#   P1.1 Tempo            P1.2 Swing
#   B1.1 Run/Stop         B1.2 Reset          B1.3 Clock divide   B1.4 Root note
#   B1.5 Drums on         B1.6 Bass on        B1.7 Lead on        B1.8 Mangle on
#        (LED lit = voice playing; all four start on)
#
# CONTROLLER 2 (p2b8) — Morph & reroll
#   P2.1 Macro depth      P2.2 Chaos
#   B2.1 Reroll drums     B2.2 Reroll bass    B2.3 Reroll lead    B2.4 Reroll mangle
#   B2.5 Fill drums       B2.6 Fill mangle    B2.7 Lead octave    B2.8 Bass octave
#
# CONTROLLER 3 (p10) — two pages, toggled by B4.18
#
#   PAGE 1 — performance (scene-stored)
#   P3.1 Drum density     P3.2 Map X          P3.3 Map Y          P3.4 Gate length
#   P3.5 Bass density     P3.6 Bass accent    P3.7 Lead density   P3.8 Lead register
#   P3.9 Mangle amount    P3.10 Timbre macro
#
#   PAGE 2 — voice setup
#   P3.1 Env attack       P3.2 Env decay      P3.3 Env sustain    P3.4 Env release
#   P3.5 LFO rate         P3.6 LFO level      P3.7 Bass spread    P3.8 Bass master pitch
#   P3.9 LFO waveform     P3.10 PIZZA transpose
#
# CONTROLLER 4 (b32) — Scenes, fills, triggers
#   B4.1 -B4.8  Scenes 1-8
#   B4.9 -B4.12 Fill kick / snare / hat / perc (momentary)
#   B4.13-B4.16 Roll mangle 1-4 (G6 / G7 / G8 / Multigrain)
#   B4.17-B4.24 Manual triggers G1-G8  (B4.18 = PAGE, LED lit = page 2)
#   B4.29       Bass pattern on page 1, PIZZA mode on page 2
#               (LED lit = lead, dark = sub bass; always starts sub bass)
#   B4.25-B4.28 Drum pattern banks A-D
#   B4.29-B4.31 Bass / lead / mangle pattern advance
#   B4.32       Clear scene (long press)
#
# CONTROLLER 5 (p8s8) — Per-channel Squid
#   P5.1-P5.8 per-channel density scale, by Squid channel (down = 40%,
#             up = 100%). P5.2 is free — channel 2 is blank.
#   S5.1-S5.8 per-channel mute for G1-G8 — disabled by default, see config
#   S5.2 is free — Squid channel 2 is blank

[p2b8]
[p2b8]
[p10]
[b32]
[p8s8]

# =========================================================
# SCENES
#
# Eight presets. Every stateful circuit below takes
# preset = _SCENE, so switching scene recalls patterns,
# toggles and macro pot values. Pots pick up where the
# stored value was, so nothing jumps when you move them.
# The P8S8 mute switches are deliberately excluded — a
# physical switch position must always be the truth.
# =========================================================

[buttongroup]
    minactive = 1
    maxactive = 1
    button1 = B4.1
    button2 = B4.2
    button3 = B4.3
    button4 = B4.4
    button5 = B4.5
    button6 = B4.6
    button7 = B4.7
    button8 = B4.8
    led1 = L4.1
    led2 = L4.2
    led3 = L4.3
    led4 = L4.4
    led5 = L4.5
    led6 = L4.6
    led7 = L4.7
    led8 = L4.8
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    value5 = 4
    value6 = 5
    value7 = 6
    value8 = 7
    output = _SCENE

# Long press clears the current scene back to defaults
[button]
    button = B4.32
    states = 1
    led = L4.32
    longpress = _CLEAR_SCENE

# =========================================================
# TRANSPORT
# =========================================================

[pot]
    pot = P1.1
    output = _TEMPO

[pot]
    pot = P1.2
    output = _SWING

# Internal clock — normalled to I1, so patching I1 takes over
[lfo]
    hz = _TEMPO * 16 + 2
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _RUNNING

[button]
    button = B1.2
    states = 1
    led = L1.2
    output = _RESET_BTN

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# Clock divide: 4 states cycling /1 /2 /4 /8
[button]
    button = B1.3
    led = L1.3
    states = 4
    value1 = 1
    value2 = 2
    value3 = 4
    value4 = 8
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DIVIDE

[clocktool]
    clock = I1 * _RUNNING
    reset = _RESET
    divide = _DIVIDE
    output = _CLOCK_DIV

# Swing: every second step is pushed late by up to 40% of a clock
[timing]
    clock = _CLOCK_DIV
    reset = _RESET
    timing1 = 0
    timing2 = _SWING * 0.4
    output = _CLOCK

# Clock out to the rack
[copy]
    input = _CLOCK
    output = G9

# =========================================================
# PAGE 2 — B4.18 toggles the P10 between two layers
#
# Page 1 (LED dark) : the performance controls
# Page 2 (LED half) : PIZZA envelope, the general LFO, Domino pitch
# Page 3 (LED full) : sequence lengths, glide, and PIZZA modulation
#
# A [pot] with select only reads its knob while selected, so each
# page holds its own values and picks up when you return to it.
# B4.18 is free because Squid channel 2 is blank.
# =========================================================

[button]
    button = B4.18
    states = 3
    value1 = 0
    value2 = 1
    value3 = 2
    startvalue = 0
    dontsave = 1
    output = _PAGE

# LED brightness shows the page: dark, half, full
[copy]
    input = _PAGE * 0.5
    output = L4.18

# =========================================================
# MACROS
#
# The joystick is read here only. It goes to Multigrain on
# its own stacked cable — the DROID does not pass it on.
# =========================================================

[pot]
    pot = P2.1
    output = _MACRO_DEPTH

[pot]
    pot = P2.2
    startvalue = 0.2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _CHAOS

[copy]
    input = I3 * _MACRO_DEPTH
    output = _MACRO_X

[copy]
    input = I4 * _MACRO_DEPTH
    output = _MACRO_Y

# startvalue matters on every preset-backed pot: the pot recalls a
# stored value per scene and only picks up the physical knob once you
# sweep past it, so a stored zero on a density pot is silence with the
# knob sitting at max. Each scene therefore starts somewhere musical.
[pot]
    pot = P3.1
    select = _PAGE
    selectat = 0
    startvalue = 0.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUM_DENSITY

[pot]
    pot = P3.2
    select = _PAGE
    selectat = 0
    startvalue = 0.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MAP_X_POT

[pot]
    pot = P3.3
    select = _PAGE
    selectat = 0
    startvalue = 0.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MAP_Y_POT

[pot]
    pot = P3.4
    select = _PAGE
    selectat = 0
    output = _GATELENGTH

[pot]
    pot = P3.5
    select = _PAGE
    selectat = 0
    startvalue = 0.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_DENSITY

[pot]
    pot = P3.6
    select = _PAGE
    selectat = 0
    output = _BASS_ACCENT

[pot]
    pot = P3.7
    select = _PAGE
    selectat = 0
    startvalue = 0.4
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_DENSITY

[pot]
    pot = P3.8
    select = _PAGE
    selectat = 0
    output = _LEAD_REGISTER

[pot]
    pot = P3.9
    select = _PAGE
    selectat = 0
    startvalue = 0.4
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_AMOUNT

[pot]
    pot = P3.10
    select = _PAGE
    selectat = 0
    startvalue = 0.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _TIMBRE

# Joystick rides on top of the map pots
[copy]
    input = _MAP_X_POT + _MACRO_X
    output = _MAP_X

[copy]
    input = _MAP_Y_POT + _MACRO_Y
    output = _MAP_Y

# Chaos drives the randomness controls of every sequencer:
# more chaos = less deja-vu, more morphing, more variation.
[copy]
    input = _CHAOS * -0.7 + 1
    output = _DEJAVU

[copy]
    input = _CHAOS * 0.3
    output = _MORPHS

# =========================================================
# P8S8 PER-CHANNEL FADERS — configuration
#
# Each channel's density is scaled by its fader as
#     P5.n * _FADER_SCALE + _FADER_OFFSET
# which is the A*B+C form every DROID input accepts.
#
#   faders active :  scale 0.6   offset 0.4   (default)
#   faders ignored:  scale 0     offset 1
#
# Setting scale to 0 and offset to 1 takes the P8S8 out of the
# drum and mangle path entirely without touching anything else.
# =========================================================

[copy]
    input = 0.6
    output = _FADER_SCALE

[copy]
    input = 0.4
    output = _FADER_OFFSET

[copy]
    input = P5.1 * _FADER_SCALE + _FADER_OFFSET
    output = _CH1_SCALE

[copy]
    input = P5.2 * _FADER_SCALE + _FADER_OFFSET
    output = _CH2_SCALE

[copy]
    input = P5.3 * _FADER_SCALE + _FADER_OFFSET
    output = _CH3_SCALE

[copy]
    input = P5.4 * _FADER_SCALE + _FADER_OFFSET
    output = _CH4_SCALE

[copy]
    input = P5.5 * _FADER_SCALE + _FADER_OFFSET
    output = _CH5_SCALE

[copy]
    input = P5.6 * _FADER_SCALE + _FADER_OFFSET
    output = _CH6_SCALE

[copy]
    input = P5.7 * _FADER_SCALE + _FADER_OFFSET
    output = _CH7_SCALE

[copy]
    input = P5.8 * _FADER_SCALE + _FADER_OFFSET
    output = _CH8_SCALE

# =========================================================
# P8S8 SWITCH MUTES
#
# Each 3-way switch reads 0.0 / 0.5 / 1.0. These circuits output
# 1 when the channel is OPEN and 0 when it is muted, which is the
# form the [logic] gates below consume directly.
#
#   _SWITCH_DOWN_OPEN  1 = switches never mute (default)
#                      0 = pulling a switch fully DOWN mutes it
#
# precision = 0.25 gives centre a wide band, 0.25 to 0.75, so a
# centred switch is never read as DOWN.
# =========================================================

[copy]
    input = 1
    output = _SWITCH_DOWN_OPEN

[compare]
    input = S5.1
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH1_OPEN

# S5.2 belongs to the blank Squid channel 2, kept wired so the
# channel can be restored with one [logic] pair writing to G2.
[compare]
    input = S5.2
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH2_OPEN

[compare]
    input = S5.3
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH3_OPEN

[compare]
    input = S5.4
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH4_OPEN

[compare]
    input = S5.5
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH5_OPEN

[compare]
    input = S5.6
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH6_OPEN

[compare]
    input = S5.7
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH7_OPEN

[compare]
    input = S5.8
    compare = 0.5
    precision = 0.25
    ifgreater = 1
    ifless = _SWITCH_DOWN_OPEN
    ifequal = 1
    output = _CH8_OPEN

# =========================================================
# PAGE 2 CONTROLS
#
#   P3.1-P3.4  PIZZA envelope   attack / decay / sustain / release
#   P3.5 P3.6  LFO             rate / level
#   P3.9       LFO waveform    square - saw - tri - ramp - par - sine
#   P3.7 P3.8  Domino pitch    spread (0-1 oct) / master (+-1 oct)
#   P3.10      PIZZA transpose (+-1 oct)
# =========================================================

[pot]
    pot = P3.1
    select = _PAGE
    selectat = 1
    startvalue = 0.05
    output = _ENV_ATTACK

[pot]
    pot = P3.2
    select = _PAGE
    selectat = 1
    startvalue = 0.3
    output = _ENV_DECAY

[pot]
    pot = P3.3
    select = _PAGE
    selectat = 1
    startvalue = 0.5
    output = _ENV_SUSTAIN

[pot]
    pot = P3.4
    select = _PAGE
    selectat = 1
    startvalue = 0.3
    output = _ENV_RELEASE

[pot]
    pot = P3.5
    select = _PAGE
    selectat = 1
    startvalue = 0.3
    output = _LFO_RATE

[pot]
    pot = P3.6
    select = _PAGE
    selectat = 1
    startvalue = 1
    output = _LFO_LEVEL

[pot]
    pot = P3.7
    select = _PAGE
    selectat = 1
    startvalue = 0.5
    output = _BASS_SPREAD

[pot]
    pot = P3.8
    select = _PAGE
    selectat = 1
    startvalue = 0.5
    bipolar = _BASS_MASTER

[pot]
    pot = P3.9
    select = _PAGE
    selectat = 1
    startvalue = 0.33
    output = _LFO_WAVE

[pot]
    pot = P3.10
    select = _PAGE
    selectat = 1
    startvalue = 0.5
    bipolar = _PIZZA_TRANSPOSE

# =========================================================
# PAGE 3 CONTROLS — sequences, glide and PIZZA modulation
#
#   P3.1  Acid glide        P3.2  Acid sequence length  (4-32)
#   P3.3  Sub density       P3.4  Sub sequence length   (4-32)
#   P3.5  Sub glide         P3.6  Sub pitch range
#   P3.7  PIZZA env depth   P3.8  PIZZA LFO depth
#   P3.9  Sub gate length   P3.10 Acid accent glide
# =========================================================

[pot]
    pot = P3.1
    select = _PAGE
    selectat = 2
    startvalue = 0.25
    output = _ACID_GLIDE

[pot]
    pot = P3.2
    select = _PAGE
    selectat = 2
    startvalue = 0.43
    output = _ACID_LENGTH

[pot]
    pot = P3.3
    select = _PAGE
    selectat = 2
    startvalue = 0.3
    output = _SUB_DENSITY

[pot]
    pot = P3.4
    select = _PAGE
    selectat = 2
    startvalue = 0.43
    output = _SUB_LENGTH

[pot]
    pot = P3.5
    select = _PAGE
    selectat = 2
    startvalue = 0.35
    output = _SUB_GLIDE

[pot]
    pot = P3.6
    select = _PAGE
    selectat = 2
    startvalue = 0.3
    output = _SUB_RANGE

[pot]
    pot = P3.7
    select = _PAGE
    selectat = 2
    startvalue = 0.6
    output = _PIZZA_ENV_DEPTH

[pot]
    pot = P3.8
    select = _PAGE
    selectat = 2
    startvalue = 0.3
    output = _PIZZA_LFO_DEPTH

[pot]
    pot = P3.9
    select = _PAGE
    selectat = 2
    startvalue = 0.6
    output = _SUB_GATELEN

[pot]
    pot = P3.10
    select = _PAGE
    selectat = 2
    startvalue = 0.3
    output = _ACID_ACCENT_GLIDE

# =========================================================
# VOICE ON / OFF
#
# "Voice on" buttons, not mutes: the LED is lit when the voice is
# PLAYING. dontsave = 1 keeps the state off the SD card, so every
# power-up starts with all four voices on and a voice can never
# boot silently off. They still follow the scene while running.
# =========================================================

[button]
    button = B1.5
    led = L1.5
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUMS_ON

[button]
    button = B1.6
    led = L1.6
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_ON

[button]
    button = B1.7
    led = L1.7
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_ON

[button]
    button = B1.8
    led = L1.8
    startvalue = 1
    dontsave = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_ON

# Drum pattern bank A-D
[buttongroup]
    minactive = 1
    maxactive = 1
    button1 = B4.25
    button2 = B4.26
    button3 = B4.27
    button4 = B4.28
    led1 = L4.25
    led2 = L4.26
    led3 = L4.27
    led4 = L4.28
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUM_BANK

# All four kit channels share the "fill everything" button, so its
# scaled value is computed once — two products in one input is not
# a legal expression.
[copy]
    input = B2.5 * 0.6
    output = _FILL_ALL

# =========================================================
# DRUMS — Squid G1-G4
#
# Map X biases random beats towards offbeats, Map Y towards
# the second half of the bar. The per-channel P8S8 slider
# is a bias around the global density (centre = neutral).
# =========================================================

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH1_SCALE
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.2
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.9 * 0.8 + _FILL_ALL
    fillorder = 2
    rolls = 0
    gatelength = _GATELENGTH * 0.8 + 0.1
    reroll = B2.1
    trigger = _D1_TRIG

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH3_SCALE
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.2
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.10 * 0.8 + _FILL_ALL
    fillorder = 2
    rolls = B4.10 * 0.5
    rollcount = 3
    gatelength = _GATELENGTH * 0.8 + 0.1
    reroll = B2.1
    trigger = _D2_TRIG

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH4_SCALE
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.8 + 0.3
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.11 * 0.8 + _FILL_ALL
    fillorder = 1
    rolls = B4.11 * 0.6
    rollcount = 3
    gatelength = _GATELENGTH * 0.5 + 0.05
    reroll = B2.1
    trigger = _D3_TRIG

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * _CH5_SCALE
    variation = _CHAOS * 0.8 + 0.2
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.8 + 0.3
    distribution = _MAP_Y * 0.8 + 0.1
    fills = B4.12 * 0.8 + _FILL_ALL
    fillorder = 3
    rolls = B4.12 * 0.6
    rollcount = 4
    gatelength = _GATELENGTH * 0.5 + 0.05
    reroll = B2.1
    trigger = _D4_TRIG

# Drum gates — voice mute, per-channel switch mute, manual trigger.
# Squid channel 2 (G2) is deliberately left blank, so snare, hat and
# perc each sit one channel higher than their sequencer number.
[logic]
    input1 = _D1_TRIG
    input2 = _DRUMS_ON
    input3 = _CH1_OPEN
    and = _D1_TRIG_GATED

[logic]
    input1 = _D1_TRIG_GATED
    input2 = B4.17
    or = G1

[logic]
    input1 = _D2_TRIG
    input2 = _DRUMS_ON
    input3 = _CH3_OPEN
    and = _D2_TRIG_GATED

[logic]
    input1 = _D2_TRIG_GATED
    input2 = B4.19
    or = G3

[logic]
    input1 = _D3_TRIG
    input2 = _DRUMS_ON
    input3 = _CH4_OPEN
    and = _D3_TRIG_GATED

[logic]
    input1 = _D3_TRIG_GATED
    input2 = B4.20
    or = G4

[logic]
    input1 = _D4_TRIG
    input2 = _DRUMS_ON
    input3 = _CH5_OPEN
    and = _D4_TRIG_GATED

[logic]
    input1 = _D4_TRIG_GATED
    input2 = B4.21
    or = G5

# =========================================================
# MANGLE — Squid G5-G8
#
# Euclidean slice gates. Mangle amount sets how many beats
# land in each 16-step cycle; the four channels sit at
# different rotations so they interlock rather than stack.
# =========================================================

[button]
    button = B4.31
    led = L4.31
    states = 4
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_ROTATE

[random]
    clock = B2.4
    minimum = 0
    maximum = 3
    steps = 4
    output = _MANGLE_REROLL

[copy]
    input = _MANGLE_ROTATE + _MANGLE_REROLL
    output = _MANGLE_OFFSET

[copy]
    input = B2.6 * 4 + 1
    output = _MANGLE_FILL

[copy]
    input = _MANGLE_AMOUNT * 11 + _MANGLE_FILL
    output = _MANGLE_BEATS

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS * _CH6_SCALE
    offset = _MANGLE_OFFSET
    output = _MG1_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS * _CH7_SCALE
    offset = _MANGLE_OFFSET + 4
    output = _MG2_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 12
    beats = _MANGLE_BEATS * _CH8_SCALE
    offset = _MANGLE_OFFSET + 2
    output = _MG3_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS
    offset = _MANGLE_OFFSET + 7
    output = _MG4_GATE

# Chance gate — chaos thins the mangle channels out unevenly
[bernoulli]
    input = _MG3_GATE
    distribution = _CHAOS * 0.5 + 0.5
    output1 = _MG3_CHANCE

# Rolls — a burst of four triggers at 4x clock while held
[burst]
    trigger = B4.13
    taptempo = _CLOCK
    rate = 0.2
    count = 4
    output = _MG1_ROLL

[burst]
    trigger = B4.14
    taptempo = _CLOCK
    rate = 0.2
    count = 4
    output = _MG2_ROLL

[burst]
    trigger = B4.15
    taptempo = _CLOCK
    rate = 0.3
    count = 6
    output = _MG3_ROLL

[burst]
    trigger = B4.16
    taptempo = _CLOCK
    rate = 0.3
    count = 8
    output = _MG4_ROLL

[logic]
    input1 = _MG1_GATE
    input2 = _MANGLE_ON
    input3 = _CH6_OPEN
    and = _MG1_GATE_GATED

[logic]
    input1 = _MG1_GATE_GATED
    input2 = B4.22
    input3 = _MG1_ROLL
    or = G6

[logic]
    input1 = _MG2_GATE
    input2 = _MANGLE_ON
    input3 = _CH7_OPEN
    and = _MG2_GATE_GATED

[logic]
    input1 = _MG2_GATE_GATED
    input2 = B4.23
    input3 = _MG2_ROLL
    or = G7

[logic]
    input1 = _MG3_CHANCE
    input2 = _MANGLE_ON
    input3 = _CH8_OPEN
    and = _MG3_CHANCE_GATED

[logic]
    input1 = _MG3_CHANCE_GATED
    input2 = B4.24
    input3 = _MG3_ROLL
    or = G8

# Mangle 4 has no Squid channel left, so it drives the Multigrain on its
# own rhythm rather than a mix of the others.
[copy]
    input = _MG4_GATE * _MANGLE_ON + _MG4_ROLL
    output = G12

# =========================================================
# BASS — Domino, G10 + O1-O3
# =========================================================

# Domino pitch range. _BASS_SHIFT is the bottom of the line and
# _BASS_TOP the ceiling, so spread widens the line upward from
# wherever master pitch puts it. 1.0 = one octave.
[copy]
    input = _BASS_OCTAVE + _BASS_MASTER
    output = _BASS_SHIFT

[copy]
    input = _BASS_SHIFT + _BASS_SPREAD
    output = _BASS_TOP

# Root note, 4 states: C / F / G / A
[button]
    button = B1.4
    led = L1.4
    states = 4
    value1 = 0
    value2 = 5
    value3 = 7
    value4 = 9
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _ROOT

[button]
    button = B2.8
    led = L2.8
    states = 3
    value1 = 0
    value2 = -1
    value3 = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_OCTAVE

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    length = _ACID_LENGTH * 28 + 4
    activity = _BASS_DENSITY
    variation = _CHAOS * 0.7
    offbeats = 0.35
    rolls = _CHAOS * 0.25
    rollcount = 2
    dejavu = _DEJAVU
    morphs = _MORPHS * 0.5
    offbeats = _MAP_X * 0.4 + 0.3
    gatelength = _GATELENGTH * 0.9 + 0.1
    pitchlow = _BASS_SHIFT
    pitchhigh = _BASS_TOP
    pitchresolution = 12
    reroll = B2.2
    nextpattern = _BASS_NEXTPATTERN
    accentlow = 0
    accenthigh = 1
    gate = _BASS_GATE
    pitch = _BASS_PITCH_RAW
    accent = _BASS_ACC

[minifonion]
    input = _BASS_PITCH_RAW + _BASS_OCTAVE
    root = _ROOT
    degree = 6
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    output = _BASS_PITCH

# Slide — accented notes glide, plain notes step
# Glide: a base amount on every note from P3.1, plus an extra helping
# on accented notes from P3.10 — the 303 behaviour where accent and
# slide travel together.
[copy]
    input = _ACID_GLIDE * 0.3
    output = _ACID_GLIDE_BASE

[copy]
    input = _ACID_ACCENT_GLIDE * 0.3
    output = _ACID_GLIDE_ACCENT_MAX

[copy]
    input = _BASS_ACC * _ACID_GLIDE_ACCENT_MAX
    output = _ACID_GLIDE_ACCENT

[mixer]
    input1 = _ACID_GLIDE_BASE
    input2 = _ACID_GLIDE_ACCENT
    output = _ACID_GLIDE_TOTAL

[slew]
    input = _BASS_PITCH
    slew = _ACID_GLIDE_TOTAL
    linear = O1

[copy]
    input = _BASS_GATE * _BASS_ON
    output = G10

[copy]
    input = _BASS_ACC * _BASS_ACCENT
    output = O2

# Filter envelope — snappier and deeper on accents
[contour]
    gate = _BASS_GATE * _BASS_ON
    attack = 0
    decay = _BASS_ACCENT * 0.4 + 0.05
    sustain = 0
    release = 0.05
    level = _BASS_ACC * 0.4 + 0.6
    output = O3

# =========================================================
# LEAD — Dimension MK3 over MIDI
# =========================================================

[button]
    button = B2.7
    led = L2.7
    states = 3
    value1 = 0
    value2 = 1
    value3 = 2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_OCTAVE

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    length = 16
    activity = _LEAD_DENSITY
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.3
    distribution = _MAP_Y * 0.5 + 0.3
    gatelength = _GATELENGTH * 0.9 + 0.1
    pitchlow = 0
    pitchhigh = 2
    pitchresolution = 12
    reroll = B2.3
    nextpattern = B4.30
    accentlow = 0
    accenthigh = 1
    gate = _LEAD_GATE
    pitch = _LEAD_PITCH_RAW
    accent = _LEAD_ACC

[copy]
    input = _LEAD_OCTAVE + _LEAD_REGISTER
    output = _LEAD_SHIFT

[minifonion]
    input = _LEAD_PITCH_RAW + _LEAD_SHIFT
    root = _ROOT
    degree = 6
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    output = _LEAD_PITCH

[midiout]
    channel = 1
    trs = 1
    pitch1 = _LEAD_PITCH
    gate1 = _LEAD_GATE * _LEAD_ON
    velocity1 = _LEAD_ACC * 0.4 + 0.6
    ccnumber1 = 1
    cc1 = _TIMBRE
    ccnumber2 = 74
    cc2 = _MAP_Y

# =========================================================
# SUB BASS LINE — PIZZA's own sequence, not the acid line
#
# Deliberately simple: a euclidean gate with its own length and
# density, and a pitch that picks between root, fifth and octave.
# A sub part wants to sit still and hold, so it gets long gates and
# few notes rather than a melody.
#
# Controls are all on page 3: P3.3 density, P3.4 length,
# P3.9 gate length, P3.6 pitch range, P3.5 glide.
# =========================================================

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = _SUB_LENGTH * 28 + 4
    beats = _SUB_DENSITY * 10 + 1
    output = _SUB_GATE_RAW

[gatetool]
    inputgate = _SUB_GATE_RAW
    gatelength = _SUB_GATELEN * 0.9 + 0.1
    outputgate = _SUB_GATE

[random]
    clock = _SUB_GATE
    minimum = 0
    maximum = _SUB_RANGE
    steps = 3
    output = _SUB_PITCH_RAW

[minifonion]
    input = _SUB_PITCH_RAW
    root = _ROOT
    degree = 6
    select1 = 1
    select5 = 1
    output = _SUB_PITCH

# =========================================================
# PIZZA — Bastl oscillator voice, two characters
#
#   O5   1V/oct pitch, with mode-dependent glide
#   G11  trigger / gate
#   O8   ADSR envelope, shaped on page 2
#   O4   general LFO, also free for anything else
#
# MODE: hold PAGE (B4.18) and press B4.29. The LED is lit in lead
# mode and dark in sub bass. It starts in SUB BASS every power-up
# (startvalue = 0, dontsave = 1) and is never stored.
#
#   SUB BASS  plays its OWN euclidean line an octave down — not the
#             acid line — with portamento, a snappy attack and a
#             short release so it stays tight under the kick
#   LEAD      follows the lead line an octave up, barely any
#             glide, and attack and release opened right out so
#             the envelope pots have somewhere to go
#
# Both modes read the same four envelope pots on page 2; the mode
# scales attack and release around them. P3.10 transposes either
# mode a further +-1 octave.
# =========================================================

[button]
    button = B4.29
    led = L4.29
    select = _PAGE
    selectat = 1
    startvalue = 0
    dontsave = 1
    output = _PIZZA_LEAD

# Page 1 keeps B4.29 as the bass pattern advance
[select]
    input = B4.29
    select = _PAGE
    selectat = 0
    output = _BASS_NEXTPATTERN

[switch]
    input1 = _SUB_PITCH
    input2 = _LEAD_PITCH
    offset = _PIZZA_LEAD
    output1 = _PIZZA_PITCH_SRC

[switch]
    input1 = _SUB_GATE
    input2 = _LEAD_GATE
    offset = _PIZZA_LEAD
    output1 = _PIZZA_GATE

# Sub sits an octave down, lead an octave up
[switch]
    input1 = -1
    input2 = 1
    offset = _PIZZA_LEAD
    output1 = _PIZZA_OCTAVE

# Portamento: generous for sub, almost none for lead
[copy]
    input = _SUB_GLIDE * 0.3
    output = _SUB_GLIDE_AMOUNT

[switch]
    input1 = _SUB_GLIDE_AMOUNT
    input2 = 0.02
    offset = _PIZZA_LEAD
    output1 = _PIZZA_GLIDE

# Envelope character per mode, scaling the page 2 pots
[switch]
    input1 = 0.1
    input2 = 1
    offset = _PIZZA_LEAD
    output1 = _PIZZA_ATTACK_SCALE

[switch]
    input1 = 0.3
    input2 = 2
    offset = _PIZZA_LEAD
    output1 = _PIZZA_RELEASE_SCALE

[copy]
    input = _PIZZA_OCTAVE + _PIZZA_TRANSPOSE
    output = _PIZZA_SHIFT

[copy]
    input = _PIZZA_PITCH_SRC + _PIZZA_SHIFT
    output = _PIZZA_PITCH

[slew]
    input = _PIZZA_PITCH
    slew = _PIZZA_GLIDE
    linear = O5

[copy]
    input = _PIZZA_GATE
    output = G11

# ADSR for PIZZA — the envelope requested on master output 8
[contour]
    gate = _PIZZA_GATE
    attack = _ENV_ATTACK * _PIZZA_ATTACK_SCALE
    decay = _ENV_DECAY * 0.5
    sustain = _ENV_SUSTAIN
    release = _ENV_RELEASE * _PIZZA_RELEASE_SCALE
    output = _PIZZA_ENV

[copy]
    input = _PIZZA_ENV
    output = O8

# General purpose LFO. Also feeds PIZZA's modulation outputs below.
[lfo]
    hz = _LFO_RATE * 20 + 0.05
    level = _LFO_LEVEL
    waveform = _LFO_WAVE * 6
    output = _LFO_OUT

[copy]
    input = _LFO_OUT
    output = O4

# =========================================================
# MACRO CV OUT
# =========================================================

# O6 — PIZZA timbre / FM index: the envelope, plus a helping of LFO.
# [mixer] sums without running into the one-multiplication limit.
[copy]
    input = _PIZZA_ENV * _PIZZA_ENV_DEPTH
    output = _PIZZA_MOD_ENV

[copy]
    input = _LFO_OUT * _PIZZA_LFO_DEPTH
    output = _PIZZA_MOD_LFO

[mixer]
    input1 = _PIZZA_MOD_ENV
    input2 = _PIZZA_MOD_LFO
    output = O6

# O7 — PIZZA fold / second modulation: the joystick and the timbre
# macro, so it stays under your hands during a performance.
[mixer]
    input1 = _PIZZA_MOD_LFO
    input2 = _TIMBRE
    input3 = _MACRO_Y
    output = O7

# =========================================================
# STATUS ROW — B32 LEDs 9 to 12
#
# The fill buttons have no LEDs of their own, so they show the
# state of the drum path. If the drums are silent, this says
# which factor is zero:
#
#   L4.9   drums voice on        dark  -> press B1.5
#   L4.10  drum density          dark  -> turn P3.1 up
#   L4.11  channel 1 open        dark  -> S5.1 is muting
#   L4.12  clock                 dark  -> transport stopped, B1.1
# =========================================================

[copy]
    input = _DRUMS_ON
    output = L4.9

[copy]
    input = _DRUM_DENSITY
    output = L4.10

[copy]
    input = _CH1_OPEN
    output = L4.11

[copy]
    input = _CLOCK
    output = L4.12

# =========================================================
# ACTIVITY LEDS — the trigger row mirrors the gates
# =========================================================

[copy]
    input = G1
    output = L4.17

[copy]
    input = G3
    output = L4.19

[copy]
    input = G4
    output = L4.20

[copy]
    input = G5
    output = L4.21

[copy]
    input = G6
    output = L4.22

[copy]
    input = G7
    output = L4.23

[copy]
    input = G8
    output = L4.24
