# MCN 1 — Performance Groove Machine
#
# Three voices from one DROID: drums + sample mangling on the Squid Salmple,
# bass on the Domino, melodic lead over MIDI to the Ziqal Dimension MK3.
# Eight scenes recall pattern state and macro pot values.
#
# GATES (G8 expander first, then X7):
#   G1-G4:  Squid kick / snare / hat / perc
#   G5-G8:  Squid mangle slots (euclidean stutter / slice gates)
#   G9:     Clock out to the rack          (X7 gate 1)
#   G10:    Domino gate                    (X7 gate 2)
#   G11:    Start-of-bar trigger, spare    (X7 gate 3)
#   G12:    Multigrain grain trigger       (X7 gate 4)
#
# OUTPUTS:
#   O1: Domino pitch (quantized, with slide)
#   O2: Domino accent
#   O3: Domino filter envelope
#   O4: spare
#   O5: spare
#   O6: Filter macro (C4RBN / Dimension)
#   O7: Space macro (Aurora / FX AID)
#   O8: Accent bus (snare accent)
#
# INPUTS:
#   I1: External clock  (internal LFO normalled here when unpatched)
#   I2: External reset
#   I3: Joystick X — macro input only, joystick also goes straight to Multigrain
#   I4: Joystick Y — macro input only
#
# MIDI: TRS out, channel 1 — Dimension MK3 (pitch, gate, velocity, CC1 + CC74)
#
# CONTROLLER 1 (p2b8) — Transport & mutes
#   P1.1 Tempo            P1.2 Swing
#   B1.1 Run/Stop         B1.2 Reset          B1.3 Clock divide   B1.4 Root note
#   B1.5 Mute drums       B1.6 Mute bass      B1.7 Mute lead      B1.8 Mute mangle
#
# CONTROLLER 2 (p2b8) — Morph & reroll
#   P2.1 Macro depth      P2.2 Chaos
#   B2.1 Reroll drums     B2.2 Reroll bass    B2.3 Reroll lead    B2.4 Reroll mangle
#   B2.5 Fill drums       B2.6 Fill mangle    B2.7 Lead octave    B2.8 Bass octave
#
# CONTROLLER 3 (p10) — Live parameters (scene-stored)
#   P3.1 Drum density     P3.2 Map X          P3.3 Map Y          P3.4 Gate length
#   P3.5 Bass density     P3.6 Bass accent    P3.7 Lead density   P3.8 Lead register
#   P3.9 Mangle amount    P3.10 Timbre macro
#
# CONTROLLER 4 (b32) — Scenes, fills, triggers
#   B4.1 -B4.8  Scenes 1-8
#   B4.9 -B4.12 Fill kick / snare / hat / perc (momentary)
#   B4.13-B4.16 Roll G5 / G6 / G7 / G8 (momentary)
#   B4.17-B4.24 Manual triggers G1-G8
#   B4.25-B4.28 Drum pattern banks A-D
#   B4.29-B4.31 Bass / lead / mangle pattern advance
#   B4.32       Clear scene (long press)
#
# CONTROLLER 5 (p8s8) — Per-channel Squid
#   P5.1-P5.8 per-channel density scale for G1-G8 (down = 40%, up = 100%)
#   S5.1-S5.8 per-channel mute — always live, never scene-stored

[p2b8]
[p2b8]
[p10]
[b32]
[p8s8]

# =========================================================
# SCENES
#
# Eight presets. Every stateful circuit below takes
# preset = _SCENE, so switching scene recalls patterns,
# toggles and macro pot values. Pots pick up where the
# stored value was, so nothing jumps when you move them.
# The P8S8 mute switches are deliberately excluded — a
# physical switch position must always be the truth.
# =========================================================

[buttongroup]
    minactive = 1
    maxactive = 1
    button1 = B4.1
    button2 = B4.2
    button3 = B4.3
    button4 = B4.4
    button5 = B4.5
    button6 = B4.6
    button7 = B4.7
    button8 = B4.8
    led1 = L4.1
    led2 = L4.2
    led3 = L4.3
    led4 = L4.4
    led5 = L4.5
    led6 = L4.6
    led7 = L4.7
    led8 = L4.8
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    value5 = 4
    value6 = 5
    value7 = 6
    value8 = 7
    output = _SCENE

# Long press clears the current scene back to defaults
[button]
    button = B4.32
    states = 1
    led = L4.32
    longpress = _CLEAR_SCENE

# =========================================================
# TRANSPORT
# =========================================================

[pot]
    pot = P1.1
    output = _TEMPO

[pot]
    pot = P1.2
    output = _SWING

# Internal clock — normalled to I1, so patching I1 takes over
[lfo]
    hz = _TEMPO * 16 + 2
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _RUNNING

[button]
    button = B1.2
    states = 1
    led = L1.2
    output = _RESET_BTN

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# Clock divide: 4 states cycling /1 /2 /4 /8
[button]
    button = B1.3
    led = L1.3
    states = 4
    value1 = 1
    value2 = 2
    value3 = 4
    value4 = 8
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DIVIDE

[clocktool]
    clock = I1 * _RUNNING
    reset = _RESET
    divide = _DIVIDE
    output = _CLOCK_DIV

# Swing: every second step is pushed late by up to 40% of a clock
[timing]
    clock = _CLOCK_DIV
    reset = _RESET
    timing1 = 0
    timing2 = _SWING * 0.4
    output = _CLOCK

# Clock out to the rack
[copy]
    input = _CLOCK
    output = G9

# =========================================================
# MACROS
#
# The joystick is read here only. It goes to Multigrain on
# its own stacked cable — the DROID does not pass it on.
# =========================================================

[pot]
    pot = P2.1
    output = _MACRO_DEPTH

[pot]
    pot = P2.2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _CHAOS

[copy]
    input = I3 * _MACRO_DEPTH
    output = _MACRO_X

[copy]
    input = I4 * _MACRO_DEPTH
    output = _MACRO_Y

[pot]
    pot = P3.1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUM_DENSITY

[pot]
    pot = P3.2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MAP_X_POT

[pot]
    pot = P3.3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MAP_Y_POT

[pot]
    pot = P3.4
    output = _GATELENGTH

[pot]
    pot = P3.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_DENSITY

[pot]
    pot = P3.6
    output = _BASS_ACCENT

[pot]
    pot = P3.7
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_DENSITY

[pot]
    pot = P3.8
    output = _LEAD_REGISTER

[pot]
    pot = P3.9
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_AMOUNT

[pot]
    pot = P3.10
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _TIMBRE

# Joystick rides on top of the map pots
[copy]
    input = _MAP_X_POT + _MACRO_X
    output = _MAP_X

[copy]
    input = _MAP_Y_POT + _MACRO_Y
    output = _MAP_Y

# Chaos drives the randomness controls of every sequencer:
# more chaos = less deja-vu, more morphing, more variation.
[copy]
    input = -1 * _CHAOS * 0.7 + 1
    output = _DEJAVU

[copy]
    input = _CHAOS * 0.3
    output = _MORPHS

# =========================================================
# VOICE MUTES
# =========================================================

[button]
    button = B1.5
    led = L1.5
    preset = _SCENE
    clear = _CLEAR_SCENE
    inverted = _DRUMS_ON

[button]
    button = B1.6
    led = L1.6
    preset = _SCENE
    clear = _CLEAR_SCENE
    inverted = _BASS_ON

[button]
    button = B1.7
    led = L1.7
    preset = _SCENE
    clear = _CLEAR_SCENE
    inverted = _LEAD_ON

[button]
    button = B1.8
    led = L1.8
    preset = _SCENE
    clear = _CLEAR_SCENE
    inverted = _MANGLE_ON

# Drum pattern bank A-D
[buttongroup]
    minactive = 1
    maxactive = 1
    button1 = B4.25
    button2 = B4.26
    button3 = B4.27
    button4 = B4.28
    led1 = L4.25
    led2 = L4.26
    led3 = L4.27
    led4 = L4.28
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _DRUM_BANK

# =========================================================
# DRUMS — Squid G1-G4
#
# Map X biases random beats towards offbeats, Map Y towards
# the second half of the bar. The per-channel P8S8 slider
# is a bias around the global density (centre = neutral).
# =========================================================

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * (P5.1 * 0.6 + 0.4)
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.2
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.9 * 0.8 + B2.5 * 0.6
    fillorder = 2
    rolls = 0
    gatelength = _GATELENGTH * 0.8 + 0.1
    reroll = B2.1
    trigger = _D1_TRIG

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * (P5.2 * 0.6 + 0.4)
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.2
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.10 * 0.8 + B2.5 * 0.6
    fillorder = 2
    rolls = B4.10 * 0.5
    rollcount = 3
    gatelength = _GATELENGTH * 0.8 + 0.1
    reroll = B2.1
    accentlow = 0
    accenthigh = 1
    trigger = _D2_TRIG
    accent = _D2_ACCENT

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * (P5.3 * 0.6 + 0.4)
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.8 + 0.3
    distribution = _MAP_Y * 0.6 + 0.2
    fills = B4.11 * 0.8 + B2.5 * 0.6
    fillorder = 1
    rolls = B4.11 * 0.6
    rollcount = 3
    gatelength = _GATELENGTH * 0.5 + 0.05
    reroll = B2.1
    trigger = _D3_TRIG

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    pattern = _DRUM_BANK
    length = 16
    activity = _DRUM_DENSITY * (P5.4 * 0.6 + 0.4)
    variation = _CHAOS * 0.8 + 0.2
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.8 + 0.3
    distribution = _MAP_Y * 0.8 + 0.1
    fills = B4.12 * 0.8 + B2.5 * 0.6
    fillorder = 3
    rolls = B4.12 * 0.6
    rollcount = 4
    gatelength = _GATELENGTH * 0.5 + 0.05
    reroll = B2.1
    trigger = _D4_TRIG
    startofbar = _START_OF_BAR

# Drum gates — voice mute, per-channel switch mute, manual trigger
[copy]
    input = _D1_TRIG * _DRUMS_ON * (-1 * S5.1 + 1) + B4.17
    output = G1

[copy]
    input = _D2_TRIG * _DRUMS_ON * (-1 * S5.2 + 1) + B4.18
    output = G2

[copy]
    input = _D3_TRIG * _DRUMS_ON * (-1 * S5.3 + 1) + B4.19
    output = G3

[copy]
    input = _D4_TRIG * _DRUMS_ON * (-1 * S5.4 + 1) + B4.20
    output = G4

# Start of bar trigger — spare X7 gate
[copy]
    input = _START_OF_BAR
    output = G11

# Snare accent doubles as the rack accent bus
[copy]
    input = _D2_ACCENT
    output = O8

# =========================================================
# MANGLE — Squid G5-G8
#
# Euclidean slice gates. Mangle amount sets how many beats
# land in each 16-step cycle; the four channels sit at
# different rotations so they interlock rather than stack.
# =========================================================

[button]
    button = B4.31
    led = L4.31
    states = 4
    value1 = 0
    value2 = 1
    value3 = 2
    value4 = 3
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _MANGLE_ROTATE

[random]
    clock = B2.4
    minimum = 0
    maximum = 3
    steps = 4
    output = _MANGLE_REROLL

[copy]
    input = _MANGLE_ROTATE + _MANGLE_REROLL
    output = _MANGLE_OFFSET

[copy]
    input = _MANGLE_AMOUNT * 11 + B2.6 * 4 + 1
    output = _MANGLE_BEATS

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS * (P5.5 * 0.6 + 0.4)
    offset = _MANGLE_OFFSET
    output = _M5_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS * (P5.6 * 0.6 + 0.4)
    offset = _MANGLE_OFFSET + 4
    output = _M6_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 12
    beats = _MANGLE_BEATS * (P5.7 * 0.6 + 0.4)
    offset = _MANGLE_OFFSET + 2
    output = _M7_GATE

[euklid]
    clock = _CLOCK
    reset = _RESET
    length = 16
    beats = _MANGLE_BEATS * (P5.8 * 0.6 + 0.4)
    offset = _MANGLE_OFFSET + 7
    output = _M8_GATE

# Chance gate — chaos thins the mangle channels out unevenly
[bernoulli]
    input = _M7_GATE
    distribution = _CHAOS * 0.5 + 0.5
    output1 = _M7_CHANCE

# Rolls — a burst of four triggers at 4x clock while held
[burst]
    trigger = B4.13
    taptempo = _CLOCK
    rate = 0.2
    count = 4
    output = _M5_ROLL

[burst]
    trigger = B4.14
    taptempo = _CLOCK
    rate = 0.2
    count = 4
    output = _M6_ROLL

[burst]
    trigger = B4.15
    taptempo = _CLOCK
    rate = 0.3
    count = 6
    output = _M7_ROLL

[burst]
    trigger = B4.16
    taptempo = _CLOCK
    rate = 0.3
    count = 8
    output = _M8_ROLL

[copy]
    input = _M5_GATE * _MANGLE_ON * (-1 * S5.5 + 1) + B4.21 + _M5_ROLL
    output = G5

[copy]
    input = _M6_GATE * _MANGLE_ON * (-1 * S5.6 + 1) + B4.22 + _M6_ROLL
    output = G6

[copy]
    input = _M7_CHANCE * _MANGLE_ON * (-1 * S5.7 + 1) + B4.23 + _M7_ROLL
    output = G7

[copy]
    input = _M8_GATE * _MANGLE_ON * (-1 * S5.8 + 1) + B4.24 + _M8_ROLL
    output = G8

# Multigrain grain trigger — rides the mangle bus
[copy]
    input = _M5_GATE * _MANGLE_ON + _M8_GATE * _MANGLE_ON
    output = G12

# =========================================================
# BASS — Domino, G10 + O1-O3
# =========================================================

# Root note, 4 states: C / F / G / A
[button]
    button = B1.4
    led = L1.4
    states = 4
    value1 = 0
    value2 = 5
    value3 = 7
    value4 = 9
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _ROOT

[button]
    button = B2.8
    led = L2.8
    states = 3
    value1 = 0
    value2 = -1
    value3 = 1
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _BASS_OCTAVE

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    length = 16
    activity = _BASS_DENSITY
    variation = _CHAOS * 0.7
    dejavu = _DEJAVU
    morphs = _MORPHS * 0.5
    offbeats = _MAP_X * 0.4 + 0.3
    gatelength = _GATELENGTH * 0.9 + 0.1
    pitchlow = 0
    pitchhigh = 1
    pitchresolution = 8
    reroll = B2.2
    nextpattern = B4.29
    accentlow = 0
    accenthigh = 1
    gate = _BASS_GATE
    pitch = _BASS_PITCH_RAW
    accent = _BASS_ACC

[minifonion]
    input = _BASS_PITCH_RAW + _BASS_OCTAVE
    root = _ROOT
    degree = 6
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    output = _BASS_PITCH

# Slide — accented notes glide, plain notes step
[slew]
    input = _BASS_PITCH
    slew = _BASS_ACC * _BASS_ACCENT * 0.15
    linear = O1

[copy]
    input = _BASS_GATE * _BASS_ON
    output = G10

[copy]
    input = _BASS_ACC * _BASS_ACCENT
    output = O2

# Filter envelope — snappier and deeper on accents
[contour]
    gate = _BASS_GATE * _BASS_ON
    attack = 0
    decay = _BASS_ACCENT * 0.4 + 0.05
    sustain = 0
    release = 0.05
    level = _BASS_ACC * 0.4 + 0.6
    output = O3

# =========================================================
# LEAD — Dimension MK3 over MIDI
# =========================================================

[button]
    button = B2.7
    led = L2.7
    states = 3
    value1 = 0
    value2 = 1
    value3 = 2
    preset = _SCENE
    clear = _CLEAR_SCENE
    output = _LEAD_OCTAVE

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    preset = _SCENE
    clear = _CLEAR_SCENE
    length = 16
    activity = _LEAD_DENSITY
    variation = _CHAOS
    dejavu = _DEJAVU
    morphs = _MORPHS
    offbeats = _MAP_X * 0.6 + 0.3
    distribution = _MAP_Y * 0.5 + 0.3
    gatelength = _GATELENGTH * 0.9 + 0.1
    pitchlow = 0
    pitchhigh = 2
    pitchresolution = 12
    reroll = B2.3
    nextpattern = B4.30
    accentlow = 0
    accenthigh = 1
    gate = _LEAD_GATE
    pitch = _LEAD_PITCH_RAW
    accent = _LEAD_ACC

[minifonion]
    input = _LEAD_PITCH_RAW + _LEAD_OCTAVE + _LEAD_REGISTER
    root = _ROOT
    degree = 6
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    output = _LEAD_PITCH

[midiout]
    channel = 1
    trs = 1
    pitch1 = _LEAD_PITCH
    gate1 = _LEAD_GATE * _LEAD_ON
    velocity1 = _LEAD_ACC * 0.4 + 0.6
    ccnumber1 = 1
    cc1 = _TIMBRE
    ccnumber2 = 74
    cc2 = _MAP_Y

# =========================================================
# MACRO CV OUT
# =========================================================

[copy]
    input = _TIMBRE + _MACRO_Y
    output = O6

[copy]
    input = _MANGLE_AMOUNT * 0.5 + _MACRO_X
    output = O7

# =========================================================
# ACTIVITY LEDS — the trigger row mirrors the gates
# =========================================================

[copy]
    input = G1
    output = L4.17

[copy]
    input = G2
    output = L4.18

[copy]
    input = G3
    output = L4.19

[copy]
    input = G4
    output = L4.20

[copy]
    input = G5
    output = L4.21

[copy]
    input = G6
    output = L4.22

[copy]
    input = G7
    output = L4.23

[copy]
    input = G8
    output = L4.24
