# Multi Repetitor - DROID Edition
# Rhythmic gate generator with 3 banks of patterns
# Based on Noise Engineering Zularic Repetitor & Multi Repetitor
#
# BANK 1 (ZR): 8 Zularic patterns (4 Old World 12-step, 4 New World 16-step)
# BANK 2 (NR): 2 Numeric Repetitor patterns (16-step algorithmic)
# BANK 3 (Eucl): Euclidean rhythms (1-13 beats in 16 steps, 4 offset outputs)
# 4 gate outputs per pattern (Mother + 3 Children)
#
# INPUTS:
#  I1: Beat (external clock)
#  I2: Measure (external reset)
#
# OUTPUTS:
#  O1: Mother gate
#  O2: Child 1 gate
#  O3: Child 2 gate
#  O4: Child 3 gate
#
# CONTROLLER 1 (p2b8) - Transport:
#  P1.1: Clock rate
#  P1.2: Pattern select (8 positions per bank)
#  B1.1: Run/Stop
#  B1.2: Reset
#  L1.3-L1.6: Pattern indicator
#
# CONTROLLER 2 (p2b8) - Bank & Display:
#  P2.1: Bank select (ZR / NR / Euclidean)
#  L2.1-L2.4: Beat indicator LEDs
#  L2.5-L2.6: Bank indicator (off/off=ZR, on/off=NR, on/on=Eucl)
#
# ZR Patterns (pot positions 1-8):
#  1-4: Old World 12-step (African rhythms)
#  5-8: New World 16-step (Funk/Rock rhythms)
# NR Patterns (pot positions 1-4 = NR1, 5-8 = NR13):
#  NR1:  X...X...X...X... (four on the floor)
#  NR13: X..X..X.X..X..X. (triplet feel)
# Euclidean (pot selects density: 1,2,3,5,7,9,11,13 beats):
#  4 outputs at phase offsets 0,3,7,11 for polyrhythmic use

[p2b8]
[p2b8]

# -------------------------------------------------
# Clock / Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[copy]
    input = I1 * _RUNNING
    output = _CLOCK

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# -------------------------------------------------
# Bank & Pattern Select
# -------------------------------------------------

# Bank: 0=ZR, 0.5=NR, 1.0=Euclidean
[pot]
    pot = P2.1
    notch = 0.5
    output = _BANK_SELECT

# Bank LEDs: off/off=ZR, on/off=NR, on/on=Eucl
[compare]
    input = _BANK_SELECT
    compare = 0.25
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = L2.5

[compare]
    input = _BANK_SELECT
    compare = 0.75
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = L2.6

[pot]
    pot = P1.2
    notch = 0.143
    output = _PATTERN_SELECT

# ZR half-length: 6 for OW (12-step), 8 for NW (16-step)
[switch]
    input1 = 6
    input2 = 6
    input3 = 6
    input4 = 6
    input5 = 8
    input6 = 8
    input7 = 8
    input8 = 8
    offset = _PATTERN_SELECT
    output1 = _ZR_HALF_LEN

# Bank-aware half-length: NR and Euclidean always 8
[switch]
    input1 = _ZR_HALF_LEN
    input2 = 8
    input3 = 8
    offset = _BANK_SELECT
    output1 = _HALF_LEN

# Pattern indicator (3-bit binary on L1.4-L1.6)
[adc]
    input = _PATTERN_SELECT
    bits = 3
    bit1 = L1.4
    bit2 = L1.5
    bit3 = L1.6

# -------------------------------------------------
# Page Flip Clock
# -------------------------------------------------

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _HALF_LEN
    output = _PAGE_TRIG

[flipflop]
    toggle = _PAGE_TRIG
    reset = _RESET
    output = _SEQ_PAGE

[copy]
    input = _CLOCK * -1 * _SEQ_PAGE + _CLOCK
    output = _CLOCK_A

[copy]
    input = _CLOCK * _SEQ_PAGE
    output = _CLOCK_B

