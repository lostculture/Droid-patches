# Quad Bernoulli Gate
# Port of disting NT quad_bernoulli.lua by Thorinside
#
# Four gate inputs are probabilistically passed or blocked.
# Normaled to internal clock with polyrhythmic divisions
# when inputs are unpatched.
#
# INPUTS:
#  I1: Gate 1 (normaled to internal clock)
#  I2: Gate 2 (normaled to clock /2)
#  I3: Gate 3 (normaled to clock /3)
#  I4: Gate 4 (normaled to clock /4)
#
# OUTPUTS:
#  O1-O4: Passed gates (probability check succeeded)
#  O5-O8: Rejected gates (complement of O1-O4)
#
# CONTROLLER 1 (p2b8):
#  P1.1: Clock Rate (internal, for normalization)
#  P1.2: Probability (0% = block all, 100% = pass all)
#  B1.1-B1.4: Bypass Ch 1-4 (LED on = always passes)
#  B1.5-B1.8: Output activity Ch 1-4 (LED flashes on pass)

[p2b8]

# -------------------------------------------------
# Internal Clock (normaled when inputs unpatched)
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1

[clocktool]
    clock = I1
    divide = 2
    output = N2

[clocktool]
    clock = I1
    divide = 3
    output = N3

[clocktool]
    clock = I1
    divide = 4
    output = N4

# -------------------------------------------------
# Bypass Buttons
# -------------------------------------------------

[button]
    button = B1.1
    led = L1.1
    output = _BYPASS1

[button]
    button = B1.2
    led = L1.2
    output = _BYPASS2

[button]
    button = B1.3
    led = L1.3
    output = _BYPASS3

[button]
    button = B1.4
    led = L1.4
    output = _BYPASS4

# -------------------------------------------------
# Probability Routing
# -------------------------------------------------
#
# Bypass on: distribution = 1 (always pass)
# Bypass off: distribution = P1.2 (probability pot)

[switch]
    input1 = P1.2
    input2 = 1
    offset = _BYPASS1
    output = _PROB1

[switch]
    input1 = P1.2
    input2 = 1
    offset = _BYPASS2
    output = _PROB2

[switch]
    input1 = P1.2
    input2 = 1
    offset = _BYPASS3
    output = _PROB3

[switch]
    input1 = P1.2
    input2 = 1
    offset = _BYPASS4
    output = _PROB4

# -------------------------------------------------
# Bernoulli Gates
# -------------------------------------------------
#
# Each bernoulli sends the gate to output1 (pass) or
# output2 (reject) based on the distribution probability.

[bernoulli]
    input = I1
    distribution = _PROB1
    output1 = _PASS1
    output2 = O5

[bernoulli]
    input = I2
    distribution = _PROB2
    output1 = _PASS2
    output2 = O6

[bernoulli]
    input = I3
    distribution = _PROB3
    output1 = _PASS3
    output2 = O7

[bernoulli]
    input = I4
    distribution = _PROB4
    output1 = _PASS4
    output2 = O8

# -------------------------------------------------
# Outputs & Activity LEDs
# -------------------------------------------------

[copy]
    input = _PASS1
    output = O1

[copy]
    input = _PASS1
    output = L1.5

[copy]
    input = _PASS2
    output = O2

[copy]
    input = _PASS2
    output = L1.6

[copy]
    input = _PASS3
    output = O3

[copy]
    input = _PASS3
    output = L1.7

[copy]
    input = _PASS4
    output = O4

[copy]
    input = _PASS4
    output = L1.8
