# Tintinnalogia — Change Ringing Sequencer
#
# Three traditional English change ringing methods:
#
# PLAIN HUNT (8 bells, 16-change cycle):
#   Odd rows:  swap pairs (1,2), (3,4), (5,6), (7,8)
#   Even rows: swap pairs (2,3), (4,5), (6,7)
#
# GRANDSIRE (7 bells + fixed tenor, 3-change cycle):
#   State "3": swap (1,2), keep 3, swap (4,5), (6,7)
#   State "1": keep 1, swap (2,3), (4,5), (6,7)
#   State "N": swap (1,2), (3,4), (5,6), keep 7
#   Bell 8 (tenor) stays fixed in all states.
#
# PLAIN BOB (8 bells, 12-change lead):
#   Cross (-):  swap all pairs (1,2), (3,4), (5,6), (7,8)
#   1N:         keep 1 & 8, swap (2,3), (4,5), (6,7)
#   Lead end:   keep 1 & 2, swap (3,4), (5,6), (7,8)
#   Pattern: -, 1N, -, 1N, -, 1N, -, 1N, -, 1N, -, 12 (repeat)
#
# INPUTS:
#  I1: External Clock (normaled to internal LFO)
#  I2: Reset to Rounds
#
# OUTPUTS:
#  O1: Pitch CV (current bell, quantized to scale)
#  O2: Row Marker (trigger at start of each new row)
#  O3: Combined Gate (all bell strikes)
#  O4: [unused]
#
# GATE OUTPUTS (G8):
#  G1: Bell 1 (treble — highest pitch)
#  G2: Bell 2
#  G3: Bell 3
#  G4: Bell 4
#  G5: Bell 5
#  G6: Bell 6
#  G7: Bell 7
#  G8: Bell 8 (tenor — lowest pitch)
#
# CONTROLLER 1 (p2b8) - Transport:
#  P1.1: Tempo
#  P1.2: Root Note
#  B1.1: Run / Stop
#  B1.2: Reset to Rounds
#  B1.3: Start / Stop Changes
#  B1.4-B1.8: [unused]
#
# CONTROLLER 2 (p2b8) - Method & Scale:
#  P2.1: Scale Type
#  P2.2: [unused]
#  B2.1: Plain Hunt (method select)
#  B2.2: Grandsire (method select)
#  B2.3: Plain Bob (method select)
#  B2.4-B2.8: [unused]
#
# CONTROLLER 3 (p10) - [unused / available for expansion]
#
# CONTROLLER 4 (b32) - Visualization:
#  L4.1-L4.8:   Bell order (brightness = bell at each position)
#  L4.9-L4.16:  Bell strikes (flash when each bell sounds)
#  L4.17-L4.32: [unused / available for expansion]

[p2b8]
[p2b8]
[p10]
[b32]

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 1
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[button]
    button = B1.3
    led = L1.3
    output = _CHANGES

[copy]
    input = I1 * _RUNNING
    output = _CLOCK

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# -------------------------------------------------
# Row Timing
# -------------------------------------------------

[clocktool]
    clock = _CLOCK
    divide = 8
    output = _ROW_CLOCK

[copy]
    input = _ROW_CLOCK * _CHANGES
    output = _SWAP_TRIGGER

# -------------------------------------------------
# Position Counter
# -------------------------------------------------

[sequencer]
    clock = _CLOCK
    reset = _RESET
    steps = 8
    cv1 = 0
    cv2 = 0.143
    cv3 = 0.286
    cv4 = 0.429
    cv5 = 0.571
    cv6 = 0.714
    cv7 = 0.857
    cv8 = 1
    output = _POS_SELECT

# -------------------------------------------------
# Method Select
# -------------------------------------------------
#
# B2.1 = Plain Hunt (default), B2.2 = Grandsire, B2.3 = Plain Bob.
# Press Reset after switching methods to return to rounds.

[buttongroup]
    button1 = B2.1
    button2 = B2.2
    button3 = B2.3
    led1 = L2.1
    led2 = L2.2
    led3 = L2.3
    buttonoutput1 = _METHOD_PH
    buttonoutput2 = _METHOD_GR
    buttonoutput3 = _METHOD_PB

# -------------------------------------------------
# State Trackers
# -------------------------------------------------
#
# Each method has its own state counter, gated so it
# only advances when its method is selected.

# Plain Hunt: 2-state alternation (odd / even)
[flipflop]
    toggle = _SWAP_TRIGGER * _METHOD_PH
    reset = _RESET
    output = _PH_STATE

# Grandsire: 3-state cycle ("3" / "1" / "N")
# cv values map to 3-input switch offsets: 0, 0.5, 1
[sequencer]
    clock = _SWAP_TRIGGER * _METHOD_GR
    reset = _RESET
    steps = 3
    cv1 = 0
    cv2 = 0.5
    cv3 = 1
    output = _GR_STATE

# Plain Bob: flipflop for odd/even (cross vs non-cross)
# Starts at 0, first toggle → 1. Phase=1 → odd (cross).
[flipflop]
    toggle = _SWAP_TRIGGER * _METHOD_PB
    reset = _RESET
    output = _PB_PHASE

# Plain Bob state computation:
# _PB_LEAD_END comes from the lead-end sequencer placed
# BELOW the S&H, so it reads the PREVIOUS frame's value.
# This ensures the lead-end flag persists through swap 12.
#
# Phase=1 (odd)  → _PB_STATE = 0   → cross
# Phase=0 (even) → _PB_STATE = 0.5 → 1N (normal)
# Phase=0 + lead → _PB_STATE = 1.0 → 12 (lead end)

[copy]
    input = -1 * _PB_PHASE + 1
    output = _PB_PHASE_INV

[copy]
    input = _PB_LEAD_END * 0.5 + 0.5
    output = _PB_EVEN_OFFSET

[copy]
    input = _PB_PHASE_INV * _PB_EVEN_OFFSET
    output = _PB_STATE

# -------------------------------------------------
# Plain Hunt Swap Logic
# -------------------------------------------------
#
# input1 = source when even (_PH_STATE=0)
# input2 = source when odd  (_PH_STATE=1)
#
# Odd:  swap (1,2), (3,4), (5,6), (7,8)
# Even: swap (2,3), (4,5), (6,7); positions 1,8 stay

[switch]
    input1 = _POS1
    input2 = _POS2
    offset = _PH_STATE
    output = _PH1

[switch]
    input1 = _POS3
    input2 = _POS1
    offset = _PH_STATE
    output = _PH2

[switch]
    input1 = _POS2
    input2 = _POS4
    offset = _PH_STATE
    output = _PH3

[switch]
    input1 = _POS5
    input2 = _POS3
    offset = _PH_STATE
    output = _PH4

[switch]
    input1 = _POS4
    input2 = _POS6
    offset = _PH_STATE
    output = _PH5

[switch]
    input1 = _POS7
    input2 = _POS5
    offset = _PH_STATE
    output = _PH6

[switch]
    input1 = _POS6
    input2 = _POS8
    offset = _PH_STATE
    output = _PH7

[switch]
    input1 = _POS8
    input2 = _POS7
    offset = _PH_STATE
    output = _PH8

# -------------------------------------------------
# Grandsire Swap Logic
# -------------------------------------------------
#
# 3-input switches selected by _GR_STATE:
#   input1 (offset=0)   = state "3"
#   input2 (offset=0.5) = state "1"
#   input3 (offset=1)   = state "N"
#
# "3": swap(1,2), keep 3, swap(4,5), swap(6,7)
# "1": keep 1, swap(2,3), swap(4,5), swap(6,7)
# "N": swap(1,2), swap(3,4), swap(5,6), keep 7
# Position 8: always stays (tenor covers)

# Pos 1:  "3"=from2  "1"=keep   "N"=from2
[switch]
    input1 = _POS2
    input2 = _POS1
    input3 = _POS2
    offset = _GR_STATE
    output = _GR1

# Pos 2:  "3"=from1  "1"=from3  "N"=from1
[switch]
    input1 = _POS1
    input2 = _POS3
    input3 = _POS1
    offset = _GR_STATE
    output = _GR2

# Pos 3:  "3"=keep   "1"=from2  "N"=from4
[switch]
    input1 = _POS3
    input2 = _POS2
    input3 = _POS4
    offset = _GR_STATE
    output = _GR3

# Pos 4:  "3"=from5  "1"=from5  "N"=from3
[switch]
    input1 = _POS5
    input2 = _POS5
    input3 = _POS3
    offset = _GR_STATE
    output = _GR4

# Pos 5:  "3"=from4  "1"=from4  "N"=from6
[switch]
    input1 = _POS4
    input2 = _POS4
    input3 = _POS6
    offset = _GR_STATE
    output = _GR5

# Pos 6:  "3"=from7  "1"=from7  "N"=from5
[switch]
    input1 = _POS7
    input2 = _POS7
    input3 = _POS5
    offset = _GR_STATE
    output = _GR6

# Pos 7:  "3"=from6  "1"=from6  "N"=keep
[switch]
    input1 = _POS6
    input2 = _POS6
    input3 = _POS7
    offset = _GR_STATE
    output = _GR7

# -------------------------------------------------
# Plain Bob Swap Logic
# -------------------------------------------------
#
# 3-input switches selected by _PB_STATE:
#   input1 (offset=0)   = cross (swap all pairs from 1)
#   input2 (offset=0.5) = 1N (keep 1 & 8, swap middle)
#   input3 (offset=1)   = 12 / lead end (keep 1 & 2, swap from 3)
#
# Cross:    (1,2), (3,4), (5,6), (7,8) swap
# 1N:       keep 1,8; swap (2,3), (4,5), (6,7)
# Lead end: keep 1,2; swap (3,4), (5,6), (7,8)

# Pos 1:  cross=from2  1N=keep    12=keep
[switch]
    input1 = _POS2
    input2 = _POS1
    input3 = _POS1
    offset = _PB_STATE
    output = _PB1

# Pos 2:  cross=from1  1N=from3   12=keep
[switch]
    input1 = _POS1
    input2 = _POS3
    input3 = _POS2
    offset = _PB_STATE
    output = _PB2

# Pos 3:  cross=from4  1N=from2   12=from4
[switch]
    input1 = _POS4
    input2 = _POS2
    input3 = _POS4
    offset = _PB_STATE
    output = _PB3

# Pos 4:  cross=from3  1N=from5   12=from3
[switch]
    input1 = _POS3
    input2 = _POS5
    input3 = _POS3
    offset = _PB_STATE
    output = _PB4

# Pos 5:  cross=from6  1N=from4   12=from6
[switch]
    input1 = _POS6
    input2 = _POS4
    input3 = _POS6
    offset = _PB_STATE
    output = _PB5

# Pos 6:  cross=from5  1N=from7   12=from5
[switch]
    input1 = _POS5
    input2 = _POS7
    input3 = _POS5
    offset = _PB_STATE
    output = _PB6

# Pos 7:  cross=from8  1N=from6   12=from8
[switch]
    input1 = _POS8
    input2 = _POS6
    input3 = _POS8
    offset = _PB_STATE
    output = _PB7

# Pos 8:  cross=from7  1N=keep    12=from7
[switch]
    input1 = _POS7
    input2 = _POS8
    input3 = _POS7
    offset = _PB_STATE
    output = _PB8

# -------------------------------------------------
# Method Routing
# -------------------------------------------------
#
# 3-input switches select between PH, GR, PB swap outputs.
# Offset: 0 = Plain Hunt, 0.5 = Grandsire, 1.0 = Plain Bob.

[copy]
    input = _METHOD_GR * 0.5 + _METHOD_PB
    output = _METHOD_SELECT

[switch]
    input1 = _PH1
    input2 = _GR1
    input3 = _PB1
    offset = _METHOD_SELECT
    output = _SWAP1

[switch]
    input1 = _PH2
    input2 = _GR2
    input3 = _PB2
    offset = _METHOD_SELECT
    output = _SWAP2

[switch]
    input1 = _PH3
    input2 = _GR3
    input3 = _PB3
    offset = _METHOD_SELECT
    output = _SWAP3

[switch]
    input1 = _PH4
    input2 = _GR4
    input3 = _PB4
    offset = _METHOD_SELECT
    output = _SWAP4

[switch]
    input1 = _PH5
    input2 = _GR5
    input3 = _PB5
    offset = _METHOD_SELECT
    output = _SWAP5

[switch]
    input1 = _PH6
    input2 = _GR6
    input3 = _PB6
    offset = _METHOD_SELECT
    output = _SWAP6

[switch]
    input1 = _PH7
    input2 = _GR7
    input3 = _PB7
    offset = _METHOD_SELECT
    output = _SWAP7

# Position 8: PH and PB swap it, Grandsire keeps it fixed
[switch]
    input1 = _PH8
    input2 = _POS8
    input3 = _PB8
    offset = _METHOD_SELECT
    output = _SWAP8

# -------------------------------------------------
# Reset Routing
# -------------------------------------------------
#
# On reset, route initial "rounds" bell indices.
#   Bell 1: 0.000   Bell 5: 0.571
#   Bell 2: 0.143   Bell 6: 0.714
#   Bell 3: 0.286   Bell 7: 0.857
#   Bell 4: 0.429   Bell 8: 1.000

[switch]
    input1 = _SWAP1
    input2 = 0
    offset = _RESET
    output = _NEW1

[switch]
    input1 = _SWAP2
    input2 = 0.143
    offset = _RESET
    output = _NEW2

[switch]
    input1 = _SWAP3
    input2 = 0.286
    offset = _RESET
    output = _NEW3

[switch]
    input1 = _SWAP4
    input2 = 0.429
    offset = _RESET
    output = _NEW4

[switch]
    input1 = _SWAP5
    input2 = 0.571
    offset = _RESET
    output = _NEW5

[switch]
    input1 = _SWAP6
    input2 = 0.714
    offset = _RESET
    output = _NEW6

[switch]
    input1 = _SWAP7
    input2 = 0.857
    offset = _RESET
    output = _NEW7

[switch]
    input1 = _SWAP8
    input2 = 1
    offset = _RESET
    output = _NEW8

# -------------------------------------------------
# Bell Order State (Sample & Hold)
# -------------------------------------------------

[sample]
    input = _NEW1
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS1

[sample]
    input = _NEW2
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS2

[sample]
    input = _NEW3
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS3

[sample]
    input = _NEW4
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS4

[sample]
    input = _NEW5
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS5

[sample]
    input = _NEW6
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS6

[sample]
    input = _NEW7
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS7

[sample]
    input = _NEW8
    trigger = _SWAP_TRIGGER + _RESET
    output = _POS8

# -------------------------------------------------
# Plain Bob Lead End Tracking
# -------------------------------------------------
#
# Placed AFTER the S&H so advancement happens after swaps
# are committed. The state computation circuits above read
# _PB_LEAD_END from the PREVIOUS frame, ensuring the
# lead-end flag persists through swap 12 before resetting.
#
# Clocktool divides swap triggers by 2, giving one pulse
# per pair of changes. The 6-step sequencer marks step 6
# (the 6th pair = changes 11-12) as the lead end.

[clocktool]
    clock = _SWAP_TRIGGER * _METHOD_PB
    reset = _RESET
    divide = 2
    output = _PB_PAIR_CLOCK

[sequencer]
    clock = _PB_PAIR_CLOCK
    reset = _RESET
    steps = 6
    cv1 = 0
    cv2 = 0
    cv3 = 0
    cv4 = 0
    cv5 = 0
    cv6 = 1
    output = _PB_LEAD_END

# -------------------------------------------------
# Current Bell Selection
# -------------------------------------------------

[switch]
    input1 = _POS1
    input2 = _POS2
    input3 = _POS3
    input4 = _POS4
    input5 = _POS5
    input6 = _POS6
    input7 = _POS7
    input8 = _POS8
    offset = _POS_SELECT
    output = _CURRENT_BELL

# -------------------------------------------------
# Pitch Lookup (bell index → note pitch)
# -------------------------------------------------
#
# Descending major scale, 1V/oct (C4 = 0V):
#   Bell 1: C5   Bell 5: F4
#   Bell 2: B4   Bell 6: E4
#   Bell 3: A4   Bell 7: D4
#   Bell 4: G4   Bell 8: C4

[switch]
    input1 = 1.000
    input2 = 0.917
    input3 = 0.750
    input4 = 0.583
    input5 = 0.417
    input6 = 0.333
    input7 = 0.167
    input8 = 0.000
    offset = _CURRENT_BELL
    output = _PITCH_RAW

# -------------------------------------------------
# Scale Quantization
# -------------------------------------------------

[pot]
    pot = P1.2
    notch = 0.0909
    output = _ROOT

[pot]
    pot = P2.1
    notch = 0.0667
    output = _SCALE

[minifonion]
    input = _PITCH_RAW
    root = _ROOT * 11
    degree = _SCALE * 15
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _PITCH

# -------------------------------------------------
# Bell Detection (threshold comparisons)
# -------------------------------------------------
#
# Thresholds midway between adjacent bell indices:
#   T0=0.071  T1=0.214  T2=0.357  T3=0.500
#   T4=0.643  T5=0.786  T6=0.929

[compare]
    input = _CURRENT_BELL
    compare = 0.071
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _AT0

[compare]
    input = _CURRENT_BELL
    compare = 0.214
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _AT1

[compare]
    input = _CURRENT_BELL
    compare = 0.357
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _AT2

[compare]
    input = _CURRENT_BELL
    compare = 0.500
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _AT3

[compare]
    input = _CURRENT_BELL
    compare = 0.643
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _AT4

[compare]
    input = _CURRENT_BELL
    compare = 0.786
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _AT5

[compare]
    input = _CURRENT_BELL
    compare = 0.929
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _AT6

# NOT gates (invert for "below threshold" detection)

[copy]
    input = -1 * _AT0 + 1
    output = _BT0

[copy]
    input = -1 * _AT1 + 1
    output = _BT1

[copy]
    input = -1 * _AT2 + 1
    output = _BT2

[copy]
    input = -1 * _AT3 + 1
    output = _BT3

[copy]
    input = -1 * _AT4 + 1
    output = _BT4

[copy]
    input = -1 * _AT5 + 1
    output = _BT5

[copy]
    input = -1 * _AT6 + 1
    output = _BT6

# -------------------------------------------------
# B32 Visualization
# -------------------------------------------------
#
# Row 1 (L4.1-L4.8): Bell order — persistent brightness
#   at each position shows which bell is there.
#   Treble (bell 1) = brightest, tenor (bell 8) = dimmest.
#
# Row 2 (L4.9-L4.16): Bell strikes — flash when each
#   bell sounds. L4.9 = bell 1 (treble) through
#   L4.16 = bell 8 (tenor). In rounds, sweeps left to
#   right; after changes, shows shuffled strike order.

# Row 1: Bell order brightness (position 1-8)

[copy]
    input = -0.875 * _POS1 + 1
    output = L4.1

[copy]
    input = -0.875 * _POS2 + 1
    output = L4.2

[copy]
    input = -0.875 * _POS3 + 1
    output = L4.3

[copy]
    input = -0.875 * _POS4 + 1
    output = L4.4

[copy]
    input = -0.875 * _POS5 + 1
    output = L4.5

[copy]
    input = -0.875 * _POS6 + 1
    output = L4.6

[copy]
    input = -0.875 * _POS7 + 1
    output = L4.7

[copy]
    input = -0.875 * _POS8 + 1
    output = L4.8

# Row 2: Bell strike indicators (bell 1-8)

[copy]
    input = _CLOCK * _BT0
    output = L4.9

[copy]
    input = _CLOCK * _AT0 * _BT1
    output = L4.10

[copy]
    input = _CLOCK * _AT1 * _BT2
    output = L4.11

[copy]
    input = _CLOCK * _AT2 * _BT3
    output = L4.12

[copy]
    input = _CLOCK * _AT3 * _BT4
    output = L4.13

[copy]
    input = _CLOCK * _AT4 * _BT5
    output = L4.14

[copy]
    input = _CLOCK * _AT5 * _BT6
    output = L4.15

[copy]
    input = _CLOCK * _AT6
    output = L4.16

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[copy]
    input = _PITCH
    output = O1

[copy]
    input = _ROW_CLOCK
    output = O2

[copy]
    input = _CLOCK
    output = O3

# -------------------------------------------------
# Individual Bell Triggers (G1-G8)
# -------------------------------------------------

# G1: Bell 1 (treble) — below T0
[copy]
    input = _CLOCK * _BT0
    output = G1

# G2: Bell 2 — above T0, below T1
[copy]
    input = _CLOCK * _AT0 * _BT1
    output = G2

# G3: Bell 3 — above T1, below T2
[copy]
    input = _CLOCK * _AT1 * _BT2
    output = G3

# G4: Bell 4 — above T2, below T3
[copy]
    input = _CLOCK * _AT2 * _BT3
    output = G4

# G5: Bell 5 — above T3, below T4
[copy]
    input = _CLOCK * _AT3 * _BT4
    output = G5

# G6: Bell 6 — above T4, below T5
[copy]
    input = _CLOCK * _AT4 * _BT5
    output = G6

# G7: Bell 7 — above T5, below T6
[copy]
    input = _CLOCK * _AT5 * _BT6
    output = G7

# G8: Bell 8 (tenor) — above T6
[copy]
    input = _CLOCK * _AT6
    output = G8
