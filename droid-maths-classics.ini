# Maths Classics — Multi-Function Utility
#
# Five iconic Make Noise MATHS patches combined into a
# single DROID utility module: quadrature LFO, arcade
# trill, voltage-controlled slew, pulse delay, and clock
# divider.
#
# INPUTS:
#  I1: CV input (for slew/portamento)
#  I2: Trigger/Clock input (for pulse delay + clock divider)
#
# OUTPUTS:
#  O1: Quadrature 0° (sine-like LFO)
#  O2: Quadrature 90°
#  O3: Quadrature 180° (inverted 0°)
#  O4: Quadrature 270° (inverted 90°)
#  O5: Arcade Trill (self-modulating FM)
#  O6: Slewed CV (portamento on I1)
#  O7: Delayed trigger (pulse delay on I2)
#  O8: Divided clock
#
# CONTROLLER 1 (p2b8):
#  P1.1: Rate (quad LFO speed + trill base rate)
#  P1.2: Modifier (slew time + delay time)
#  B1.1: Run/Stop (LED = running)
#  B1.2: Reset (momentary)
#  B1.3: Trill Depth (3 states: subtle / medium / wild)
#  B1.4: Clock Divide (4 states: /2 /4 /8 /16)
#  B1.5: Quad Shape (LED on = smooth, off = stepped)
#  B1.6-B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Controls
# -------------------------------------------------

# Run/Stop toggle
[button]
    button = B1.1
    led = L1.1
    output = _RUNNING

# Reset (momentary)
[button]
    button = B1.2
    states = 1
    output = _RESET

# Trill Depth: 3 states (subtle / medium / wild)
[button]
    button = B1.3
    led = L1.3
    states = 3
    output = _TRILL_DEPTH_RAW

# Clock Divide: 4 states (/2 /4 /8 /16)
[button]
    button = B1.4
    led = L1.4
    states = 4
    output = _DIV_STATE

# Quad Shape: toggle smooth/stepped
[button]
    button = B1.5
    led = L1.5
    output = _SMOOTH

# -------------------------------------------------
# Quadrature LFO
# -------------------------------------------------
#
# Two 8-step sequencers with pre-baked sine lookup values.
# The second is phase-offset by 2 steps (= 90 degrees).
# An LFO clocks both at 8x the visible output frequency.
# 180 and 270 degrees are derived by inversion.
# Optional slew smoothing selected by B1.5.

# Quad clock: 8x the desired output rate
[lfo]
    hz = P1.1 * 40 + 0.8
    square = _QUAD_CLOCK_RAW

# Gate the clock with run/stop
[copy]
    input = _QUAD_CLOCK_RAW * _RUNNING
    output = _QUAD_CLOCK

# Sine 0 degrees lookup (8 steps)
# sin: 0.5, 0.854, 1.0, 0.854, 0.5, 0.146, 0.0, 0.146
[sequencer]
    clock = _QUAD_CLOCK
    reset = _RESET
    cv1 = 0.5
    cv2 = 0.854
    cv3 = 1.0
    cv4 = 0.854
    cv5 = 0.5
    cv6 = 0.146
    cv7 = 0.0
    cv8 = 0.146
    cvoutput = _SIN_0_RAW

# Sine 90 degrees lookup (offset by 2 steps)
# sin: 1.0, 0.854, 0.5, 0.146, 0.0, 0.146, 0.5, 0.854
[sequencer]
    clock = _QUAD_CLOCK
    reset = _RESET
    cv1 = 1.0
    cv2 = 0.854
    cv3 = 0.5
    cv4 = 0.146
    cv5 = 0.0
    cv6 = 0.146
    cv7 = 0.5
    cv8 = 0.854
    cvoutput = _SIN_90_RAW

# Smooth transitions for 0 and 90 degrees
[slew]
    input = _SIN_0_RAW
    slew = 0.01
    output = _SIN_0_SMOOTH

[slew]
    input = _SIN_90_RAW
    slew = 0.01
    output = _SIN_90_SMOOTH

# Stepped/smooth selector (B1.5 toggle)
[switch]
    input1 = _SIN_0_RAW
    input2 = _SIN_0_SMOOTH
    offset = _SMOOTH
    output1 = _QUAD_0

[switch]
    input1 = _SIN_90_RAW
    input2 = _SIN_90_SMOOTH
    offset = _SMOOTH
    output1 = _QUAD_90

# 180 degrees = inverted 0 degrees
[copy]
    input = -1 * _QUAD_0 + 1
    output = _QUAD_180

# 270 degrees = inverted 90 degrees
[copy]
    input = -1 * _QUAD_90 + 1
    output = _QUAD_270

# -------------------------------------------------
# Arcade Trill
# -------------------------------------------------
#
# Self-modulating LFO: the triangle output feeds back
# into its own frequency input. DROID's one-frame delay
# keeps this stable. B1.3 controls feedback depth.

# Map depth: subtle (2) / medium (11) / wild (20)
[copy]
    input = _TRILL_DEPTH_RAW * 18 + 2
    output = _TRILL_DEPTH

# Base rate from P1.1
[copy]
    input = P1.1 * 10 + 1
    output = _TRILL_BASE

# Self-modulating LFO
[lfo]
    hz = _TRILL_OUT * _TRILL_DEPTH + _TRILL_BASE
    triangle = _TRILL_OUT

# -------------------------------------------------
# VC Slew / Portamento
# -------------------------------------------------

[slew]
    input = I1
    slew = P1.2
    output = O6

# -------------------------------------------------
# Pulse Delay
# -------------------------------------------------

[triggerdelay]
    input = I2
    delay = P1.2 * 2
    output = O7

# -------------------------------------------------
# Clock Divider
# -------------------------------------------------

# Map B1.4 state to division ratio
[switch]
    input1 = 2
    input2 = 4
    input3 = 8
    input4 = 16
    offset = _DIV_STATE
    output1 = _DIV_RATIO

[clocktool]
    clock = I2
    divide = _DIV_RATIO
    output = O8

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[copy]
    input = _QUAD_0
    output = O1

[copy]
    input = _QUAD_90
    output = O2

[copy]
    input = _QUAD_180
    output = O3

[copy]
    input = _QUAD_270
    output = O4

[copy]
    input = _TRILL_OUT
    output = O5
