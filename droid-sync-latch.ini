# Sync Latch — Musical Boundary Transport
# Port of disting NT sync_latch.lua by Sleepwalk Cinema
# (original concept: Mutable Instruments MIDIpal)
#
# Defers transport changes to loop boundaries. Arm the
# latch, and the slave gate toggles at the next end of
# loop. Use this to start/stop sequencers and drum
# machines on precise musical boundaries.
#
# Assumes 4/4 time (4 beats per bar).
#
# INPUTS:
#  I1: Clock (normaled to internal LFO)
#  I2: Arm (trigger toggles arm state)
#
# OUTPUTS:
#  O1: Slave Run gate (toggles at loop boundaries)
#  O2: Armed/Fill gate (high from arm to latch fire)
#  O3: End of Bar trigger (every 4 beats)
#  O4: End of Loop trigger
#  O5: Gated Clock (clock * slave run)
#  O6-O8: [unused]
#
# CONTROLLER 1 (p2b8):
#  P1.1: Clock Rate
#  P1.2: Bars per Loop (1-8, notched; 4 beats per bar)
#  B1.1: Run/Stop
#  B1.2: Reset
#  B1.3: Arm (LED on = armed, auto-clears on latch)
#  B1.4: Direct Slave Toggle (LED = slave running)
#  B1.5-B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[copy]
    input = I1 * _RUNNING
    output = _CLOCK

[copy]
    input = _RESET_BTN
    output = _RESET

# -------------------------------------------------
# Beat & Bar Counting
# -------------------------------------------------
#
# 4 beats per bar (4/4 time). P1.2 sets bars per loop.

[pot]
    pot = P1.2
    notch = 0.143
    output = _BARS_RAW

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = 4
    output = _EOB

[clocktool]
    clock = _EOB
    reset = _RESET
    divide = _BARS_RAW * 7 + 1
    output = _EOL

# -------------------------------------------------
# Arm & Latch
# -------------------------------------------------
#
# Arm toggles with B1.3 or I2. When armed AND the
# loop ends, the latch fires — toggling the slave
# and auto-clearing the arm state.

[button]
    button = B1.3
    states = 1
    output = _ARM_BTN

# Armed flipflop: toggle to arm/disarm, auto-reset
# when latch fires. The one-frame delay on reset is
# harmless — _ARMED clears on the frame after EOL.
[flipflop]
    toggle = _ARM_BTN + I2
    reset = _LATCH_TRIGGER + _RESET
    output = _ARMED

[copy]
    input = _ARMED
    output = L1.3

# Latch fires when end-of-loop coincides with armed
[copy]
    input = _EOL * _ARMED
    output = _LATCH_TRIGGER

# -------------------------------------------------
# Slave Run
# -------------------------------------------------
#
# Starts idle (0). Arm + wait for EOL to start.
# B1.4 (direct toggle) bypasses the latch for
# immediate start/stop.

[button]
    button = B1.4
    states = 1
    output = _DIRECT_TOGGLE

[flipflop]
    toggle = _LATCH_TRIGGER + _DIRECT_TOGGLE
    reset = _RESET
    output = _SLAVE_RUN

[copy]
    input = _SLAVE_RUN
    output = L1.4

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[copy]
    input = _SLAVE_RUN
    output = O1

[copy]
    input = _ARMED
    output = O2

[copy]
    input = _EOB
    output = O3

[copy]
    input = _EOL
    output = O4

[copy]
    input = _CLOCK * _SLAVE_RUN
    output = O5
