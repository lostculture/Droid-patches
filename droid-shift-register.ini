# 6-Stage CV Shift Register
# Port of disting NT shift_register.lua by Thorinside
#
# CV values shift down through 6 stages on each trigger.
# Internal random CV and clock when inputs are unpatched.
# Optional feedback loops stage 6 back to the input.
#
# INPUTS:
#  I1: CV Input (normaled to random)
#  I2: Trigger Input (normaled to internal clock)
#
# OUTPUTS:
#  O1: Stage 1 (newest)
#  O2: Stage 2
#  O3: Stage 3
#  O4: Stage 4
#  O5: Stage 5
#  O6: Stage 6 (oldest)
#  O7: Trigger pass-through
#  O8: [unused]
#
# CONTROLLER 1 (p2b8):
#  P1.1: Clock Rate
#  P1.2: Random Range (internal source, 0-10 octaves)
#  B1.1: Run/Stop
#  B1.2: Reset (clear all stages to 0)
#  B1.3: Feedback (loop stage 6 back to input)
#  B1.4-B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N2

[random]
    trigger = I2
    max = P1.2
    output = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET

[button]
    button = B1.3
    led = L1.3
    output = _FEEDBACK

[copy]
    input = I2 * _RUNNING
    output = _TRIGGER

# -------------------------------------------------
# Input Routing
# -------------------------------------------------

# Feedback: loop stage 6 back to input when enabled
[switch]
    input1 = I1
    input2 = _STAGE6
    offset = _FEEDBACK
    output = _SR_INPUT

# -------------------------------------------------
# Shift Register (reverse order for correct propagation)
# -------------------------------------------------
#
# Stages are processed 6→5→4→3→2→1 so each latches
# the PREVIOUS stage's old value before it gets updated.
# Reset routing selects 0 (clear) on reset pulse.

[switch]
    input1 = _STAGE5
    input2 = 0
    offset = _RESET
    output = _NEW6

[sample]
    input = _NEW6
    trigger = _TRIGGER + _RESET
    output = _STAGE6

[switch]
    input1 = _STAGE4
    input2 = 0
    offset = _RESET
    output = _NEW5

[sample]
    input = _NEW5
    trigger = _TRIGGER + _RESET
    output = _STAGE5

[switch]
    input1 = _STAGE3
    input2 = 0
    offset = _RESET
    output = _NEW4

[sample]
    input = _NEW4
    trigger = _TRIGGER + _RESET
    output = _STAGE4

[switch]
    input1 = _STAGE2
    input2 = 0
    offset = _RESET
    output = _NEW3

[sample]
    input = _NEW3
    trigger = _TRIGGER + _RESET
    output = _STAGE3

[switch]
    input1 = _STAGE1
    input2 = 0
    offset = _RESET
    output = _NEW2

[sample]
    input = _NEW2
    trigger = _TRIGGER + _RESET
    output = _STAGE2

[switch]
    input1 = _SR_INPUT
    input2 = 0
    offset = _RESET
    output = _NEW1

[sample]
    input = _NEW1
    trigger = _TRIGGER + _RESET
    output = _STAGE1

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[copy]
    input = _STAGE1
    output = O1

[copy]
    input = _STAGE2
    output = O2

[copy]
    input = _STAGE3
    output = O3

[copy]
    input = _STAGE4
    output = O4

[copy]
    input = _STAGE5
    output = O5

[copy]
    input = _STAGE6
    output = O6

[copy]
    input = _TRIGGER
    output = O7
