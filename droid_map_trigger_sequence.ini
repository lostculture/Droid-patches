# note: buttons of algoquencer are toggle buttons!
[algoquencer]
	clock = I1
	reset = I2
	trigger = O8 # output intended to trigger a drum voice
	activity = P1.1
 	button1 = _button1_toggle
	button2 = _button2_toggle
	button3 = _button3_toggle
	button4 = _button4_toggle
	button5 = _button5_toggle
	button6 = _button6_toggle
	button7 = _button7_toggle
	button8 = _button8_toggle
# check result visually
	led1 = L1.1
	led2 = L1.2
	led3 = L1.3
	led4 = L1.4
	led5 = L1.5
	led6 = L1.6
	led7 = L1.7
	led8 = L1.8
