[droid]
    ledbrightness = 0.5

[p2b8]

# create distinct cv values for each step to identify the step position in the [compare] circuits
[sequencer] # 1. 16 steps (1-8)
	clock = I1
	reset = I2
	cvoutput = _step
	cv1 = 0.1
	cv2 = 0.2
	cv3 = 0.3
	cv4 = 0.4
	cv5 = 0.5
	cv6 = 0.6
	cv7 = 0.7
	cv8 = 0.8

# convert trigger inputs to gates
[contour]
	trigger = I8 # trigger input sent from Kompas (pulses of 5.5 V)
	attack = 0
	hold = 0.18 # buggy manual says 0.5 means a hold time of 5 seconds -> here: 0.18 = 0.09 s
	release = 0
	output = _NR_prime

# check output
#[copy]
#	input = _NR_prime  # low = 0.4 V ; gate of 0.09 s and 10.74 V
#	output = O8

# send a trigger/gate every step 1
[compare]
	input = _step
	compare = 0.1
	precision = 0.01
	ifequal = 1 # else = 0 (default)
	output = _trigger_sh1

# check output
#[copy]
##	input = _trigger_sh1   # low = 0.4 V ; gate of 0.12 s at 10.74 V
#	input = _trigger_sh7   # low = 0.4 V ; gate of 0.12 s at 10.74 V
#	output = O7

# sample state on/off of step 1 of the input sequence
[sample]
	input = _NR_prime
	sample = _trigger_sh1
	timewindow = 0.01 # unit is seconds
	output = _button1

# send state only if different from current state, as algoquencer buttons are toggle buttons
[logic]
	input1 = _button1
	input2 = L1.1
	nand = _button1_toggle
#	nand = O7

# check output
#[copy]
##	input = _button1       # gate low/high with 0.4/10.74 V
#	input = _button1_toggle       # gate low/high with 0.4/10.74 V
#	output = O7

# same for steps 2-8 ...
[compare]
	input = _step
	compare = 0.2
	precision = 0.01
	ifequal = 1
	output = _trigger_sh2
	
[sample]
	input = _NR_prime
