# No Control — Variable-Timing Trigger Sequencer
# Port of disting NT no_control.lua by Expert Sleepers
#
# Self-clocking 8-step sequencer where each step has
# a random duration. Slow steps linger, fast steps rush.
# Creates irregular, organic rhythms that repeat until
# rerolled. The duration values double as pitch CV.
#
# INPUTS:
#  I1: Reset
#  I2: [unused]
#
# OUTPUTS:
#  O1: Trigger (fires every step)
#  O2: Gate (algorithmic pattern, ~80% density)
#  O3: Pitch CV (step duration value, quantized to scale)
#  O4: BOC Trigger (beginning of cycle)
#  O5-O8: [unused]
#
# CONTROLLER 1 (p2b8):
#  P1.1: Speed Range (low = uniform slow, high = wide variation)
#  P1.2: Steps (1-8, notched)
#  B1.1: Run/Stop
#  B1.2: Reset
#  B1.3: Reroll (new random timing pattern)
#  B1.4: Freeze (LED on = hold current step)
#  B1.5: Quantize (LED on = pitch CV quantized)
#  B1.6-B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Transport
# -------------------------------------------------

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[copy]
    input = _RESET_BTN + I1
    output = _RESET

[button]
    button = B1.3
    led = L1.3
    states = 1
    output = _REROLL

[button]
    button = B1.4
    led = L1.4
    output = _FREEZE

[button]
    button = B1.5
    led = L1.5
    startvalue = 1
    output = _QUANTIZE

[pot]
    pot = P1.2
    notch = 0.143
    output = _STEPS_RAW

# -------------------------------------------------
# Self-Clocking Engine
# -------------------------------------------------
#
# The LFO speed is modulated by the current step's
# duration CV. Low CV = slow LFO = long step.
# High CV = fast LFO = short step.
# P1.1 scales the speed range: at 0 all steps are
# ~2 sec, at full the fastest steps reach ~60ms.

[copy]
    input = P1.1 * 15 + 0.5
    output = _SPEED_SCALE

[lfo]
    hz = _DURATION_CV * _SPEED_SCALE + 0.5
    square = _SELF_CLOCK_RAW

# -------------------------------------------------
# Clock Gating (Run/Stop & Freeze)
# -------------------------------------------------

[copy]
    input = -1 * _FREEZE + 1
    output = _NOT_FREEZE

[copy]
    input = _RUNNING * _NOT_FREEZE
    output = _PLAY_GATE

[copy]
    input = _SELF_CLOCK_RAW * _PLAY_GATE
    output = _CLOCK

# -------------------------------------------------
# Step Sequence
# -------------------------------------------------
#
# Algoquencer generates a remembered random pattern.
# Each step's pitch value controls the LFO speed for
# that step, creating variable timing. Dejavu = 1
# remembers the pattern; press Reroll for a new one.

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    reroll = _REROLL
    activity = 0.8
    variation = 0.5
    dejavu = 1
    steps = _STEPS_RAW * 7 + 1
    pitch = _DURATION_CV
    gate = _GATE

# -------------------------------------------------
# Pitch Quantization (optional)
# -------------------------------------------------

[minifonion]
    input = _DURATION_CV
    root = 0
    degree = 7
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _CV_Q

[switch]
    input1 = _DURATION_CV
    input2 = _CV_Q
    offset = _QUANTIZE
    output = O3

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _STEPS_RAW * 7 + 1
    output = O4

[copy]
    input = _CLOCK
    output = O1

[copy]
    input = _GATE
    output = O2
