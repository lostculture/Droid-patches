    pot = P3.1
    startvalue = 0.5
    output = _T1_ACTIVITY

[pot]
    select = _SEL_T1
    pot = P3.2
    startvalue = 0.3
    output = _T1_VARIATION

[pot]
    select = _SEL_T1
    pot = P3.3
    notch = 0.143
    startvalue = 1
    output = _T1_STEPS

[pot]
    select = _SEL_T1
    pot = P3.4
    startvalue = 0.5
    output = _T1_GATELENGTH

[pot]
    select = _SEL_T1
    pot = P3.5
    startvalue = 0.5
    output = _T1_DEJAVU

[pot]
    select = _SEL_T1
    pot = P3.6
    startvalue = 0.3
    output = _T1_MORPHS

