# 4-Track Generative Sequencer
#
# INPUTS:
#  I1: External Clock (normaled to internal LFO)
#  I2: External Reset
#
# OUTPUTS:
#  O1-O4: Track 1-4 Pitch CV (quantized)
#  O5-O8: Track 1-4 Accent
#
# GATE OUTPUTS (G8):
#  G1-G4: Track 1-4 Gates
#
# CONTROLLER 1 (p2b8) - Transport:
#  P1.1: Tempo
#  P1.2: Permutation Rate (Plain Bob)
#  B1.1: Run/Stop          B1.5: Mute Track 1
#  B1.2: Reset             B1.6: Mute Track 2
#  B1.3: Reroll            B1.7: Mute Track 3
#  B1.4: Plain Bob On/Off   B1.8: Mute Track 4
#
# CONTROLLER 2 (p2b8) - Performance:
#  P2.1: Root Note (12 semitones)
#  P2.2: Scale Type
#  B2.1-B2.4: Fill Track 1-4 (momentary)
#  B2.5-B2.8: Select Track 1-4 (for P10 overlay)
#
# CONTROLLER 3 (p10) - Per-Track (overlaid by track select):
#  P3.1: Activity          P3.5: Dejavu
#  P3.2: Variation         P3.6: Morphs
#  P3.3: Steps (1-8)       P3.7: Rolls (global)
#  P3.4: Gate Length        P3.8-P3.10: [unused]
#
# CONTROLLER 4 (b32) - Step Buttons:
#  B4.1-B4.8:   Track 1    B4.17-B4.24: Track 3
#  B4.9-B4.16:  Track 2    B4.25-B4.32: Track 4

[p2b8]
[p2b8]
[p10]
[b32]

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[copy]
    input = I1 * _RUNNING
    output = _CLOCK

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# -------------------------------------------------
# Reroll (regenerate all patterns)
# -------------------------------------------------

[button]
    button = B1.3
    led = L1.3
    states = 1
    output = _REROLL

# -------------------------------------------------
# Plain Bob Controls
# -------------------------------------------------

[button]
    button = B1.4
    led = L1.4
    output = _PB_ENABLE

[pot]
    pot = P1.2
    notch = 0.143
    output = _PB_RATE

# -------------------------------------------------
# Track Select (P10 overlay control)
# -------------------------------------------------

[buttongroup]
    button1 = B2.5
    button2 = B2.6
    button3 = B2.7
    button4 = B2.8
    led1 = L2.5
    led2 = L2.6
    led3 = L2.7
    led4 = L2.8
    buttonoutput1 = _SEL_T1
    buttonoutput2 = _SEL_T2
    buttonoutput3 = _SEL_T3
    buttonoutput4 = _SEL_T4

# -------------------------------------------------
# Track Mutes (LED on = unmuted)
# -------------------------------------------------

[button]
    button = B1.5
    led = L1.5
    startvalue = 1
    output = _UNMUTE_T1

[button]
    button = B1.6
    led = L1.6
    startvalue = 1
    output = _UNMUTE_T2

[button]
    button = B1.7
    led = L1.7
    startvalue = 1
    output = _UNMUTE_T3

[button]
    button = B1.8
    led = L1.8
    startvalue = 1
    output = _UNMUTE_T4

# -------------------------------------------------
# Global Pitch Controls
# -------------------------------------------------

[pot]
    pot = P2.1
    notch = 0.0909
    output = _ROOT_RAW

[pot]
    pot = P2.2
    notch = 0.0667
    output = _SCALE_RAW

# -------------------------------------------------
# P10 Overlay — Track 1
