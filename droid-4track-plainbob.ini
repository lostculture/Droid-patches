# -------------------------------------------------
# Pitch Quantizers
# -------------------------------------------------

[minifonion]
    input = _T1_PITCH_RAW
    root = _ROOT_RAW * 11
    degree = _SCALE_RAW * 15
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _T1_PITCH

[minifonion]
    input = _T2_PITCH_RAW
    root = _ROOT_RAW * 11
    degree = _SCALE_RAW * 15
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _T2_PITCH

[minifonion]
