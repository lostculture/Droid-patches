# -------------------------------------------------
# Plain Bob Permutation
# -------------------------------------------------

# Row clock: divide main clock by 4-32 steps
[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _PB_RATE * 28 + 4
    output = _PB_ROW_RAW

# Gated swap trigger
[copy]
    input = _PB_ROW_RAW * _PB_ENABLE
    output = _PB_SWAP

# Odd/even phase toggle
[flipflop]
    toggle = _PB_SWAP
    reset = _RESET
    output = _PB_PHASE

# State computation
[copy]
    input = -1 * _PB_PHASE + 1
    output = _PB_PHASE_INV

[copy]
    input = _PB_LEAD_END * 0.5 + 0.5
    output = _PB_EVEN_OFFSET

[copy]
    input = _PB_PHASE_INV * _PB_EVEN_OFFSET
    output = _PB_STATE

# 3-input swap logic (cross / 14 / lead-end 12)
# Position 1: cross=from2, 14=keep, 12=keep
[switch]
    input1 = _ORD2
    input2 = _ORD1
    input3 = _ORD1
    offset = _PB_STATE
    output = _PB1

# Position 2: cross=from1, 14=from3, 12=keep
[switch]
    input1 = _ORD1
    input2 = _ORD3
    input3 = _ORD2
    offset = _PB_STATE
    output = _PB2

# Position 3: cross=from4, 14=from2, 12=from4
[switch]
    input1 = _ORD4
    input2 = _ORD2
    input3 = _ORD4
    offset = _PB_STATE
    output = _PB3

# Position 4: cross=from3, 14=keep, 12=from3
[switch]
    input1 = _ORD3
    input2 = _ORD4
    input3 = _ORD3
    offset = _PB_STATE
    output = _PB4

# Reset routing (identity values on reset)
[switch]
    input1 = _PB1
    input2 = 0
    offset = _RESET
    output = _NEW1

[switch]
    input1 = _PB2
    input2 = 0.333
    offset = _RESET
    output = _NEW2

[switch]
    input1 = _PB3
    input2 = 0.667
    offset = _RESET
    output = _NEW3

[switch]
    input1 = _PB4
    input2 = 1
    offset = _RESET
    output = _NEW4

# Order state S&H
[sample]
    input = _NEW1
    trigger = _PB_SWAP + _RESET
    output = _ORD1

[sample]
    input = _NEW2
    trigger = _PB_SWAP + _RESET
    output = _ORD2

[sample]
    input = _NEW3
    trigger = _PB_SWAP + _RESET
    output = _ORD3

[sample]
    input = _NEW4
    trigger = _PB_SWAP + _RESET
    output = _ORD4

# Lead-end tracking (AFTER S&H for correct timing)
[clocktool]
    clock = _PB_SWAP
    reset = _RESET
    divide = 2
    output = _PB_PAIR_CLOCK

[sequencer]
    clock = _PB_PAIR_CLOCK
    reset = _RESET
    steps = 6
    cv1 = 0
    cv2 = 0
    cv3 = 0
    cv4 = 0
    cv5 = 0
    cv6 = 1
    output = _PB_LEAD_END

# Pitch lookup (order index -> track pitch)
[switch]
    input1 = _T1_PITCH
    input2 = _T2_PITCH
    input3 = _T3_PITCH
    input4 = _T4_PITCH
    offset = _ORD1
    output = _PERM_PITCH1

[switch]
    input1 = _T1_PITCH
    input2 = _T2_PITCH
    input3 = _T3_PITCH
    input4 = _T4_PITCH
    offset = _ORD2
    output = _PERM_PITCH2

[switch]
    input1 = _T1_PITCH
    input2 = _T2_PITCH
    input3 = _T3_PITCH
    input4 = _T4_PITCH
    offset = _ORD3
    output = _PERM_PITCH3

[switch]
    input1 = _T1_PITCH
    input2 = _T2_PITCH
    input3 = _T3_PITCH
    input4 = _T4_PITCH
    offset = _ORD4
    output = _PERM_PITCH4

# -------------------------------------------------
# Outputs (with mute gating)
# -------------------------------------------------

[copy]
    input = _PERM_PITCH1
    output = O1

[copy]
    input = _T1_GATE * _UNMUTE_T1
    output = G1

[copy]
    input = _T1_ACCENT * _UNMUTE_T1
    output = O5

[copy]
    input = _PERM_PITCH2
    output = O2

[copy]
    input = _T2_GATE * _UNMUTE_T2
    output = G2

[copy]
