# -------------------------------------------------
# Track 1 — Algoquencer
# -------------------------------------------------

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    reroll = _REROLL
    activity = _T1_ACTIVITY
    variation = _T1_VARIATION
    steps = _T1_STEPS * 7 + 1
    gatelength = _T1_GATELENGTH
    dejavu = _T1_DEJAVU
    morphs = _T1_MORPHS * 7 + 1
    rolls = P3.7
    fillbutton = B2.1
    button1 = B4.1
    button2 = B4.2
    button3 = B4.3
    button4 = B4.4
    button5 = B4.5
    button6 = B4.6
    button7 = B4.7
    button8 = B4.8
    led1 = L4.1
    led2 = L4.2
    led3 = L4.3
    led4 = L4.4
    led5 = L4.5
    led6 = L4.6
    led7 = L4.7
    led8 = L4.8
    pitch = _T1_PITCH_RAW
    gate = _T1_GATE
    accent = _T1_ACCENT

