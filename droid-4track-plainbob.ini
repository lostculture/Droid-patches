    output = O6

[copy]
    input = _PERM_PITCH3
    output = O3

[copy]
    input = _T3_GATE * _UNMUTE_T3
    output = G3

[copy]
    input = _T3_ACCENT * _UNMUTE_T3
    output = O7

[copy]
