# TB-303 Acid Pattern Generator
# Generative acid bass lines with b32 step editing, probabilistic slide,
# accent envelopes, and pattern seed navigation.

# INPUTS:
#  I1: [External clock (normaled to internal LFO)]
#  I2: [External reset]

# OUTPUTS:
#  O1: [Pitch CV with slide/portamento]
#  O2: [Gate]
#  O3: [Accent envelope]
#  O4: [Accent CV (raw 0/1)]
#  O5: [Slide gate]
#  O6: [Clock thru]
#  O7: [Beginning of cycle trigger]

# CONTROLLER 1 (p2b8) — Transport & Pattern:
#  P1.1: Tempo (internal clock speed)
#  P1.2: Activity / gate density
#  B1.1: Run/Stop (LED = running)
#  B1.2: Reset (momentary)
#  B1.3: Reroll pattern (momentary)
#  B1.4: Steps (4 states: 4/8/12/16)
#  B1.5: Scale (4 states: chromatic/minor/phrygian/minor penta)
#  B1.6: Next pattern seed (momentary)
#  B1.7: Prev pattern seed (momentary)
#  B1.8: Fills toggle

# CONTROLLER 2 (p2b8) — Sound Shaping:
#  P2.1: Accent amount
#  P2.2: Slide time (portamento speed)
#  B2.1: Accent edit (hold + press b32 step buttons)
#  B2.2: Slide probability (3 states: off/25%/50%)
#  B2.3: Gate length (3 states: staccato/normal/legato)
#  B2.4: Octave range (3 states: 1/2/3 octaves)
#  B2.5: Morphs toggle (pattern evolution)
#  B2.6: Offbeats toggle
#  B2.7: Mute toggle (LED = muted)
#  B2.8: Length edit (hold + press b32 step buttons)

# CONTROLLER 3 (b32) — Step Editor & Pattern Bank:
#  B3.1-B3.16:  Step buttons (gate/accent/length edit)
#  L3.1-L3.16:  Step LEDs
#  L3.17-L3.20: Bar position LEDs
#  B3.21:       Fixed pattern mode (LED = fixed mode active)
#  B3.22:       Pattern select (4 states: AT197/AT119/AT71/AT49)

[p2b8]    # Controller 1: Transport & Pattern
[p2b8]    # Controller 2: Sound Shaping
[b32]     # Controller 3: Step Editor

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

# Internal clock LFO (normaled to I1)
[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1

# Run/Stop toggle (default: running)
[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

# Reset (momentary)
[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

# Gate clock with running state
[copy]
    input = I1 * _RUNNING
    output = _CLOCK

# Merge reset button + external reset
[copy]
    input = _RESET_BTN + I2
    output = _RESET

# -------------------------------------------------
# Pattern Controls
# -------------------------------------------------

# Reroll pattern (momentary)
[button]
    button = B1.3
    led = L1.3
    states = 1
    output = _REROLL

# Steps selector (4 states: 4/8/12/16)
[button]
    button = B1.4
    led = L1.4
    states = 4
    output = _STEPS_STATE

[switch]
    input1 = 4
    input2 = 8
    input3 = 12
    input4 = 16
    offset = _STEPS_STATE
    output1 = _STEPS

# Scale selector (4 states: chromatic/minor/phrygian/minor pentatonic)
[button]
    button = B1.5
    led = L1.5
    states = 4
    output = _SCALE_STATE

[switch]
    input1 = 0       # chromatic
    input2 = 6       # minor (aeolian)
    input3 = 3       # phrygian
    input4 = 12      # minor pentatonic
    offset = _SCALE_STATE
    output1 = _SCALE_DEGREE

# Next pattern seed (momentary)
[button]
    button = B1.6
    led = L1.6
    states = 1
    output = _NEXT_PATTERN

# Previous pattern seed (momentary)
[button]
    button = B1.7
    led = L1.7
    states = 1
    output = _PREV_PATTERN

# Fills toggle
[button]
    button = B1.8
    led = L1.8
    output = _FILLS_ON

# -------------------------------------------------
# Sound Controls
# -------------------------------------------------

# Accent edit: mirror B2.1 press to LED (algoquencer reads B2.1 directly)
[copy]
    input = B2.1
    output = L2.1

# Slide probability (3 states: off / 25% / 50%)
[button]
    button = B2.2
    led = L2.2
    states = 3
    output = _SLIDE_STATE

[switch]
    input1 = 0
    input2 = 0.25
    input3 = 0.5
    offset = _SLIDE_STATE
    output1 = _SLIDE_PROB

# Gate length (3 states: staccato / normal / legato)
[button]
    button = B2.3
    led = L2.3
    states = 3
    output = _GATE_LEN_STATE

[switch]
    input1 = 0.4      # staccato
    input2 = 0.7      # normal
    input3 = 1.1      # legato
    offset = _GATE_LEN_STATE
    output1 = _GATE_LENGTH

# Octave range (3 states: 1 / 2 / 3 octaves)
[button]
    button = B2.4
    led = L2.4
    states = 3
    output = _OCT_STATE

[switch]
    input1 = 1V       # 1 octave
    input2 = 2V       # 2 octaves
    input3 = 3V       # 3 octaves
    offset = _OCT_STATE
    output1 = _OCTAVE_RANGE

# Morphs toggle (pattern evolution)
[button]
    button = B2.5
    led = L2.5
    output = _MORPHS_ON

# Offbeats toggle
[button]
    button = B2.6
    led = L2.6
    output = _OFFBEATS_ON

# Length edit: mirror B2.8 press to LED (algoquencer reads B2.8 directly)
[copy]
    input = B2.8
    output = L2.8

# -------------------------------------------------
# Algoquencer — Core Sequencer Engine
# -------------------------------------------------

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    button1 = B3.1
    button2 = B3.2
    button3 = B3.3
    button4 = B3.4
    button5 = B3.5
    button6 = B3.6
    button7 = B3.7
    button8 = B3.8
    button9 = B3.9
    button10 = B3.10
    button11 = B3.11
    button12 = B3.12
    button13 = B3.13
    button14 = B3.14
    button15 = B3.15
    button16 = B3.16
    led1 = L3.1
    led2 = L3.2
    led3 = L3.3
    led4 = L3.4
    led5 = L3.5
    led6 = L3.6
    led7 = L3.7
    led8 = L3.8
    led9 = L3.9
    led10 = L3.10
    led11 = L3.11
    led12 = L3.12
    led13 = L3.13
    led14 = L3.14
    led15 = L3.15
    led16 = L3.16
    barled1 = L3.17
    barled2 = L3.18
    barled3 = L3.19
    barled4 = L3.20
    accentbutton = B2.1
    lengthbutton = B2.8
    mutebutton = B2.7
    muteled = L2.7
    reroll = _REROLL
    nextpattern = _NEXT_PATTERN
    prevpattern = _PREV_PATTERN
    dejavu = 1
    morphs = _MORPHS_ON * 0.1
    activity = P1.2
    variation = 0.5
    fills = _FILLS_ON * 0.5
    offbeats = _OFFBEATS_ON * 0.5
    pitchlow = 0
    pitchhigh = _OCTAVE_RANGE
    pitchresolution = 7
    gatelength = _GATE_LENGTH
    length = _STEPS
    accentlow = 0
    accenthigh = 1
    pitch = _PITCH_RAW
    gate = _GATE
    accent = _ACCENT
    trigger = _TRIGGER

# -------------------------------------------------
# Fixed Pattern Bank
# -------------------------------------------------
# 4 curated patterns from acid-tabs.com (CC BY-SA)
# Pattern 1: AT197 (Blues)    Pattern 2: AT119 (Mixolydian)
# Pattern 3: AT71  (Minor)    Pattern 4: AT49  (Locrian)

# Mode toggle: generative (off) vs fixed (on)
[button]
    button = B3.21
    led = L3.21
    output = _FIXED_MODE

# Pattern select: cycles through 4 fixed patterns
[button]
    button = B3.22
    led = L3.22
    states = 4
    output = _PATTERN_SELECT

# Clock page flip (divide by 8 to alternate A/B halves)
[clocktool]
    clock = _CLOCK * _FIXED_MODE
    reset = _RESET
    divide = 8
    output = _PAGE_TRIGGER

[flipflop]
    toggle = _PAGE_TRIGGER
    reset = _RESET
    output = _SEQ_PAGE

# Route clock to A-half (page=0) or B-half (page=1)
[switch]
    input1 = _CLOCK * _FIXED_MODE
    input2 = 0
    offset = _SEQ_PAGE
    output1 = _CLOCK_A

[switch]
    input1 = 0
    input2 = _CLOCK * _FIXED_MODE
    offset = _SEQ_PAGE
    output1 = _CLOCK_B

