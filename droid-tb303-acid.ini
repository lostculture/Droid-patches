[switch]
    input1 = _FP1_PITCH_A
    input2 = _FP2_PITCH_A
    input3 = _FP3_PITCH_A
    input4 = _FP4_PITCH_A
    offset = _PATTERN_SELECT
    output1 = _FP_PITCH_A

[switch]
    input1 = _FP1_PITCH_B
    input2 = _FP2_PITCH_B
    input3 = _FP3_PITCH_B
    input4 = _FP4_PITCH_B
    offset = _PATTERN_SELECT
    output1 = _FP_PITCH_B

[switch]
    input1 = _FP1_GATE_A
    input2 = _FP2_GATE_A
    input3 = _FP3_GATE_A
    input4 = _FP4_GATE_A
    offset = _PATTERN_SELECT
    output1 = _FP_GATE_A

[switch]
    input1 = _FP1_GATE_B
    input2 = _FP2_GATE_B
    input3 = _FP3_GATE_B
    input4 = _FP4_GATE_B
    offset = _PATTERN_SELECT
    output1 = _FP_GATE_B

[switch]
    input1 = _FP1_ACC_A
    input2 = _FP2_ACC_A
    input3 = _FP3_ACC_A
    input4 = _FP4_ACC_A
    offset = _PATTERN_SELECT
    output1 = _FP_ACC_A

[switch]
    input1 = _FP1_ACC_B
    input2 = _FP2_ACC_B
    input3 = _FP3_ACC_B
    input4 = _FP4_ACC_B
    offset = _PATTERN_SELECT
    output1 = _FP_ACC_B

# ---- Half Merge (combine A+B via page select) ----

[switch]
    input1 = _FP_PITCH_A
    input2 = _FP_PITCH_B
    offset = _SEQ_PAGE
    output1 = _FP_PITCH

[switch]
    input1 = _FP_GATE_A
    input2 = _FP_GATE_B
    offset = _SEQ_PAGE
    output1 = _FP_GATE

[switch]
    input1 = _FP_ACC_A
    input2 = _FP_ACC_B
    offset = _SEQ_PAGE
    output1 = _FP_ACC

# ---- Slide Density Per Pattern ----

[switch]
    input1 = 0.06
    input2 = 0.25
    input3 = 0.63
    input4 = 0
    offset = _PATTERN_SELECT
    output1 = _FP_SLIDE_PROB

# ---- Mode Mux (generative vs fixed) ----

[switch]
    input1 = _PITCH_RAW
    input2 = _FP_PITCH
    offset = _FIXED_MODE
    output1 = _PITCH_MUX

[switch]
    input1 = _GATE
    input2 = _FP_GATE
    offset = _FIXED_MODE
    output1 = _GATE_MUX

[switch]
    input1 = _ACCENT
    input2 = _FP_ACC
    offset = _FIXED_MODE
    output1 = _ACCENT_MUX

[switch]
    input1 = _TRIGGER
    input2 = _CLOCK * _FIXED_MODE
    offset = _FIXED_MODE
    output1 = _TRIGGER_MUX

[switch]
    input1 = _SLIDE_PROB
    input2 = _FP_SLIDE_PROB
    offset = _FIXED_MODE
    output1 = _SLIDE_PROB_MUX

[switch]
    input1 = _STEPS
    input2 = 16
    offset = _FIXED_MODE
    output1 = _STEPS_MUX

# -------------------------------------------------
# Slide Generator
# -------------------------------------------------

# Probabilistic slide decision per step
[bernoulli]
    input = _TRIGGER_MUX
    distribution = _SLIDE_PROB_MUX
    output1 = _SLIDE_ON_TRIG
    output2 = _SLIDE_OFF_TRIG

# Latch slide state until next step
[flipflop]
    set = _SLIDE_ON_TRIG
    reset = _SLIDE_OFF_TRIG + _RESET
    output = _SLIDE_FLAG

# -------------------------------------------------
# Scale Quantization
# -------------------------------------------------

[minifonion]
    input = _PITCH_MUX
    root = 0
    degree = _SCALE_DEGREE
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _PITCH_SCALED

# -------------------------------------------------
# Pitch Fold (keep within octave range)
# -------------------------------------------------

[fold]
    input = _PITCH_SCALED
    minimum = 0
    maximum = _OCTAVE_RANGE
    foldby = 1V
    output = _PITCH_FOLDED

# -------------------------------------------------
# Slide / Portamento
# -------------------------------------------------

[slew]
    input = _PITCH_FOLDED
    slew = P2.2
    gate = _SLIDE_FLAG
    exponential = _PITCH_FINAL

# -------------------------------------------------
# Accent Envelope
# -------------------------------------------------

[contour]
    gate = _GATE_MUX
    attack = 0.002
    decay = 0.15
    sustain = 0
    release = 0.01
    velocity = _ACCENT_MUX * P2.1 + 0.5
    shape = 0.7
    output = _ENVELOPE

# -------------------------------------------------
# BOC Trigger (beginning of cycle)
# -------------------------------------------------

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _STEPS_MUX
    output = _BOC

# -------------------------------------------------
# Outputs
# -------------------------------------------------

# O1: Pitch CV with slide
[copy]
    input = _PITCH_FINAL
    output = O1

# O2: Gate
[copy]
    input = _GATE_MUX
    output = O2

# O3: Accent envelope
[copy]
    input = _ENVELOPE
    output = O3

# O4: Accent CV (raw 0/1)
[copy]
    input = _ACCENT_MUX
    output = O4

# O5: Slide gate
[copy]
    input = _SLIDE_FLAG
    output = O5

# O6: Clock thru
[copy]
    input = _CLOCK
    output = O6

# O7: Beginning of cycle
[copy]
    input = _BOC
    output = O7
