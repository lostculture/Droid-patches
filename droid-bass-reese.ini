# Reese Bass Modulation Engine
# CV co-processor for classic Reese bass — two detuned sawtooth oscillators
# creating inherent phasing and beating. The movement comes from the detune
# itself. Slow filter sweeps add movement on top. This is the foundational
# DnB/jungle bass sound. Designed for longer sustained notes.
#
# Part of the bass modulation engine series. Receives gate/pitch from a
# sequencer and outputs genre-specific CVs for filter, VCA, and modulation.
#
# INPUTS:
#   I1: Gate/Trigger (note on/off)
#   I2: Clock (for optional tempo-synced filter LFO)
#   I3: Pitch CV (1V/oct from sequencer)
#   I4: Accent/Velocity CV (optional, 0-1)
#
# OUTPUTS:
#   O1: Pitch CV osc1 (base pitch + detune — absolute 1V/oct)
#   O2: Filter CV (envelope + slow LFO movement)
#   O3: VCA CV (amplitude envelope)
#   O4: Pitch CV osc2 (base pitch - detune — absolute 1V/oct)
#   O5: Resonance CV (moderate ~20%)
#   O6: Slow triangle LFO (for routing to phaser/chorus depth)
#   O7: Sub level (unmodulated)
#   O8: Gate out
#
# CONTROLLER 1 (p2b8):
#   P1.1: Detune amount (quadratic, sweet spot in 5-15 cents range)
#   P1.2: Filter sweep depth (quadratic with offset)
#   B1.1: Active (LED)
#   B1.2: Detune character (3 states: subtle 5-10 / classic 10-20 / aggressive 25-50 cents)
#   B1.3: Filter movement (2 states: slow envelope / LFO pulsing)
#   B1.4: Detune drift toggle (very slow LFO modulates detune amount)
#   B1.5: Width (2 states: mono/spread — mono uses same detune sign for both)
#   B1.6: DnB mode toggle (adds 1/8th note filter LFO for rhythmic Reese)
#
# SUGGESTED ROUTING:
#   O1 -> Troika voice 1 pitch (+detune)
#   O4 -> Troika voice 2 pitch (-detune)
#   O2 -> C4RBN cutoff (or Ikarie for dual-peak character)
#   O3 -> Aikido VCA
#   O6 -> Toad depth (phaser enhances Reese phasing)

[p2b8]

# ================================================================
# Controls
# ================================================================

# -------------------------------------------------
# Pots — Sweet Spot Tuned
# -------------------------------------------------

# P1.1: Detune amount — quadratic scaling for tight detune range
# Most pot travel in 5-15 cents (the Reese sweet spot).
# Pot output is 0-1, squared gives resolution at low end.
# This raw 0-1 value is scaled later by the character switch.
[copy]
    input = P1.1 * P1.1
    output = _DETUNE_RAW

# P1.2: Filter sweep depth — quadratic with offset
# Sweet spot 30-60%. Maps to 0.1-0.95 range.
# P1.2=0 -> 0.1, P1.2=0.5 -> 0.31, P1.2=1 -> 0.95
[copy]
    input = P1.2 * P1.2 * 0.85 + 0.1
    output = _SWEEP_DEPTH

# -------------------------------------------------
# Buttons
# -------------------------------------------------

# B1.1: Active toggle (LED shows patch is active)
[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _ACTIVE

# B1.2: Detune character — 3 states
# Subtle: 5-10 cents (0.0042-0.0083V)
# Classic: 10-20 cents (0.0083-0.0167V)
# Aggressive: 25-50 cents (0.0208-0.0417V)
#
# Each state provides a min and max detune voltage.
# _DETUNE_RAW (quadratic pot 0-1) interpolates between min and max.
[button]
    button = B1.2
    led = L1.2
    states = 3
    output = _CHAR_STATE

# Minimum detune for each character state
[switch]
    input1 = 0.0042    # subtle min: 5 cents
    input2 = 0.0083    # classic min: 10 cents
    input3 = 0.0208    # aggressive min: 25 cents
    offset = _CHAR_STATE
    output1 = _DETUNE_MIN

# Maximum detune for each character state
[switch]
    input1 = 0.0083    # subtle max: 10 cents
    input2 = 0.0167    # classic max: 20 cents
    input3 = 0.0417    # aggressive max: 50 cents
    offset = _CHAR_STATE
    output1 = _DETUNE_MAX

# Compute detune voltage: min + raw * (max - min)
# _DETUNE_RAW is quadratic so most pot travel is in the lower detune range
[copy]
    input = _DETUNE_MIN + _DETUNE_RAW * (_DETUNE_MAX - _DETUNE_MIN)
    output = _DETUNE_BASE

# B1.3: Filter movement — 2 states: slow envelope / LFO pulsing
# State 0: no LFO, filter envelope carries the movement
# State 1: 0.1 Hz triangle at 20% depth added to filter CV
[button]
    button = B1.3
    led = L1.3
    states = 2
    output = _FILTER_MODE

# B1.4: Detune drift toggle — very slow LFO modulates detune amount
[button]
    button = B1.4
    led = L1.4
    output = _DRIFT_ON

# B1.5: Width — 2 states: mono / spread
# Mono: both oscillators tuned sharp (same sign)
# Spread: one sharp, one flat (classic Reese)
[button]
    button = B1.5
    led = L1.5
    states = 2
    output = _WIDTH_STATE

# Width multiplier for osc2 detune direction
# Mono (state 0): osc2 = I3 + detune (same as osc1)
# Spread (state 1): osc2 = I3 - detune (classic Reese)
[switch]
    input1 = 1         # mono: +detune (same direction as osc1)
    input2 = -1        # spread: -detune (opposite direction)
    offset = _WIDTH_STATE
    output1 = _OSC2_SIGN

# B1.6: DnB mode toggle — 1/8th note synced filter LFO
[button]
    button = B1.6
    led = L1.6
    output = _DNB_MODE

# ================================================================
# Detune Processing
# ================================================================

# -------------------------------------------------
# Detune drift LFO — very slow modulation of detune amount
# -------------------------------------------------
# 0.02 Hz (~50 second cycle), modulates detune by +/- 30%.
# Creates shifting phasing speed. Only active when B1.4 is on.

[lfo]
    hz = 0.02
    triangle = _DRIFT_RAW

# Drift scales detune by +/- 30% when enabled
# When off: multiplier = 1. When on: multiplier = 1 + (triangle * 0.3)
[copy]
    input = _DETUNE_BASE * (1 + _DRIFT_RAW * 0.3 * _DRIFT_ON)
    output = _DETUNE_CV

# -------------------------------------------------
# Pitch CV computation — absolute 1V/oct outputs
# -------------------------------------------------
# O1 = I3 + detune (always sharp)
# O4 = I3 + (detune * osc2_sign) — sharp in mono, flat in spread

[copy]
    input = I3 + _DETUNE_CV
    output = _PITCH_OSC1

[copy]
    input = I3 + _DETUNE_CV * _OSC2_SIGN
    output = _PITCH_OSC2

# ================================================================
# LFO Section — Filter Movement
# ================================================================

# -------------------------------------------------
# Slow filter LFO — 0.1 Hz triangle
# -------------------------------------------------
# Used in LFO pulsing mode (B1.3 state 1). Adds gentle movement
# to the filter cutoff on top of the envelope.

[lfo]
    hz = 0.1
    triangle = _FILTER_LFO_RAW

# Scale by 20% depth, only active in LFO mode (not DnB mode)
# DnB mode overrides this with tempo-synced LFO
[copy]
    input = _FILTER_LFO_RAW * 0.2 * _FILTER_MODE * (1 - _DNB_MODE)
    output = _FILTER_LFO_SCALED

# -------------------------------------------------
# DnB tempo-synced filter LFO — 1/8th note
# -------------------------------------------------
# Uses clocktool to derive 1/8th note clock from I2,
# then resets an LFO at that rate. Only active when B1.6 is on.

# Multiply input clock by 2 for 1/8th note rate
[clocktool]
    clock = I2
    multiply = 2
    output = _EIGHTH_CLOCK

# LFO synced to 1/8th notes — triangle wave
[lfo]
    hz = 4
    reset = _EIGHTH_CLOCK
    triangle = _DNB_LFO_RAW

# Scale DnB LFO — 30% depth, only when DnB mode is active
[copy]
    input = _DNB_LFO_RAW * 0.3 * _DNB_MODE
    output = _DNB_LFO_SCALED

# -------------------------------------------------
# Slow triangle LFO — for phaser/chorus routing (O6)
# -------------------------------------------------
# 0.08 Hz, always running. For external phaser depth etc.

[lfo]
    hz = 0.08
    triangle = _SLOW_TRI_RAW

# ================================================================
# Envelope Section
# ================================================================

# -------------------------------------------------
# Filter envelope — slow sweep for Reese character
# -------------------------------------------------
# Attack 10ms, Decay 300ms, Sustain 20%, Release 400ms.
# This shapes the filter opening on each note. Depth from P1.2.

[contour]
    gate = I1 * _ACTIVE
    attack = 0.002     # 10ms
    decay = 0.06       # 300ms
    sustain = 0.2
    release = 0.08     # 400ms
    output = _FILTER_ENV

# -------------------------------------------------
# VCA envelope — sustained bass with controlled release
# -------------------------------------------------
# Instant attack, full sustain, 200ms release.
# Designed for longer sustained notes.

[contour]
    gate = I1 * _ACTIVE
    attack = 0         # instant
    decay = 0
    sustain = 1.0
    release = 0.04     # 200ms
    output = _VCA_ENV

# ================================================================
# CV Mixing — Filter Cutoff
# ================================================================

# -------------------------------------------------
# Combine all filter modulation sources
# -------------------------------------------------
# Filter CV = base offset (0.15)
#           + (filter env * sweep depth)
#           + slow LFO (if LFO mode)
#           + DnB LFO (if DnB mode)
#           + accent boost

# Apply sweep depth to filter envelope
[copy]
    input = _FILTER_ENV * _SWEEP_DEPTH
    output = _FILTER_ENV_SCALED

# Accent adds extra filter brightness (velocity * 15% of sweep depth)
[copy]
    input = I4 * _SWEEP_DEPTH * 0.15
    output = _ACCENT_BOOST

# Sum all filter CV sources
# Base offset 0.15 — Reese bass lives in the low-mid range
[copy]
    input = 0.15 + _FILTER_ENV_SCALED + _FILTER_LFO_SCALED + _DNB_LFO_SCALED + _ACCENT_BOOST
    output = _FILTER_CV

# -------------------------------------------------
# Resonance — moderate static level (~20%)
# -------------------------------------------------
# Slight resonance adds warmth without self-oscillation.

[copy]
    input = 0.20
    output = _RESONANCE_CV

# -------------------------------------------------
# Sub level — high, unmodulated
# -------------------------------------------------
# Fixed output for driving a sub oscillator or mixer channel.

[copy]
    input = 0.85
    output = _SUB_LEVEL

# ================================================================
# Outputs
# ================================================================

# O1: Pitch CV osc1 — base pitch + detune (absolute 1V/oct)
[copy]
    input = _PITCH_OSC1
    output = O1

# O2: Filter CV — envelope + LFO movement
[copy]
    input = _FILTER_CV
    output = O2

# O3: VCA CV — amplitude envelope
[copy]
    input = _VCA_ENV
    output = O3

# O4: Pitch CV osc2 — base pitch +/- detune (absolute 1V/oct)
[copy]
    input = _PITCH_OSC2
    output = O4

# O5: Resonance CV — moderate ~20%
[copy]
    input = _RESONANCE_CV
    output = O5

# O6: Slow triangle LFO — for phaser/chorus depth routing
[copy]
    input = _SLOW_TRI_RAW * 0.5
    output = O6

# O7: Sub level — high, unmodulated
[copy]
    input = _SUB_LEVEL
    output = O7

# O8: Gate out — pass-through of input gate
[copy]
    input = I1 * _ACTIVE
    output = O8
