# Random Stepped Voltage
# Port of disting NT ae_random_stepped_voltage.lua
# by Andras Eichstaedt / Thorinside
#
# A remembered random CV sequence that repeats until
# rerolled. Freeze pauses the sequence in place.
# Auto-randomize generates a fresh pattern each cycle.
# Slew smooths transitions between steps.
#
# INPUTS:
#  I1: Clock (normaled to internal LFO)
#  I2: Reset
#
# OUTPUTS:
#  O1: CV Output (quantized to scale)
#  O2: Gate (fires every step)
#  O3: BOC Trigger (beginning of cycle)
#  O4-O8: [unused]
#
# CONTROLLER 1 (p2b8):
#  P1.1: Clock Rate
#  P1.2: Steps (1-8, notched)
#  B1.1: Run/Stop
#  B1.2: Reset
#  B1.3: Freeze (LED on = sequence paused)
#  B1.4: Reroll (new random sequence)
#  B1.5: Auto-randomize (LED on = new pattern each cycle)
#  B1.6: Slew (LED on = smooth transitions)
#  B1.7-B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Clock & Transport
# -------------------------------------------------

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    led = L1.2
    states = 1
    output = _RESET_BTN

[copy]
    input = I1 * _RUNNING
    output = _CLOCK_RAW

[copy]
    input = _RESET_BTN + I2
    output = _RESET

# -------------------------------------------------
# Freeze, Reroll & Slew Controls
# -------------------------------------------------

[button]
    button = B1.3
    led = L1.3
    output = _FREEZE

# Invert freeze: 1 when NOT frozen, 0 when frozen
[copy]
    input = -1 * _FREEZE + 1
    output = _NOT_FREEZE

# Gated clock: blocked when frozen
[copy]
    input = _CLOCK_RAW * _NOT_FREEZE
    output = _CLOCK

[button]
    button = B1.4
    led = L1.4
    states = 1
    output = _REROLL_BTN

[button]
    button = B1.5
    led = L1.5
    output = _AUTO_RANDOM

[button]
    button = B1.6
    led = L1.6
    output = _SLEW_ON

[pot]
    pot = P1.2
    notch = 0.143
    output = _STEPS_RAW

# -------------------------------------------------
# Auto-Randomize Trigger
# -------------------------------------------------
#
# BOC (beginning of cycle) fires once per N steps.
# When auto-randomize is on, BOC triggers a reroll.

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _STEPS_RAW * 7 + 1
    output = _BOC

[copy]
    input = _BOC * _AUTO_RANDOM + _REROLL_BTN
    output = _REROLL

# -------------------------------------------------
# Random Sequence (Algoquencer)
# -------------------------------------------------
#
# Dejavu = 1: remembers pattern until rerolled.
# Activity = 1: every step produces a gate.

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    reroll = _REROLL
    activity = 1
    variation = 0.5
    dejavu = 1
    steps = _STEPS_RAW * 7 + 1
    pitch = _CV_RAW
    gate = _GATE

# -------------------------------------------------
# Scale Quantization
# -------------------------------------------------

[minifonion]
    input = _CV_RAW
    root = 0
    degree = 7
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = _CV_Q

# -------------------------------------------------
# Slew (optional smoothing)
# -------------------------------------------------

[slew]
    input = _CV_Q
    slew = 0.05
    output = _CV_SLEWED

[switch]
    input1 = _CV_Q
    input2 = _CV_SLEWED
    offset = _SLEW_ON
    output = O1

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[copy]
    input = _GATE
    output = O2

[copy]
    input = _BOC
    output = O3
