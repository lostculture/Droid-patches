    	value2 	= _SAWTOOTH_7
    	value3 	= _RAMP_7
    	value4 	= _SQUARE_7
    	output 	= O7

[lfo]
   	hz 		= P1.1 * 1.5
	rate		= I8 * P1.2
    	bipolar 	= on
    	sine 		= _SINE_8
   	sawtooth 	= _SAWTOOTH_8
    	ramp 		= _RAMP_8
    	square 	= _SQUARE_8
    	level 	= 5V  	

[button]
    	button 	= B1.8
