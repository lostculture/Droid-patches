# Master page
# -------------------------------------------------

[compare]
    input = P1.2
    compare = 1
    precision = 0.15
    ifequal = 1
    else = 0
    output = _SELECT_5

# Mute 1
[button]
    button = B1.1
    select = _SELECT_5
    onvalue = _TRIG_KICK
    offvalue = 0
    led = L1.1
    output = G2

[button]
    states = 1
    button = B1.2
    select = _SELECT_5
    led = L1.2

[button]
    states = 1
    button = B2.1
    select = _SELECT_5
    led = L2.1

# Reset all patterns
[button]
    states = 1
    button = B2.2
    select = _SELECT_5
    led = L2.2
    output = _RESET_ALL

# Mute 2
