# Bouncing Ball
#
# Classic bouncing ball trigger generator. A trigger
# starts a sequence of increasingly rapid bounces that
# decay in amplitude — like a ball dropped onto a hard
# surface, bouncing faster and quieter until it rests.
#
# A decaying energy envelope controls both the LFO
# speed (inverse — bounces accelerate as energy drains)
# and the output amplitude (fades with each bounce).
#
# INPUTS:
#  I1: Trigger (start bounce sequence)
#  I2: [unused]
#
# OUTPUTS:
#  O1: Bounce triggers (amplitude-gated, naturally tapers)
#  O2: Bounce velocity CV (sampled at each bounce, staircase)
#  O3: Energy envelope (continuous decay curve)
#  O4: Accelerating clock (raw LFO, full amplitude)
#  O5: Sequence active gate (high while bouncing)
#  O6: Inverted envelope (0→1 rising, for modulation)
#  O7-O8: [unused]
#
# CONTROLLER 1 (p2b8):
#  P1.1: Speed (initial bounce rate + overall tempo)
#  P1.2: Decay (sequence length / energy loss rate)
#  B1.1: Trigger (manual bounce, LED = envelope active)
#  B1.2: Loop (LED on = auto-repeat when sequence ends)
#  B1.3: Gravity (3 states: light / medium / heavy)
#  B1.4: Bounce activity LED (flashes with each bounce)
#  B1.5-B1.8: [unused]

[p2b8]

# -------------------------------------------------
# Trigger
# -------------------------------------------------

[button]
    button = B1.1
    states = 1
    output = _TRIG_BTN

[copy]
    input = _TRIG_BTN + I1
    output = _TRIGGER

# -------------------------------------------------
# Controls
# -------------------------------------------------

[button]
    button = B1.2
    led = L1.2
    output = _LOOP

# Gravity: 3 levels of acceleration
# Light = gentle ramp, Heavy = dramatic acceleration
[button]
    button = B1.3
    led = L1.3
    states = 3
    output = _GRAV_RAW

# Map gravity to LFO speed range:
#   light (0) → 8 Hz range
#   medium (0.5) → 20 Hz range
#   heavy (1.0) → 32 Hz range
[copy]
    input = _GRAV_RAW * 24 + 8
    output = _GRAVITY

# -------------------------------------------------
# Energy Envelope
# -------------------------------------------------
#
# One-shot AD envelope. Attack = 0 (instant drop),
# decay = variable (controls sequence length).
# Sustain and release = 0 for clean one-shot.
# Loop mode auto-repeats when enabled.

[contour]
    gate = _TRIGGER
    attack = 0
    hold = 0
    decay = P1.2 * 3 + 0.05
    sustain = 0
    release = 0
    level = 1
    shape = 0.5
    retrigger = 1
    startfromzero = 0
    loop = _LOOP
    output = _ENVELOPE

# -------------------------------------------------
# Bounce Generator (accelerating LFO)
# -------------------------------------------------
#
# LFO speed = base + gravity * (1 - envelope)
#
# At trigger: envelope = 1, speed = base (slow first bounce)
# As energy decays: envelope → 0, speed → base + gravity
# (bounces get closer together, like a real ball)

[copy]
    input = -1 * _ENVELOPE + 1
    output = _INV_ENV

[copy]
    input = P1.1 * 6 + 1
    output = _BASE_SPEED

[copy]
    input = _INV_ENV * _GRAVITY + _BASE_SPEED
    output = _HZ

[lfo]
    hz = _HZ
    square = _BOUNCE_RAW

# -------------------------------------------------
# Bounce Processing
# -------------------------------------------------

# Amplitude-gated bounce: trigger level tracks envelope.
# As energy drains, trigger amplitude drops below the
# gate threshold and bounces naturally stop.
[copy]
    input = _BOUNCE_RAW * _ENVELOPE
    output = _BOUNCE_GATED

# Velocity: sample envelope at each bounce.
# Creates a staircase of decreasing values — one per
# bounce — for velocity-sensitive percussion or pitch.
[sample]
    input = _ENVELOPE
    trigger = _BOUNCE_RAW
    output = _VELOCITY

# Sequence active: high while envelope is above threshold
[compare]
    input = _ENVELOPE
    compare = 0.01
    ifgreater = 1
    else = 0
    output = _ACTIVE

# -------------------------------------------------
# LED Feedback
# -------------------------------------------------

# L1.1: envelope brightness (shows sequence activity)
[copy]
    input = _ENVELOPE
    output = L1.1

# L1.4: flash on each bounce
[copy]
    input = _BOUNCE_GATED
    output = L1.4

# -------------------------------------------------
# Outputs
# -------------------------------------------------

[copy]
    input = _BOUNCE_GATED
    output = O1

[copy]
    input = _VELOCITY
    output = O2

[copy]
    input = _ENVELOPE
    output = O3

[copy]
    input = _BOUNCE_RAW
    output = O4

[copy]
    input = _ACTIVE
    output = O5

[copy]
    input = _INV_ENV
    output = O6
