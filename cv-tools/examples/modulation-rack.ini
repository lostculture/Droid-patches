# Modulation Rack
# Quad LFO + random + crossfader + attenuverter
# Generated by DROID CV Tool Builder — 2026-03-24
#
# INPUTS:
#  I1: [rand.trigger]
#
# OUTPUTS:
#  O1: [qlfo.phase_0]
#  O2: [qlfo.phase_90]
#  O3: [xfade.output]
#  O4: [atten.output]
#
# CONTROLLER 1 (p2b8):
#  B1.5: [xfade.mix]
#  P1.1: [qlfo.rate]
#  P1.2: [atten.amount]
#

[p2b8]

# =========================================================
# QLFO — Quadrature LFO with 4 phase-shifted outputs
# (Doepfer A-143-9)
# =========================================================

# qlfo: Quadrature LFO (A-143-9)
# 0°=sine  90°=cosine  180°=-sine  270°=-cosine

[lfo]
    hz = P1.1 * 5 + 0.1
    sine = _qlfo_SIN
    cosine = _qlfo_COS

# 0° phase output (sine)
[copy]
    input = _qlfo_SIN
    output = O1

# 90° phase output (cosine)
[copy]
    input = _qlfo_COS
    output = O2

# 180° phase output (inverted sine)
[copy]
    input = -1 * _qlfo_SIN + 1
    output = _LFO_180

# 270° phase output (inverted cosine)
[copy]
    input = -1 * _qlfo_COS + 1
    output = _LFO_270

# =========================================================
# RAND — Stepped and smooth random CV generator
# (Doepfer A-149)
# =========================================================

# rand: stepped random (A-149)
[random]
    trigger = I1
    clock = I1
    minimum = 0
    maximum = 1
    output = _RAND_STEP

# rand: smooth random source (A-149)
[random]
    rate = P1.2
    minimum = 0
    maximum = 1
    output = _RAND_RAND_RAW

# rand: slew for smooth random
[slew]
    input = _RAND_RAND_RAW
    slewup = 0.5
    slewdown = 0.5
    output = _RAND_SMOOTH

# =========================================================
# XFADE — Fade between two CV sources
# (Doepfer A-134)
# =========================================================

# xfade: Crossfader (A-134)
# Mix: manual via B1.5

[crossfader]
    input1 = _LFO_180
    input2 = _RAND_SMOOTH
    mix = B1.5
    output = O3

# =========================================================
# ATTEN — Attenuate, invert, and offset CV signals
# (Doepfer A-133)
# =========================================================

# Attenuverter: scale input from -1x to +1x with optional offset
# amount pot center = zero, CW = positive, CCW = inverted

[copy]
    input = _RAND_STEP * (2 * P1.2 - 1)
    output = O4
