# CV Utility Rack
# Clock divider + S&H + slew + quantizer + comparator
# Generated by DROID CV Tool Builder — 2026-03-24
#
# INPUTS:
#  I1: [clkdiv.clock]
#  I2: [sh.signal]
#  I3: [comp.input]
#
# OUTPUTS:
#  O1: [quant.output]
#  O3: [comp.gate]
#  O4: [comp.inverted]
#
# CONTROLLER 1 (p2b8):
#  B1.1: [clkdiv.reset_btn]
#  B1.3: [quant.root]
#  B1.4: [quant.scale]
#  L1.1: [clkdiv.reset_led]
#  P1.1: [clkdiv.ratio]
#  P1.2: [comp.threshold]
#

[p2b8]

# =========================================================
# CLKDIV — Clock divider with selectable ratio and reset
# (Doepfer A-160)
# =========================================================

# clkdiv: reset button
[button]
    button = B1.1
    states = 1
    led = L1.1
    output = _CLKDIV_RESET_BTN

# clkdiv: clock divider (A-160)
[clocktool]
    clock = I1
    reset = _CLKDIV_RESET_BTN
    divide = P1.1 * 15 + 1
    output = _DIVIDED_CLK

# =========================================================
# SH — Sample & Hold / Track & Hold
# (Doepfer A-148)
# =========================================================

# sh: Sample & Hold
[sample]
    input = I2
    trigger = _DIVIDED_CLK
    output = _SH_OUT

# =========================================================
# GLIDE — Slew limiter with independent rise/fall times
# (Doepfer A-170)
# =========================================================

[slew]
    input = _SH_OUT
    slewup = P1.2
    slewdown = P1.2
    output = _SLEWED

# =========================================================
# QUANT — Musical scale quantizer with root and scale selection
# (Doepfer A-156)
# =========================================================

# quant: Quantizer (A-156)
# Root: B1.3 (0-11), Scale: B1.4 (0-15)

[minifonion]
    input = _SLEWED
    root = B1.3 * 11
    degree = B1.4 * 15
    select1 = 1
    select3 = 1
    select5 = 1
    select7 = 1
    select9 = 1
    select11 = 1
    select13 = 1
    output = O1

# =========================================================
# COMP — Compare two CVs, output gate when A > B
# (Doepfer A-167)
# =========================================================

# Comparator: gate high when input > reference
# Comparing I3 against threshold pot P1.2

[compare]
    input = I3
    compare = P1.2
    ifgreater = 1
    ifless = 0
    ifequal = 0
    output = _comp_gate

# Gate output
[copy]
    input = _comp_gate
    output = O3

# Inverted gate: HIGH when input <= reference
[copy]
    input = -1 * _comp_gate + 1
    output = O4
