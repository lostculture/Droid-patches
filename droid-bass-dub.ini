# Dub/Reggae Bass Modulation Engine
# CV co-processor for deep dub and reggae bass. Almost pure sub with very
# little upper harmonic content. Long sustain, controlled release, emphasis
# on weight and space between notes. Very subtle modulation — the sound is
# about restraint and physical pressure from deep sub frequencies.
#
# Part of the bass modulation engine series. Receives gate/pitch from a
# sequencer and outputs genre-specific CVs for filter, VCA, and modulation.
#
# INPUTS:
#   I1: Gate/Trigger (note on/off)
#   I2: Clock (unused in this patch, normaled)
#   I3: Pitch CV (1V/oct from sequencer)
#   I4: Accent/Velocity CV (optional, 0-1)
#
# OUTPUTS:
#   O1: Pitch CV (with optional pitch drop applied)
#   O2: Filter CV (mostly static low cutoff, minimal envelope)
#   O3: VCA CV (amplitude envelope — softened attack, long sustain)
#   O4: Dub siren LFO (for routing to delay send or pitch)
#   O5: Resonance CV (near zero — dub bass has no resonance)
#   O6: Space/reverb send level (from space switch)
#   O7: Sub level (high, mostly unmodulated)
#   O8: Gate out
#
# CONTROLLER 1 (p2b8):
#   P1.1: Weight (filter cutoff base — lower = deeper sub, 100-300 Hz)
#   P1.2: Release time (how long the note rings, 100ms-1s)
#   B1.1: Active (LED)
#   B1.2: Sub style (3 states: pure sine / warm / roots)
#   B1.3: Pitch drop toggle (1-semitone pitch drop at note start)
#   B1.4: Dub siren toggle (very slow pitch wobble)
#   B1.5: Space (2 states: tight / wide — affects release and reverb send)
#   B1.6: Pressure toggle (subtle LFO on VCA for physical pulsing)
#
# SUGGESTED ROUTING:
#   O1 -> Domino pitch (or A-110 for pure sine sub)
#   O2 -> A-120 cutoff (24dB transistor ladder for steep rolloff)
#   O3 -> Autodub VCA (literally designed for dub)
#   O4 -> Autodub send (dub siren to delay)
#   O6 -> Autodub send level
#   Effects chain: Analog Delay -> Spring Reverb

[p2b8]

# ================================================================
# Controls
# ================================================================

# -------------------------------------------------
# Pots — Sweet Spot Tuned
# -------------------------------------------------

# P1.1: Weight — inverse quadratic for deep sub range
# Fully CCW = deepest sub (0.05), CW = brighter (0.25)
# More resolution at the deep end where it matters
[copy]
    input = (1 - P1.1) * (1 - P1.1) * 0.2 + 0.05
    output = _WEIGHT

# P1.2: Release time — quadratic scaling
# First 50% of pot = 20-220ms, last 50% = 220-820ms
# Sweet spot 200-500ms gets the most resolution
[copy]
    input = P1.2 * P1.2 * 0.8 + 0.02
    output = _RELEASE_TIME

# -------------------------------------------------
# Buttons
# -------------------------------------------------

# B1.1: Active toggle (LED shows patch is active)
[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _ACTIVE

# B1.2: Sub style — 3 states: pure sine (10%) / warm (18%) / roots (28%)
# Shifts filter character by selecting different base cutoff presets
[button]
    button = B1.2
    led = L1.2
    states = 3
    output = _STYLE_STATE

[switch]
    input1 = 0.10     # pure: almost no harmonics
    input2 = 0.18     # warm: slight upper warmth
    input3 = 0.28     # roots: more body, still deep
    offset = _STYLE_STATE
    output1 = _STYLE_OFFSET

# B1.3: Pitch drop toggle — enables 1-semitone drop at note start
[button]
    button = B1.3
    led = L1.3
    output = _PITCH_DROP_ON

# B1.4: Dub siren toggle — enables very slow pitch wobble
[button]
    button = B1.4
    led = L1.4
    output = _SIREN_ON

# B1.5: Space — 2 states: tight / wide
# Tight = normal release, no reverb send
# Wide = doubled release, reverb send active
[button]
    button = B1.5
    led = L1.5
    states = 2
    output = _SPACE_STATE

[switch]
    input1 = 1        # tight: release multiplier 1x
    input2 = 2        # wide: release multiplier 2x
    offset = _SPACE_STATE
    output1 = _SPACE_RELEASE_MULT

[switch]
    input1 = 0        # tight: no reverb send
    input2 = 0.7      # wide: reverb send level
    offset = _SPACE_STATE
    output1 = _REVERB_SEND

# B1.6: Pressure toggle — subtle VCA breathing
[button]
    button = B1.6
    led = L1.6
    output = _PRESSURE_ON

# ================================================================
# Pitch Processing
# ================================================================

# -------------------------------------------------
# Pitch drop contour — 1-semitone drop at note start
# -------------------------------------------------
# Attack 0, Decay 100ms, Sustain 0. Inverted and scaled to ~1 semitone
# (0.083V). Subtracts from pitch when toggle is on.

[contour]
    gate = I1 * _ACTIVE
    attack = 0
    decay = 0.02      # 100ms
    sustain = 0
    release = 0.02    # 100ms
    output = _PITCH_DROP_ENV

# Scale to 1 semitone (0.083V) and gate with toggle
[copy]
    input = _PITCH_DROP_ENV * 0.083 * _PITCH_DROP_ON
    output = _PITCH_DROP_CV

# -------------------------------------------------
# Dub siren LFO — very slow pitch wobble
# -------------------------------------------------
# 0.07 Hz (~14 second cycle), +/- 2 semitones (0.167V)
# Only active when siren toggle is on.

[lfo]
    hz = 0.07
    sine = _SIREN_RAW

[copy]
    input = _SIREN_RAW * 0.167 * _SIREN_ON
    output = _SIREN_CV

# Combine pitch: input pitch - pitch drop + siren wobble
[copy]
    input = I3 - _PITCH_DROP_CV + _SIREN_CV
    output = _PITCH_OUT

# ================================================================
# Envelope Section
# ================================================================

# -------------------------------------------------
# VCA envelope — softened attack, long sustain
# -------------------------------------------------
# Attack 10ms (softened to avoid speaker pops), Sustain 100%,
# Release from P1.2 (100ms-1s). Space switch doubles release.

[copy]
    input = _RELEASE_TIME * _SPACE_RELEASE_MULT
    output = _VCA_RELEASE

[contour]
    gate = I1 * _ACTIVE
    attack = 0.002    # 10ms — softened for speaker safety
    decay = 0
    sustain = 1.0
    release = _VCA_RELEASE
    output = _VCA_ENV

# -------------------------------------------------
# Pressure LFO — very subtle VCA breathing
# -------------------------------------------------
# 0.08 Hz, tiny depth. Physical pulsing feel. Only when toggle on.

[lfo]
    hz = 0.08
    sine = _PRESSURE_RAW

[copy]
    input = _VCA_ENV * (1 + _PRESSURE_RAW * 0.04 * _PRESSURE_ON)
    output = _VCA_CV

# -------------------------------------------------
# Filter envelope — tiny optional contour
# -------------------------------------------------
# 0 attack, 400ms decay, 10% sustain. Very shallow depth (0.5 octave max).
# This is almost inaudible — just enough to soften the note onset slightly.

[contour]
    gate = I1 * _ACTIVE
    attack = 0
    decay = 0.08      # 400ms
    sustain = 0.1
    release = _VCA_RELEASE
    output = _FILTER_ENV

# ================================================================
# CV Mixing — Filter Cutoff
# ================================================================

# -------------------------------------------------
# Combine filter sources
# -------------------------------------------------
# Filter CV = weight (from pot) + style offset + tiny envelope
# This is deliberately minimal — dub bass is almost static filtering.

[copy]
    input = _WEIGHT + _STYLE_OFFSET + _FILTER_ENV * 0.05
    output = _FILTER_CV

# -------------------------------------------------
# Resonance — near zero (0-5%)
# -------------------------------------------------
# Dub bass has NO resonance. Just enough to keep the filter alive.

[copy]
    input = 0.03
    output = _RESONANCE_CV

# -------------------------------------------------
# Sub level — high, mostly unmodulated
# -------------------------------------------------
# Fixed high output for driving a sub oscillator or mixer channel.

[copy]
    input = 0.85
    output = _SUB_LEVEL

# ================================================================
# Outputs
# ================================================================

# O1: Pitch CV — with optional pitch drop and siren applied
[copy]
    input = _PITCH_OUT
    output = O1

# O2: Filter CV — mostly static low cutoff
[copy]
    input = _FILTER_CV
    output = O2

# O3: VCA CV — softened attack, long sustain, optional pressure
[copy]
    input = _VCA_CV
    output = O3

# O4: Dub siren LFO — for routing to delay send or pitch
[copy]
    input = _SIREN_RAW * _SIREN_ON
    output = O4

# O5: Resonance CV — near zero
[copy]
    input = _RESONANCE_CV
    output = O5

# O6: Space/reverb send level — from space switch
[copy]
    input = _REVERB_SEND
    output = O6

# O7: Sub level — high, mostly unmodulated
[copy]
    input = _SUB_LEVEL
    output = O7

# O8: Gate out — pass-through of input gate
[copy]
    input = I1 * _ACTIVE
    output = O8
