# DROID CV Recorder / Looper
# Dual-channel CV recorder inspired by Shakmat Bishop's Miscellany.
# Record knob movements and play them back as loops or one-shots.
# Two independent recorder channels share transport and playback controls.
#
# INPUTS:
#   I1: Clock (normaled to internal LFO)
#   I2: Play trigger (starts both channels)
#
# OUTPUTS:
#   O1: Ch1 CV out
#   O2: Ch2 CV out
#   O3: Ch1 gate out
#   O4: Ch2 gate out
#   O5: Clock thru
#
# CONTROLLER 1 (p2b8):
#   P1.1: Clock rate (internal LFO)
#   P1.2: Playback speed (0-2x) / Scrub position (when scrub enabled)
#   B1.1: Run/Stop (LED = running)
#   B1.2: Reset clock phase (momentary)
#   B1.3: Record Ch1 (LED = recording)
#   B1.4: Record Ch2 (LED = recording)
#   B1.5: Play Ch1 (LED = Ch1 playing)
#   B1.6: Stop / Play Ch2 (LED = Ch2 playing)
#   B1.7: Loop on/off (LED = looping)
#   B1.8: Reverse on/off (LED = reverse)
#
# CONTROLLER 2 (p2b8):
#   P2.1: Ch1 recording knob (capture CV while recording)
#   P2.2: Ch2 recording knob (capture CV while recording)
#   B2.1: Pause (LED = paused)
#   B2.2: Scrub enable (LED = P1.2 controls tape position)
#   B2.3: Save to SD card (momentary, LED flash)
#   B2.4: Load from SD card (momentary, LED flash)
#   B2.5: File number select (cycles 0-9, LED brightness)
#   L2.6: Tape overflow warning

[p2b8]
[p2b8]

# -------------------------------------------------
# Transport
# -------------------------------------------------

[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _RUNNING

[button]
    button = B1.2
    states = 1
    led = L1.2
    output = _RESET_BTN

[lfo]
    hz = 8 * P1.1 + 0.5
    square = N1
    reset = _RESET_BTN

[copy]
    input = I1 * _RUNNING
    output = _CLOCK

[copy]
    input = _CLOCK
    output = O5

# -------------------------------------------------
# CV Sources
# -------------------------------------------------

[pot]
    pot = P2.1
    output = _CV_CH1

[pot]
    pot = P2.2
    output = _CV_CH2

# -------------------------------------------------
# Shared Transport Controls
# -------------------------------------------------

# Play: merge button with external trigger input
[copy]
    input = B1.5 + I2
    output = _PLAY_TRIG

[button]
    button = B1.7
    led = L1.7
    output = _LOOP

[button]
    button = B1.8
    led = L1.8
    output = _REVERSE

[button]
    button = B2.1
    led = L2.1
    output = _PAUSE

[button]
    button = B2.2
    led = L2.2
    output = _SCRUB

# -------------------------------------------------
# Playback Speed
# -------------------------------------------------

# Speed: pot range 0-1 mapped to 0-2x (center = 1x normal)
[copy]
    input = P1.2 * 2
    output = _SPEED

# Negate speed when reverse is on
[switch]
    input1 = _SPEED
    input2 = -1 * _SPEED
    offset = _REVERSE
    output1 = _PLAYBACK_SPEED

# -------------------------------------------------
# Save / Load / File Select
# -------------------------------------------------

[button]
    button = B2.3
    states = 1
    led = L2.3
    output = _SAVE_TRIG

[button]
    button = B2.4
    states = 1
    led = L2.4
    output = _LOAD_TRIG

# File number: 10 states cycling 0-9
[button]
    button = B2.5
    states = 10
    led = L2.5
    output = _FILE_SELECT

# -------------------------------------------------
# Recorder Ch1
# -------------------------------------------------

[recorder]
    clock = _CLOCK
    cvin = _CV_CH1
    gatein1 = 1
    recordbutton = B1.3
    playbutton = _PLAY_TRIG
    stopbutton = B1.6
    loop = _LOOP
    pause = _PAUSE
    playbackspeed = _PLAYBACK_SPEED
    scrub = _SCRUB
    scrubposition = P1.2
    save = _SAVE_TRIG
    load = _LOAD_TRIG
    filenumber = _FILE_SELECT * 9
    recordled = L1.3
    playled = L1.5
    cvout = O1
    gateout1 = O3
    overflow = _OVERFLOW_1

# -------------------------------------------------
# Recorder Ch2
# -------------------------------------------------

[recorder]
    clock = _CLOCK
    cvin = _CV_CH2
    gatein1 = 1
    recordbutton = B1.4
    playbutton = _PLAY_TRIG
    stopbutton = B1.6
    loop = _LOOP
    pause = _PAUSE
    playbackspeed = _PLAYBACK_SPEED
    scrub = _SCRUB
    scrubposition = P1.2
    save = _SAVE_TRIG
    load = _LOAD_TRIG
    filenumber = _FILE_SELECT * 9 + 10
    recordled = L1.4
    playled = L1.6
    cvout = O2
    gateout1 = O4
    overflow = _OVERFLOW_2

# -------------------------------------------------
# LED Indicators
# -------------------------------------------------

# Overflow warning: lights if either channel overflows tape memory
[copy]
    input = _OVERFLOW_1 + _OVERFLOW_2
    output = L2.6
