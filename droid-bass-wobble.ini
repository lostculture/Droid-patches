# Dubstep Wobble Bass Modulation Engine
# CV co-processor for dubstep wobble bass. Tempo-synced LFO modulates filter
# cutoff for the signature "wub wub" sound. LFO rate switches between note
# divisions (half/quarter/eighth/sixteenth) for rhythmic variety. Rich filter
# sweeps with optional sub-octave drop and dual-LFO growl mode.
#
# Part of the bass modulation engine series. Receives gate/pitch from a
# sequencer and outputs genre-specific CVs for filter, VCA, and modulation.
#
# INPUTS:
#   I1: Gate/Trigger (note on/off)
#   I2: Clock (quarter note rate — REQUIRED for tempo sync)
#   I3: Pitch CV (1V/oct from sequencer)
#   I4: Accent/Velocity CV (optional, 0-1)
#
# OUTPUTS:
#   O1: Pitch CV (with optional sub-octave drop at note start)
#   O2: Filter CV (wobble LFO + initial transient + base cutoff)
#   O3: VCA CV (amplitude envelope)
#   O4: Wobble LFO raw (for driving other destinations)
#   O5: Resonance CV (moderate level)
#   O6: Growl LFO (second wobble at different rate, for extra movement)
#   O7: Sub level (static, for sub layer)
#   O8: Gate out
#
# CONTROLLER 1 (p2b8):
#   P1.1: Wobble depth (how far the LFO sweeps the filter, 0-100%)
#   P1.2: Filter base (where the wobble sits in the frequency range)
#   B1.1: Active (LED)
#   B1.2: LFO rate (4 states: half/quarter/eighth/sixteenth note)
#   B1.3: LFO shape (3 states: sine/triangle/square)
#   B1.4: Sub drop toggle (octave pitch drop at note start)
#   B1.5: Growl toggle (adds second LFO at different rate)
#   B1.6: Filter type hint (2 states: smooth/aggressive — shifts resonance)
#
# SUGGESTED ROUTING:
#   O1 -> Furthrrrr Generator pitch (rich harmonics needed for wobble)
#   O2 -> C4RBN cutoff CV
#   O3 -> Aikido VCA CV
#   O4 -> Flamingo fold amount (wavefolding between wobble peaks adds grit)
#   O6 -> Toad phaser depth

[p2b8]

# ================================================================
# Controls
# ================================================================

# -------------------------------------------------
# Pots — Sweet Spot Tuned
# -------------------------------------------------

# P1.1: Wobble depth — quadratic scaling for moderate range focus
# Sweet spot is 40-70%. Quadratic puts most resolution there.
# Maps pot 0-1 to 0.1-1.0 wobble depth
[copy]
    input = P1.1 * P1.1 * 0.9 + 0.1
    output = _WOBBLE_DEPTH

# P1.2: Filter base — quadratic scaling for low range focus
# Sweet spot is low (100-250 Hz). Most resolution at the dark end.
# Maps pot 0-1 to 0.05-0.45 filter base CV
[copy]
    input = P1.2 * P1.2 * 0.4 + 0.05
    output = _FILTER_BASE

# -------------------------------------------------
# Buttons
# -------------------------------------------------

# B1.1: Active toggle (LED shows patch is active)
[button]
    button = B1.1
    led = L1.1
    startvalue = 1
    output = _ACTIVE

# B1.2: LFO rate — 4 states: half / quarter / eighth / sixteenth
[button]
    button = B1.2
    led = L1.2
    states = 4
    output = _RATE_STATE

# B1.3: LFO shape — 3 states: sine / triangle / square
[button]
    button = B1.3
    led = L1.3
    states = 3
    output = _SHAPE_STATE

# B1.4: Sub drop toggle (octave pitch drop at note start)
[button]
    button = B1.4
    led = L1.4
    output = _SUB_DROP_ON

# B1.5: Growl toggle (adds second LFO at different rate)
[button]
    button = B1.5
    led = L1.5
    output = _GROWL_ON

# B1.6: Filter type hint — 2 states: smooth / aggressive
# Shifts resonance level: smooth = 25%, aggressive = 45%
[button]
    button = B1.6
    led = L1.6
    states = 2
    output = _FILTER_TYPE_STATE

[switch]
    input1 = 0.25     # smooth
    input2 = 0.45     # aggressive
    offset = _FILTER_TYPE_STATE
    output1 = _RESONANCE_LEVEL

# ================================================================
# Clock Division — Tempo-Synced Rate Selection
# ================================================================

# -------------------------------------------------
# Generate four clock rates from the incoming quarter note clock
# -------------------------------------------------

# Half note (divide clock by 2)
[clocktool]
    clock = I2
    divide = 2
    output = _CLK_HALF

# Quarter note (pass-through)
[copy]
    input = I2
    output = _CLK_QUARTER

# Eighth note (multiply by 2)
[clocktool]
    clock = I2
    multiply = 2
    output = _CLK_EIGHTH

# Sixteenth note (multiply by 4)
[clocktool]
    clock = I2
    multiply = 4
    output = _CLK_SIXTEENTH

# -------------------------------------------------
# Select which clock drives the wobble LFO reset
# -------------------------------------------------
# B1.2 4-state button selects half/quarter/eighth/sixteenth

[switch]
    input1 = _CLK_HALF
    input2 = _CLK_QUARTER
    input3 = _CLK_EIGHTH
    input4 = _CLK_SIXTEENTH
    offset = _RATE_STATE
    output1 = _WOBBLE_RESET

# Also select the growl clock (one step faster than primary)
# Growl at one division faster creates rhythmic interplay
[switch]
    input1 = _CLK_QUARTER     # half -> growl at quarter
    input2 = _CLK_EIGHTH      # quarter -> growl at eighth
    input3 = _CLK_SIXTEENTH   # eighth -> growl at sixteenth
    input4 = _CLK_SIXTEENTH   # sixteenth -> growl stays at sixteenth
    offset = _RATE_STATE
    output1 = _GROWL_RESET

# ================================================================
# Wobble LFO — The Core "Wub Wub"
# ================================================================

# -------------------------------------------------
# Primary wobble LFO
# -------------------------------------------------
# The LFO free-runs at ~2 Hz but is reset by the selected clock
# division pulse each cycle, keeping it locked to tempo. The reset
# snaps the LFO phase back to zero on each clock pulse.

[lfo]
    hz = 2
    reset = _WOBBLE_RESET
    sine = _LFO_SINE
    triangle = _LFO_TRI
    square = _LFO_SQR

# -------------------------------------------------
# Select LFO shape via B1.3
# -------------------------------------------------
# 3 states: sine (smooth wobble) / triangle (sharper) / square (choppy)

[switch]
    input1 = _LFO_SINE
    input2 = _LFO_TRI
    input3 = _LFO_SQR
    offset = _SHAPE_STATE
    output1 = _WOBBLE_LFO_RAW

# Scale wobble LFO by depth knob
# LFO output is bipolar (-1 to 1). Shift to unipolar (0 to 1) for
# filter sweep, then scale by wobble depth.
[copy]
    input = (_WOBBLE_LFO_RAW * 0.5 + 0.5) * _WOBBLE_DEPTH
    output = _WOBBLE_LFO_SCALED

# -------------------------------------------------
# Growl LFO — second wobble at different rate
# -------------------------------------------------
# Mixed into filter CV at ~30% of primary depth when enabled.

[lfo]
    hz = 2
    reset = _GROWL_RESET
    sine = _GROWL_LFO_RAW

# Scale growl: 30% of primary depth, only when enabled
[copy]
    input = (_GROWL_LFO_RAW * 0.5 + 0.5) * _WOBBLE_DEPTH * 0.3 * _GROWL_ON
    output = _GROWL_LFO_SCALED

# ================================================================
# Envelope Section
# ================================================================

# -------------------------------------------------
# Initial filter transient — brightness burst at note start
# -------------------------------------------------
# Short contour that adds a bright attack before the LFO takes over.
# 0 attack, 200ms decay (~0.04), no sustain.

[contour]
    gate = I1 * _ACTIVE
    attack = 0
    decay = 0.04      # 200ms
    sustain = 0
    release = 0.04    # 200ms
    output = _FILTER_TRANSIENT

# -------------------------------------------------
# VCA envelope — instant attack, full sustain, short release
# -------------------------------------------------
# Sustained notes for dubstep. Instant open, held during gate,
# 80ms release (~0.016) for a clean but not abrupt cutoff.

[contour]
    gate = I1 * _ACTIVE
    attack = 0
    decay = 0
    sustain = 1.0
    release = 0.016   # 80ms
    output = _VCA_ENV

# -------------------------------------------------
# Sub drop envelope — octave pitch drop at note start
# -------------------------------------------------
# 0 attack, 80ms decay (~0.016). Produces a downward pitch sweep
# at note onset. Scaled to -1V (one octave down). Only active
# when sub drop toggle is on.

[contour]
    gate = I1 * _ACTIVE
    attack = 0
    decay = 0.016     # 80ms
    sustain = 0
    release = 0.016   # 80ms
    output = _SUB_DROP_ENV_RAW

# Scale sub drop: -1V (one octave down) when enabled
[copy]
    input = _SUB_DROP_ENV_RAW * -1 * _SUB_DROP_ON
    output = _SUB_DROP_CV

# ================================================================
# CV Mixing — Filter Cutoff
# ================================================================

# -------------------------------------------------
# Combine all filter modulation sources
# -------------------------------------------------
# Filter CV = filter base
#           + wobble LFO (scaled by depth)
#           + growl LFO (30% of depth, when enabled)
#           + initial transient (brightness burst)
#           + accent boost (velocity * 20% of wobble depth)

# Accent adds extra filter brightness
[copy]
    input = I4 * _WOBBLE_DEPTH * 0.2
    output = _ACCENT_BOOST

# Scale initial transient by wobble depth (so it matches the sweep range)
[copy]
    input = _FILTER_TRANSIENT * _WOBBLE_DEPTH * 0.5
    output = _TRANSIENT_SCALED

# Sum all filter CV sources
[copy]
    input = _FILTER_BASE + _WOBBLE_LFO_SCALED + _GROWL_LFO_SCALED + _TRANSIENT_SCALED + _ACCENT_BOOST
    output = _FILTER_CV

# ================================================================
# Pitch Processing
# ================================================================

# -------------------------------------------------
# Pitch with optional sub-octave drop
# -------------------------------------------------
# Sub drop contour sweeps pitch down one octave at note start,
# then returns to normal. Disabled by default (B1.4 toggle).

[copy]
    input = I3 + _SUB_DROP_CV
    output = _PITCH_CV

# ================================================================
# Outputs
# ================================================================

# O1: Pitch CV — with optional sub-octave drop at note start
[copy]
    input = _PITCH_CV
    output = O1

# O2: Filter CV — wobble LFO + initial transient + base cutoff
[copy]
    input = _FILTER_CV
    output = O2

# O3: VCA CV — amplitude envelope
[copy]
    input = _VCA_ENV
    output = O3

# O4: Wobble LFO raw — for driving other destinations (VCA, wavefolder, panning)
[copy]
    input = _WOBBLE_LFO_RAW * 0.5 + 0.5
    output = O4

# O5: Resonance CV — moderate level from smooth/aggressive switch
[copy]
    input = _RESONANCE_LEVEL
    output = O5

# O6: Growl LFO — second wobble at different rate, for extra movement
[copy]
    input = _GROWL_LFO_RAW * 0.5 + 0.5
    output = O6

# O7: Sub level — static for sub layer (60% level)
[copy]
    input = 0.6
    output = O7

# O8: Gate out — pass-through of input gate
[copy]
    input = I1 * _ACTIVE
    output = O8
